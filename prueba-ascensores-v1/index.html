<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>SINCRONIAIA — Demo Ascensores (Prueba aislada)</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
:root{--green:#00a884;--green2:#25d366;--ink:#111b21;--muted:#667781;--paper:#efeae2;--danger:#c62828;--danger-bg:#fff0f0;--amber:#8a5a00;--amber-bg:#fff7df;--blue:#0b57d0;--blue-bg:#eef5ff;--white:#fff}
body{background:#0b141a;color:var(--ink);display:flex;justify-content:center;align-items:center;height:100vh;height:100dvh;overflow:hidden}
.mobile-container{width:100%;max-width:480px;height:100%;background:var(--paper);display:flex;flex-direction:column;position:relative;box-shadow:0 4px 20px rgba(0,0,0,.5)}
@media(min-width:481px){.mobile-container{height:94vh;border-radius:20px;overflow:hidden}}
.wa-header{background:var(--green);color:#fff;padding:9px 12px;display:flex;align-items:center;gap:10px;z-index:10;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.avatar{width:42px;height:42px;border-radius:50%;background:#fff;color:var(--green);display:grid;place-items:center;font-size:22px;font-weight:800;box-shadow:inset 0 0 0 2px rgba(0,168,132,.18)}
.contact{min-width:0;flex:1}.contact h1{font-size:16px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.contact p{font-size:11px;opacity:.93;display:flex;align-items:center;gap:6px}.pulse{width:7px;height:7px;background:#b9ffdf;border-radius:50%;box-shadow:0 0 0 0 rgba(185,255,223,.8);animation:pulse 1.8s infinite}@keyframes pulse{70%{box-shadow:0 0 0 7px rgba(185,255,223,0)}100%{box-shadow:0 0 0 0 rgba(185,255,223,0)}}
.header-badge{font-size:10px;border:1px solid rgba(255,255,255,.65);padding:5px 8px;border-radius:14px;white-space:nowrap}
.chat{flex:1;padding:14px 12px 18px;overflow-y:auto;display:flex;flex-direction:column;gap:8px;background-image:radial-gradient(#d1d7db .75px,transparent .75px);background-size:24px 24px;background-color:var(--paper);scroll-behavior:smooth}
.day{align-self:center;background:#d7e7ee;color:#4a5f69;font-size:11px;padding:5px 9px;border-radius:7px;box-shadow:0 1px 1px rgba(0,0,0,.08);margin:2px 0 5px}
.msg{max-width:87%;padding:9px 11px 18px;border-radius:8px;font-size:14.5px;line-height:1.42;position:relative;box-shadow:0 1px 1px rgba(0,0,0,.08);animation:in .2s ease-out}@keyframes in{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.bot{background:#fff;align-self:flex-start;border-top-left-radius:2px}.user{background:#d9fdd3;align-self:flex-end;border-top-right-radius:2px}.time{position:absolute;right:7px;bottom:3px;font-size:9.5px;color:#7a8b93}.msg strong{font-weight:700}.msg .lead{display:block;font-size:15px;margin-bottom:4px}.msg ul{padding-left:18px;margin-top:5px}.msg li{margin:2px 0}
.options{display:flex;flex-wrap:wrap;gap:7px;align-self:flex-start;max-width:94%;margin:0 0 4px}.chip{background:#fff;color:var(--green);border:1px solid var(--green);padding:9px 12px;border-radius:17px;font-size:13px;cursor:pointer;font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.06);transition:.15s;touch-action:manipulation}.chip:active{transform:scale(.97);background:#e2fbf0}.chip.danger{border-color:var(--danger);color:var(--danger)}.chip.dark{border-color:#53656f;color:#35444c}
.notice{align-self:stretch;border-radius:12px;padding:11px 12px;font-size:13px;line-height:1.4;box-shadow:0 1px 2px rgba(0,0,0,.08);animation:in .2s ease-out}.notice strong{display:block;margin-bottom:3px}.notice.protocol{background:var(--blue-bg);border:1px solid #b9d2ff;color:#173f78}.notice.priority{background:var(--amber-bg);border:1px solid #f1cd6d;color:#684800}.notice.emergency{background:var(--danger-bg);border:1px solid #ef9a9a;color:#7a1717}.notice.success{background:#ecfbf5;border:1px solid #a8dfc9;color:#145b43}
.mini-status{align-self:flex-start;display:flex;gap:6px;align-items:center;background:rgba(255,255,255,.9);border:1px solid #d9e0e4;border-radius:12px;padding:6px 9px;font-size:11px;color:#53656f}.mini-status b{color:var(--green)}
.footer{background:#f0f2f5;padding:9px 10px;display:flex;align-items:center;gap:8px;border-top:1px solid #e0e3e5}.input{flex:1;background:#fff;border:none;border-radius:19px;padding:11px 14px;font-size:14px;outline:none;color:var(--ink)}.send{width:42px;height:42px;border:0;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center;cursor:pointer}.send svg{width:18px;height:18px}.reset{border:0;background:transparent;color:#53656f;font-size:20px;padding:8px;cursor:pointer}
.typing{align-self:flex-start;background:#fff;border-radius:8px;padding:9px 12px;color:#8a989f;font-size:12px}.dots span{display:inline-block;width:5px;height:5px;background:#9aa7ad;border-radius:50%;margin:0 1px;animation:dot 1.2s infinite}.dots span:nth-child(2){animation-delay:.15s}.dots span:nth-child(3){animation-delay:.3s}@keyframes dot{0%,60%,100%{transform:none;opacity:.45}30%{transform:translateY(-3px);opacity:1}}
@media(max-width:360px){.header-badge{display:none}.msg{font-size:14px}.chip{font-size:12.5px;padding:8px 10px}}
</style>
</head>
<body>
<div class="mobile-container">
  <header class="wa-header">
    <div class="avatar">↕</div>
    <div class="contact"><h1>Ascensores Demo · SINCRONIAIA</h1><p><span class="pulse"></span> atención 24/7 · protocolo activo</p></div>
    <div class="header-badge">PRUEBA AISLADA</div>
  </header>
  <main id="chat" class="chat" aria-live="polite"></main>
  <footer class="footer">
    <button class="reset" title="Reiniciar conversación" onclick="restart()">↻</button>
    <input id="input" class="input" autocomplete="off" placeholder="Escriba un mensaje…" onkeydown="if(event.key==='Enter')sendFree()">
    <button class="send" onclick="sendFree()" aria-label="Enviar"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M1.1 21.76 23.8 12.03 1.1 2.3l.01 7.91 13.62 1.82-13.62 1.82-.01 7.91z"/></svg></button>
  </footer>
</div>
<script>
const PROTOCOLO_DEMO={
  empresa:'Ascensores Demo',
  urgencias24h:true,
  atrapados:'PRIORIDAD ALTA → avisar al responsable/técnico de guardia según protocolo',
  emergencia:'RIESGO MÉDICO / HUMO / INCENDIO / PELIGRO → indicar 112 + escalar responsable según protocolo',
  averiaSinAtrapados:'Recoger incidencia completa → clasificar → dejar preparada para servicio técnico',
  tiemposLlegada:null,
  zonas:null,
  precios:null
};
let state={step:'menu',data:{},branch:null};
const chat=document.getElementById('chat');
const input=document.getElementById('input');
function t(){return new Date().toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'})}
function scroll(){setTimeout(()=>chat.scrollTop=chat.scrollHeight,60)}
function addMsg(html,who='bot'){const d=document.createElement('div');d.className='msg '+who;d.innerHTML=html+`<span class="time">${t()}</span>`;chat.appendChild(d);scroll();return d}
function addNotice(kind,title,body){const d=document.createElement('div');d.className='notice '+kind;d.innerHTML=`<strong>${title}</strong>${body}`;chat.appendChild(d);scroll()}
function addStatus(text){const d=document.createElement('div');d.className='mini-status';d.innerHTML=`<b>●</b> ${text}`;chat.appendChild(d);scroll()}
function buttons(items){const w=document.createElement('div');w.className='options';items.forEach(x=>{const b=document.createElement('button');b.className='chip '+(x.cls||'');b.textContent=x.label;b.onclick=()=>choose(x.label,x.value);w.appendChild(b)});chat.appendChild(w);scroll()}
function clearOptions(){document.querySelectorAll('.options').forEach(x=>x.remove())}
function typing(cb){const d=document.createElement('div');d.className='typing';d.innerHTML='SINCRONIAIA está revisando el protocolo <span class="dots"><span></span><span></span><span></span></span>';chat.appendChild(d);scroll();setTimeout(()=>{d.remove();cb()},420)}
function bot(html,opts){typing(()=>{addMsg(html,'bot');if(opts)buttons(opts)})}
function user(v){clearOptions();addMsg(escapeHtml(v),'user')}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function restart(){state={step:'menu',data:{},branch:null};chat.innerHTML='';const day=document.createElement('div');day.className='day';day.textContent='HOY · DEMOSTRACIÓN';chat.appendChild(day);addNotice('protocol','PROTOCOLO DE DEMOSTRACIÓN','Esta prueba simula cómo SINCRONIAIA seguiría las reglas de una empresa real. No envía avisos reales ni sustituye a servicios de emergencia.');bot('<span class="lead">Buenos días. Soy el asistente virtual de <strong>Ascensores Demo</strong>.</span>Puedo atenderle las 24 horas y seguir el protocolo establecido por la empresa.<br><br><strong>¿En qué puedo ayudarle?</strong>',mainOptions())}
function mainOptions(){return[
 {label:'🚨 Avería / persona atrapada',value:'averia',cls:'danger'},
 {label:'🔧 Mantenimiento',value:'mantenimiento'},
 {label:'🔄 Cambiar de mantenedor',value:'cambio'},
 {label:'🏗️ Instalación / modernización',value:'instalacion'},
 {label:'♿ Accesibilidad',value:'accesibilidad'},
 {label:'💬 Otra consulta',value:'otra',cls:'dark'}];}
function choose(label,val){user(label);route(val)}
function route(v){
 if(state.step==='menu')return startBranch(v);
 if(state.step==='hayAtrapados')return trapped(v);
 if(state.step==='estadoAtrapado')return trappedStatus(v);
 if(state.step==='tipoAveria')return faultType(v);
 if(state.step==='tipoInstalacion')return setType(v);
 if(state.step==='mantObjetivo')return maintenanceGoal(v);
 if(state.step==='numAsc')return countLifts(v);
 if(state.step==='motivoCambio')return changeReason(v);
 if(state.step==='instObjetivo')return installGoal(v);
 if(state.step==='accObjetivo')return accessGoal(v);
 if(state.step==='confirm')return confirm(v);
 if(state.step==='more')return more(v);
}
function startBranch(v){state.branch=v;
 if(v==='averia'){state.step='hayAtrapados';return bot('De acuerdo. Antes de continuar necesito comprobar algo importante:<br><br><strong>¿Hay alguna persona atrapada dentro del ascensor?</strong>',[{label:'🔴 Sí, hay personas atrapadas',value:'si',cls:'danger'},{label:'🟢 No',value:'no'},{label:'No lo sé',value:'ns',cls:'dark'}])}
 if(v==='mantenimiento'){state.step='mantObjetivo';return bot('Perfecto. ¿Qué necesita respecto al mantenimiento?', [{label:'Solicitar mantenimiento',value:'nuevo'},{label:'Consultar mantenimiento actual',value:'actual'},{label:'Tenemos muchas averías',value:'averias'},{label:'Otra consulta',value:'otra'}])}
 if(v==='cambio'){state.step='numAsc';state.data.solicitud='Cambio de empresa mantenedora';return bot('Podemos preparar la solicitud para que el equipo comercial no empiece desde cero.<br><br><strong>¿Cuántos ascensores tiene o gestiona?</strong>',[{label:'1',value:'1'},{label:'2',value:'2'},{label:'3–5',value:'3-5'},{label:'Más de 5',value:'5+'},{label:'No lo sé',value:'ns'}])}
 if(v==='instalacion'){state.step='instObjetivo';return bot('¿Qué situación quiere estudiar?', [{label:'Instalar un ascensor nuevo',value:'nuevo'},{label:'Modernizar uno existente',value:'modernizar'},{label:'Edificio sin ascensor',value:'sin'},{label:'No sé qué solución necesito',value:'ns'}])}
 if(v==='accesibilidad'){state.step='accObjetivo';return bot('Cuénteme qué necesidad quiere resolver. No hace falta que conozca la solución técnica.', [{label:'Subir una escalera',value:'escalera'},{label:'Acceder al edificio',value:'entrada'},{label:'Comunicar dos niveles',value:'niveles'},{label:'No sé qué solución necesito',value:'ns'}])}
 state.step='free';return bot('Puede escribir su consulta con sus propias palabras.<br><br>Si el dato no está configurado en el protocolo, <strong>no lo inventaré</strong>: registraré la consulta para que la empresa pueda revisarla.')
}
function trapped(v){state.data.atrapados=v;if(v==='si'){state.step='estadoAtrapado';addNotice('priority','🚨 INCIDENCIA PRIORITARIA DETECTADA','Personas atrapadas: SÍ · Aplicando protocolo de demostración.');addStatus('Regla encontrada: atrapados → prioridad alta');return bot('Entendido. Voy a seguir el protocolo de la empresa.<br><br><strong>¿Las personas atrapadas pueden comunicarse con normalidad y no describen una emergencia médica, humo, incendio o peligro inmediato?</strong>',[{label:'Sí, pueden comunicarse',value:'normal'},{label:'No / hay un problema médico',value:'medico',cls:'danger'},{label:'Hay humo, incendio o peligro',value:'peligro',cls:'danger'},{label:'No lo sé',value:'ns'}])}
 if(v==='no'){state.step='tipoAveria';return bot('Gracias. Al no haber personas atrapadas, clasificaremos la incidencia para que el servicio técnico reciba la información preparada.<br><br><strong>¿Qué está ocurriendo?</strong>',faultOptions())}
 state.step='estadoAtrapado';addNotice('priority','⚠️ SITUACIÓN POR CONFIRMAR','No sabemos si hay personas atrapadas. El protocolo prioriza aclarar este dato antes de continuar.');return bot('Si puede comprobarlo sin ponerse en riesgo, confirme si hay alguien dentro. Si existe peligro inmediato, siga el protocolo de emergencias.',[{label:'Sí, hay personas',value:'normal',cls:'danger'},{label:'No hay personas',value:'sin'},{label:'No puedo comprobarlo',value:'ns'}])
}
function trappedStatus(v){if(v==='medico'||v==='peligro'){addNotice('emergency','🆘 POSIBLE EMERGENCIA','En una implantación real, SINCRONIAIA seguiría el protocolo aprobado por la empresa. Ante una emergencia médica, humo, incendio o peligro inmediato, puede indicar contactar con el <strong>112</strong> y escalar al responsable configurado.');addStatus('Protocolo demo: 112 + responsable de guardia');state.step='askAddress';return bot('<strong>No voy a retrasar una posible emergencia haciendo preguntas comerciales.</strong><br><br>Después de indicar el procedimiento de emergencia, el sistema puede recoger la ubicación para dejar la incidencia preparada.<br><br>Escriba la <strong>dirección del edificio</strong>.')}
 if(v==='sin'){state.step='tipoAveria';return bot('De acuerdo. ¿Qué está ocurriendo con el ascensor?',faultOptions())}
 addNotice('protocol','🛡️ PROTOCOLO DE EMPRESA APLICADO','Persona atrapada sin peligro comunicado → prioridad alta → preparar aviso al responsable/técnico de guardia.');addStatus('Aviso real: pendiente de integración · esta demo no envía notificaciones');state.step='askAddress';return bot('La incidencia queda clasificada como prioritaria.<br><br>Necesito ahora la <strong>dirección exacta del edificio</strong>.')
}
function faultOptions(){return[{label:'No funciona',value:'parado'},{label:'Puertas bloqueadas',value:'puertas'},{label:'Se queda parado',value:'intermitente'},{label:'Hace ruidos',value:'ruidos'},{label:'Otro problema',value:'otro'}]}
function faultType(v){state.data.averia=v;state.step='askAddress';bot('Entendido. Ya he clasificado el tipo de incidencia.<br><br>Indíqueme la <strong>dirección exacta</strong> donde se encuentra el ascensor.')}
function maintenanceGoal(v){state.data.solicitud=v==='averias'?'Revisión por averías recurrentes':'Solicitud de mantenimiento';state.step='numAsc';bot('Para dejar la solicitud preparada, ¿cuántos ascensores hay en la instalación?', [{label:'1',value:'1'},{label:'2',value:'2'},{label:'3–5',value:'3-5'},{label:'Más de 5',value:'5+'},{label:'No lo sé',value:'ns'}])}
function countLifts(v){state.data.numAsc=v;state.step='motivoCambio';bot('¿Cuál es el motivo principal de la consulta?', [{label:'Averías frecuentes',value:'averias'},{label:'Atención / servicio',value:'atencion'},{label:'Coste',value:'coste'},{label:'Modernización',value:'modernizacion'},{label:'Otro',value:'otro'}])}
function changeReason(v){state.data.motivo=v;state.step='askAddress';bot('Perfecto. Esto ya se puede tratar como una <strong>oportunidad comercial cualificada</strong>.<br><br>Indíqueme la dirección o, si gestiona varias comunidades, el municipio principal.')}
function installGoal(v){state.data.solicitud='Instalación / modernización: '+v;state.step='askAddress';bot('Gracias. La solución exacta debe valorarla un técnico; no voy a inventarla.<br><br>Indíqueme la <strong>dirección o municipio</strong> de la instalación.')}
function accessGoal(v){state.data.solicitud='Accesibilidad: '+v;state.step='askAddress';bot('Entendido. Usted explica la necesidad y el técnico decide la solución adecuada.<br><br>Indíqueme la <strong>dirección o municipio</strong> donde habría que estudiar la accesibilidad.')}
function setType(v){state.data.tipo=v;state.step='askName';bot('Perfecto. ¿A nombre de quién dejamos la incidencia o solicitud?')}
function handleFreeText(txt){
 if(state.step==='askAddress'){state.data.direccion=txt;state.step='tipoInstalacion';return bot('Gracias. ¿De qué tipo de instalación se trata?', [{label:'Comunidad de propietarios',value:'comunidad'},{label:'Empresa / oficina',value:'empresa'},{label:'Vivienda particular',value:'vivienda'},{label:'Local comercial',value:'local'},{label:'Otro',value:'otro'}])}
 if(state.step==='askName'){if(txt.trim().length<3){return bot('Necesito un nombre válido para que la empresa pueda identificar el contacto. ¿Me lo indica, por favor?')}state.data.nombre=txt;state.step='askPhone';return bot('Gracias. Indíqueme ahora un <strong>teléfono de contacto</strong>.')}
 if(state.step==='askPhone'){const digits=txt.replace(/\D/g,'');if(digits.length<9){return bot('No parece un teléfono completo. Indíqueme al menos 9 dígitos, por favor.')}state.data.telefono=txt;return showSummary()}
 if(state.step==='free'){state.data.consulta=txt;addNotice('protocol','DATO NO CONFIGURADO → NO INVENTAR','La consulta se registra para que la empresa pueda revisarla. SINCRONIAIA no inventa precios, coberturas, tiempos de llegada ni procedimientos no incluidos en el protocolo.');state.step='askName';return bot('He registrado su consulta. ¿A nombre de quién la dejamos?')}
 // Natural emergency shortcuts from the free input at any early point
 const low=txt.toLowerCase();
 if(/atrapad|encerrad|dentro del ascensor/.test(low)){state.step='hayAtrapados';state.branch='averia';userEchoAlready=true;return trapped('si')}
 if(/precio|cu[aá]nto cuesta|tardar|tiempo de llegada/.test(low)){addNotice('protocol','INFORMACIÓN NO CONFIGURADA','El protocolo DEMO no contiene ese dato. Por seguridad, SINCRONIAIA no lo inventa.');return bot('Puedo registrar su consulta para que la empresa la confirme.')}
 bot('Puedo ayudarle mejor si elige una de las opciones principales.');state.step='menu';buttons(mainOptions())
}
function showSummary(){const d=state.data;let tipo=state.branch==='averia'?'INCIDENCIA':'SOLICITUD';addNotice('success','✓ '+tipo+' PREPARADA',`<b>Dirección:</b> ${escapeHtml(d.direccion||'—')}<br><b>Instalación:</b> ${escapeHtml(d.tipo||'—')}<br><b>Personas atrapadas:</b> ${d.atrapados==='si'?'SÍ':d.atrapados==='no'?'NO':'—'}<br><b>Motivo:</b> ${escapeHtml(d.solicitud||d.averia||d.motivo||d.consulta||'Consulta')}<br><b>Contacto:</b> ${escapeHtml(d.nombre||'—')} · ${escapeHtml(d.telefono||'—')}`);state.step='confirm';bot('<strong>No empieza desde cero. Empieza con información.</strong><br><br>¿Desea confirmar esta demostración o modificar algún dato?', [{label:'✅ Confirmar',value:'ok'},{label:'✏️ Modificar / reiniciar',value:'edit'}])}
function confirm(v){if(v==='edit')return restart();addStatus('DEMO: registro simulado · no se ha enviado ningún aviso real');state.step='more';bot('Perfecto. En una implantación real, a partir de aquí se aplicaría el protocolo autorizado: registro, aviso o derivación según corresponda.<br><br><strong>¿Desea probar otra situación?</strong>',[{label:'Sí, otra consulta',value:'si'},{label:'No, gracias',value:'no'}])}
function more(v){if(v==='si')return restart();addNotice('success','∞ SINCRONIAIA','La empresa puede cerrar. <strong>La atención no tiene por qué cerrarse.</strong><br><br>Menos tiempo preguntando lo mismo · incidencias mejor preparadas · oportunidades que no se pierden.');state.step='end';bot('Gracias por probar la demostración de Ascensores.<br><br><strong>La empresa define el protocolo. SINCRONIAIA lo aplica.</strong>')}
function sendFree(){const txt=input.value.trim();if(!txt)return;input.value='';clearOptions();addMsg(escapeHtml(txt),'user');handleFreeText(txt)}
restart();
</script>
</body>
</html>
