<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#efe9de">
<title>Can Soler Demo · SINCRONIAIA</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
:root{--green:#00a884;--ink:#111b21;--paper:#efeae2;--danger:#c62828;--amber-bg:#fff7df;--blue-bg:#eef5ff;--navy:#17223d}
body{background:#0b141a;color:var(--ink);display:flex;justify-content:center;align-items:center;height:100vh;height:100dvh;overflow:hidden}
.app{width:100%;max-width:480px;height:100%;background:var(--paper);display:flex;flex-direction:column;position:relative;box-shadow:0 4px 20px rgba(0,0,0,.5)}
@media(min-width:481px){.app{height:94vh;border-radius:20px;overflow:hidden}}
.header{background:var(--green);color:#fff;padding:9px 12px;display:flex;align-items:center;gap:10px;z-index:10;box-shadow:0 1px 3px rgba(0,0,0,.15);text-align:left}
.avatar{width:42px;height:42px;border-radius:50%;background:#fff;color:var(--navy);display:grid;place-items:center;font-family:Georgia,serif;font-size:18px;font-weight:900;flex:0 0 auto}
.headcopy{min-width:0;flex:1}.title{font-size:16px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.title .mark{font-family:inherit;color:inherit;font-size:inherit}.status{font-size:11px;opacity:.93;display:flex;align-items:center;gap:6px;margin-top:2px}.pulse{width:7px;height:7px;background:#b9ffdf;border-radius:50%;box-shadow:0 0 0 0 rgba(185,255,223,.8);animation:pulse 1.8s infinite}@keyframes pulse{70%{box-shadow:0 0 0 7px rgba(185,255,223,0)}100%{box-shadow:0 0 0 0 rgba(185,255,223,0)}}
.isolated{font-size:10px;border:1px solid rgba(255,255,255,.65);padding:5px 8px;border-radius:14px;white-space:nowrap;font-weight:500}
.thread{flex:1;padding:14px 12px 18px;overflow-y:auto;display:flex;flex-direction:column;gap:8px;background-image:radial-gradient(#d1d7db .75px,transparent .75px);background-size:24px 24px;background-color:var(--paper);scroll-behavior:smooth}
.day{align-self:center;background:#d7e7ee;color:#4a5f69;font-size:11px;padding:5px 9px;border-radius:7px;box-shadow:0 1px 1px rgba(0,0,0,.08);margin:2px 0 5px}
.row{display:flex;margin:0}.row.bot{justify-content:flex-start}.row.user{justify-content:flex-end}
.bubble{max-width:87%;padding:9px 11px 18px;border-radius:8px;font-size:14.5px;line-height:1.42;position:relative;box-shadow:0 1px 1px rgba(0,0,0,.08);animation:in .2s ease-out;white-space:normal}@keyframes in{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.bot .bubble{background:#fff;border-top-left-radius:2px}.user .bubble{background:#d9fdd3;border-top-right-radius:2px;color:var(--ink)}.time{position:absolute;right:7px;bottom:3px;font-size:9.5px;color:#7a8b93}
.note{font-size:11px;color:#53656f;margin:2px 3px 0}.chips{display:flex;flex-wrap:wrap;gap:7px;align-self:flex-start;max-width:94%;margin:0 0 4px}.chip{background:#fff;color:var(--green);border:1px solid var(--green);padding:9px 12px;border-radius:17px;font-size:13px;cursor:pointer;font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.06);touch-action:manipulation}.chip:active{transform:scale(.97);background:#e2fbf0}
.safe{align-self:stretch;border-radius:12px;padding:11px 12px;font-size:13px;line-height:1.4;box-shadow:0 1px 2px rgba(0,0,0,.08);background:var(--amber-bg);border:1px solid #f1cd6d;color:#684800}
.bottom{background:#f0f2f5;border-top:1px solid #e0e3e5;flex:0 0 auto}.quickbar{display:grid;grid-template-columns:1fr 1fr;gap:7px;padding:7px 10px 0}.quick{border:1px solid var(--green);background:#fff;color:#087c66;border-radius:16px;padding:8px 6px;font-weight:700;font-size:12px;cursor:pointer}.quick.secondary{border-color:#7c8990;color:#46555d}
.composer{position:static;transform:none;width:100%;max-width:none;background:transparent;border:0;padding:7px 10px 9px}.inputline{display:flex;gap:8px;align-items:center}.reset{border:0;background:transparent;color:#53656f;font-size:20px;padding:8px;cursor:pointer;width:auto;height:auto;border-radius:0;flex:0 0 auto}.inputline input{flex:1;min-width:0;height:auto;border:0;background:#fff;border-radius:19px;padding:11px 14px;font-size:14px;outline:none;color:var(--ink)}.send{width:42px;height:42px;border:0;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center;cursor:pointer;padding:0;font-size:0;flex:0 0 auto}.send:after{content:'➤';font-size:18px}.micro{display:none}
@media(max-width:360px){.isolated{display:none}.bubble{font-size:14px}.chip{font-size:12.5px;padding:8px 10px}.quick{font-size:11.5px}}
</style>
</head>
<body>
<div class="app">
  <header class="header">
    <div class="avatar">CS</div>
    <div class="headcopy">
      <div class="title"><span class="mark">Can Soler Demo</span> · SINCRONIAIA</div>
      <div class="status"><span class="pulse"></span> asistente en línea · reglas activas</div>
    </div>
    <div class="isolated">PRUEBA AISLADA</div>
  </header>

  <main id="thread" class="thread"></main>

  <div class="bottom">
    <div class="quickbar">
      <button class="quick" onclick="quickChoose()">✨ Ayúdame a elegir</button>
      <button class="quick secondary" onclick="quickOther()">💬 Otra consulta</button>
    </div>
    <div class="composer">
      <div class="inputline">
        <button class="reset" title="Reiniciar" onclick="resetDemo()">↻</button>
        <input id="msg" aria-label="Mensaje" placeholder="Escriba un mensaje…" autocomplete="off">
        <button class="send" onclick="sendFree()">Enviar</button>
      </div>
    </div>
  </div>
</div>

<script>
const thread = document.getElementById('thread');
const input = document.getElementById('msg');

let state = {flow:null, step:null, data:{}};

const HELADOS = [
  'After-eight','Agua de Badalona','Avellana','Café','Carrot Cake','Coco','Cola-cao',
  'Crema catalana','Dulce de leche','Donut','Pistacho','Yogur con mermelada de frambuesa',
  'Yogur natural','Kinder','Lemon pie','Leche merengada','Limón','Fresa','Melón','Nata',
  'Nata nueces','Orenata','Horchata','Pastel de Galleta','Piña','Plátano','Ron con pasas',
  'Sacher','San Marco','Sorbete de mandarina','Sorbete de mango','Sorbete de mojito',
  'Sorbete de frambuesa','Speculoos','Stracciatella','Tiramisú','Turrón de Jijona D.O.',
  'Turrón light','Turrón leche de coco','Trufa','Tutti frutti','Vainilla','Vainilla cookies',
  'Vainilla light','Vainilla macadamia','Xixollana','Chocolate 60% chocolate belga',
  'Chocolate bio light','Chocolate leche coco','Chocolate bio naranja'
];
const GRANIZADOS = ['Horchata natural de chufa','Leche merengada','Limón','Naranja','Fresa','Mango y maracuyá','Café','Trifásico de granizados'];
const ESPECIALES = ['Xixollana','Agua de Badalona','Palmera','Lletuga','Canario','Cubano','Blanco y negro','Café con leche de verano'];
const CREPES_DULCES = ['Sencilla','Especiada','Sorprendente','Blanca','Deseada','Nostálgica','Dulce','Esperada','Morena','Mermelada','Tropical','Canaria','Irresistible'];
const CREPES_SALADOS = ['Atún','Havarti y orégano','Pizzera','Mixta','Azul','Mallorquina','Atrevida','Parmesana','4 Quesos'];
const SMOOTHIES = ['Mora y plátano','Piña','Kiwi y naranja','Papaya y plátano','Mango y melocotón','Piña colada','Yogur'];

function E(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function norm(s){
  return s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim();
}
function now(){return new Date().toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'})}
function scrollEnd(){setTimeout(()=>thread.scrollTop=thread.scrollHeight,40)}
function addBot(html){
  const r=document.createElement('div'); r.className='row bot';
  r.innerHTML='<div class="bubble">'+html+'<span class="time">'+now()+'</span></div>'; thread.appendChild(r); scrollEnd();
}
function addUser(text){
  const r=document.createElement('div'); r.className='row user';
  const b=document.createElement('div'); b.className='bubble'; b.innerHTML=E(text)+'<span class="time">'+now()+'</span>';
  r.appendChild(b); thread.appendChild(r); scrollEnd();
}
function addNote(text){
  const d=document.createElement('div'); d.className='note'; d.textContent=text; thread.appendChild(d); scrollEnd();
}
function buttons(items){
  const d=document.createElement('div'); d.className='chips';
  items.forEach(label=>{
    const b=document.createElement('button'); b.className='chip'; b.textContent=label;
    b.onclick=()=>{addUser(label); onChoice(label)};
    d.appendChild(b);
  });
  thread.appendChild(d); scrollEnd();
}
function ask(text, items=[]){ addBot(text); if(items.length) buttons(items); }
function safety(text){ const d=document.createElement('div'); d.className='safe'; d.textContent=text; thread.appendChild(d); scrollEnd(); }

function start(){
  state={flow:null,step:null,data:{}};
  const day=document.createElement('div'); day.className='day'; day.textContent='HOY · DEMOSTRACIÓN'; thread.appendChild(day);
  safety('PROTOCOLO: esta prueba no realiza pedidos reales, no consulta stock en tiempo real y no inventa datos que no estén configurados.');
  ask('Buenos días. Soy el asistente virtual de <b>Can Soler</b>.<br><br>Puedo ayudarle a descubrir productos, buscar sabores, conocer especialidades y resolver consultas con la información configurada.<br><br><b>¿En qué puedo ayudarle?</b>',[
    '🍦 Helados','🥤 Horchata y granizados','⭐ Especialidades',
    '🥞 Crepes y gofres','🥛 Batidos y smoothies','📦 Llevar helado a casa',
    '⚠️ Alérgenos','📍 Puntos de venta','🏆 Conocer Can Soler'
  ]);
}

function quickChoose(){addUser('✨ Ayúdame a elegir'); flowElegir();}
function quickOther(){addUser('💬 Otra consulta'); flowOtra(); input.focus();}
function resetDemo(){ thread.innerHTML=''; start(); input.focus(); }

function onChoice(label){
  if(label==='Volver al inicio'){state={flow:null,step:null,data:{}}; return ask('¿En qué más puedo ayudarle?',['🍦 Helados','🥤 Horchata y granizados','⭐ Especialidades','🥞 Crepes y gofres','🥛 Batidos y smoothies','📦 Llevar helado a casa','⚠️ Alérgenos','📍 Puntos de venta','🏆 Conocer Can Soler']);}
  const l=norm(label.replace(/^[^\p{L}\p{N}]+/u,''));
  if(!state.flow){
    if(l.startsWith('helados')) return flowHelados();
    if(l.includes('horchata')) return flowGranizados();
    if(l.includes('ayudeme')) return flowElegir();
    if(l.includes('especialidades')) return flowEspeciales();
    if(l.includes('crepes')) return flowCrepes();
    if(l.includes('batidos')) return flowBatidos();
    if(l.includes('llevar helado')) return flowCasa();
    if(l.includes('alergenos')) return flowAlergenos();
    if(l.includes('puntos de venta')) return flowPuntos();
    if(l.includes('conocer can soler')) return flowHistoria();
    if(l.includes('otra consulta')) return flowOtra();
  }

  if(state.flow==='helados'){
    if(state.step==='formato'){
      state.data.formato=label;
      if(label==='Ver sabores') return showFlavours();
      state.step='sabor';
      ask('Perfecto. ¿Qué sabor quiere buscar? Puede escribirlo o ver una selección.', ['Pistacho','Xixollana','Turrón de Jijona D.O.','Chocolate','Fresa','Limón','Ver sabores']);
      return;
    }
    if(state.step==='sabor'){
      if(label==='Ver sabores') return showFlavours();
      replyFlavour(label);
      return;
    }
  }

  if(state.flow==='granizados'){
    if(state.step==='tipo'){
      if(label==='Ver opciones'){
        ask('En la carta publicada aparecen:', GRANIZADOS);
        state.step='producto';
      } else {
        addBot('Sí, esa opción aparece en la carta publicada de Can Soler. En esta prueba no confirmo disponibilidad diaria ni precio actual.');
        followup();
      }
      return;
    }
    if(state.step==='producto'){
      addBot('<b>'+label+'</b> aparece en la carta publicada. La disponibilidad del día debe confirmarse con el establecimiento.');
      followup(); return;
    }
  }

  if(state.flow==='especiales'){
    explainSpecial(label); return;
  }

  if(state.flow==='crepes'){
    if(state.step==='tipo'){
      state.step='crepe';
      if(label==='Dulces') ask('Estas son algunas opciones dulces publicadas:', CREPES_DULCES);
      else if(label==='Salados') ask('Estas son las opciones saladas publicadas:', CREPES_SALADOS);
      else {addBot('Can Soler publica crepes dulces, salados y gofres en su carta.'); followup();}
      return;
    }
    addBot('<b>'+label+'</b> figura en la carta publicada. Esta demo no confirma precio ni disponibilidad actual.');
    followup(); return;
  }

  if(state.flow==='batidos'){
    if(state.step==='tipo'){
      if(label==='Smoothies'){
        state.step='smoothie'; ask('Smoothies publicados:', SMOOTHIES);
      } else if(label==='Batidos'){
        addBot('La carta publica batido normal o con nata montada. El sabor concreto debe comprobarse según disponibilidad.');
        followup();
      } else {
        state={flow:'elegir',step:'perfil',data:{}};
        ask('¿Qué perfil le apetece?', ['Frutal','Cremoso','Refrescante','Algo muy Can Soler']);
      }
      return;
    }
    addBot('<b>'+label+'</b> aparece entre los smoothies publicados.'); followup(); return;
  }

  if(state.flow==='casa'){
    if(state.step==='formato'){
      addBot('El formato <b>'+label+'</b> aparece publicado. Antes de convertir esto en un pedido real habría que confirmar reglas, sabores máximos, precios y disponibilidad con Can Soler.');
      followup(); return;
    }
  }

  if(state.flow==='elegir'){
    recommend(label); return;
  }

  if(state.flow==='puntos'){
    pointsAnswer(label); return;
  }

  if(state.flow==='historia'){
    if(state.step==='historiaExtra'){
      if(label==='📖 Seguir conociendo Can Soler'){state.step='tema'; return ask('¿Qué otra parte quiere conocer?',['📖 La historia familiar','👨‍👩‍👧 Tres generaciones','🏆 Campeonato 2019','🏭 Obradores y elaboración','🍦 Qué hace especial a Can Soler']);}
      if(label==='⭐ Ver especialidades'){return flowEspeciales();}
    }
    historyAnswer(label); return;
  }

  if(state.flow==='alergenos'){
    addBot('Para una consulta de alérgenos necesito una tabla oficial aprobada por Can Soler. <b>No deduzco seguridad alimentaria por el nombre del producto.</b>');
    safety('DATO NO CONFIGURADO → NO INFERIR → NO INVENTAR → DERIVAR AL ESTABLECIMIENTO.');
    followup(); return;
  }

  if(state.flow==='otra'){
    addBot('Escríbame la consulta. Si el dato no está configurado, la demo no lo inventará y propondrá derivarlo al establecimiento.');
    return;
  }

  if(label==='Volver al inicio'){ state={flow:null,step:null,data:{}}; start(); }
}

function followup(){
  state={flow:null,step:null,data:{}};
  buttons(['Volver al inicio']);
}
function flowHelados(){
  state={flow:'helados',step:'formato',data:{}};
  ask('Claro. ¿Cómo lo quiere consultar?', ['Cucurucho','Tarrina','Para llevar','Ver sabores']);
}
function showFlavours(){
  state.flow='helados'; state.step='sabor';
  addBot('La web oficial publica una carta amplia de sabores. Puede buscar uno escribiendo su nombre. Entre ellos aparecen, por ejemplo: <b>Pistacho, Xixollana, Turrón de Jijona D.O., Crema catalana, Horchata, Stracciatella, Tiramisú, varios chocolates y sorbetes.</b>');
  buttons(['Pistacho','Xixollana','Turrón de Jijona D.O.','Chocolate','Limón']);
}
function replyFlavour(label){
  const n=norm(label);
  const hit=HELADOS.find(x=>norm(x).includes(n) || n.includes(norm(x)));
  if(hit) addBot('Sí. <b>'+hit+'</b> aparece en la carta publicada de Can Soler. En esta demo no confirmo que esté disponible hoy.');
  else {
    addBot('No encuentro <b>'+label+'</b> en los datos configurados de esta prueba.');
    safety('No inferir · no inventar · registrar / derivar.');
  }
  followup();
}
function flowGranizados(){
  state={flow:'granizados',step:'tipo',data:{}};
  ask('¿Qué desea consultar?', ['Horchata natural de chufa','Leche merengada','Granizado','Ver opciones']);
}
function flowEspeciales(){
  state={flow:'especiales',step:'especial',data:{}};
  ask('¿Qué especialidad quiere conocer?', ESPECIALES);
}
function explainSpecial(label){
  const data={
    'Agua de Badalona':'granizado de limón con menta peppermint y un toque de Anís del Mono dulce.',
    'Palmera':'horchata y granizado de limón.',
    'Lletuga':'granizado de limón con menta peppermint.',
    'Canario':'granizado de limón con una bola de helado de vainilla.',
    'Cubano':'horchata con una bola de helado de chocolate.',
    'Blanco y negro':'granizado de café con una bola de helado de leche merengada.',
    'Café con leche de verano':'leche merengada u horchata con café granizado.',
    'Xixollana':'un sabor publicado por Can Soler como ganador de España en 2019.'
  };
  addBot('<b>'+label+':</b> '+(data[label]||'especialidad publicada por Can Soler.'));
  followup();
}
function flowCrepes(){
  state={flow:'crepes',step:'tipo',data:{}};
  ask('¿Qué quiere consultar?', ['Dulces','Salados','Información general']);
}
function flowBatidos(){
  state={flow:'batidos',step:'tipo',data:{}};
  ask('¿Qué le interesa?', ['Batidos','Smoothies','Ayúdeme a elegir']);
}
function flowCasa(){
  state={flow:'casa',step:'formato',data:{}};
  ask('Para llevar, la web publica varios formatos de tarrina. ¿Cuál quiere consultar?', ['½ litro','½ litro porex','1,3 litros tupper','No lo sé']);
}
function flowElegir(){
  state={flow:'elegir',step:'perfil',data:{}};
  ask('Le ayudo. ¿Qué le apetece más?', ['Chocolate / intenso','Frutal / fresco','Cremoso','Muy refrescante','Algo muy Can Soler','No lo sé']);
}
function recommend(label){
  let t='';
  if(label.includes('Chocolate')) t='Puedo enseñarle opciones publicadas de chocolate, como chocolate belga, chocolate con leche de coco o combinaciones como el Cubano.';
  else if(label.includes('Frutal')) t='Podemos mirar helados y sorbetes de fruta, granizados o smoothies publicados.';
  else if(label.includes('Cremoso')) t='Podemos mirar sabores como vainilla, nata, yogur, leche merengada o turrón, entre los publicados.';
  else if(label.includes('refrescante')) t='Podemos empezar por horchata, granizados de fruta, sorbetes o combinados como Palmera o Lletuga.';
  else if(label.includes('muy Can Soler')) t='Yo empezaría por productos con identidad de la casa: Xixollana, Agua de Badalona, Palmera, Canario, Cubano o Café con leche de verano.';
  else t='Puedo hacerle una pregunta más: ¿prefiere helado, bebida fría o crepe?';
  addBot(t+' La recomendación se limita a productos configurados; no presupone stock actual.');
  followup();
}
function flowAlergenos(){
  state={flow:'alergenos',step:'consulta',data:{}};
  addBot('Indíqueme el alérgeno o producto que le preocupa.');
  safety('En alergias, esta demo no interpreta ingredientes ni promete ausencia de trazas sin la tabla oficial del establecimiento.');
}
function flowPuntos(){
  state={flow:'puntos',step:'punto',data:{}};
  ask('La web oficial publica estos puntos. ¿Cuál quiere consultar?', ['Can Soler Mar','Francesc Layret','Mercado de Montgat']);
}
function pointsAnswer(label){
  const p={
    'Can Soler Mar':'C/ Mar, 97 · 08911 Badalona · 934 642 083 · mar@cansoler.com',
    'Francesc Layret':'C/ Francesc Layret, 98 · 08911 Badalona · 93 389 06 34 / 657 60 20 14 · francesclayret@cansoler.com',
    'Mercado de Montgat':'Plaça de la Mare s/n · 08390 Montgat · 937 608 349 / 655 97 14 45'
  };
  addBot('<b>'+label+'</b><br>'+p[label]);
  safety('Los horarios publicados en la web no se usan como horarios actuales en esta prueba porque parte de la información visible está fechada. Deben confirmarse.');
  followup();
}
function flowHistoria(){
  state={flow:'historia',step:'tema',data:{}};
  addBot('<b>Can Soler tiene una historia que empieza en Badalona en 1969.</b><br><br>La casa explica que Albert Soler y Pilar Miquel fundaron el negocio al llegar a la ciudad con la intención de difundir su oficio. La primera heladería fue la actual de Francesc Layret; posteriormente llegó el establecimiento de la calle Mar y, en 2016, el punto del Mercado de Montgat.<br><br>Actualmente hablan de <b>tres generaciones</b> dedicadas a helados, horchatas, turrones y dulces, manteniendo la elaboración artesanal.');
  ask('¿Qué parte quiere descubrir ahora?', ['📖 La historia familiar','👨‍👩‍👧 Tres generaciones','🏆 Campeonato 2019','🏭 Obradores y elaboración','🍦 Qué hace especial a Can Soler']);
}
function historyAnswer(label){
  let t='';
  if(label.includes('historia familiar')) t='<b>Una tradición heladera y turronera.</b><br><br>La historia familiar que publica Can Soler enlaza dos ramas: el abuelo Miquel, procedente de Alicante y dedicado a turrones y helados, y el abuelo Soler, maestro turronero y heladero que trabajó para empresas de Sevilla y Xixona. Esa tradición termina asentándose en Badalona.';
  if(label.includes('Tres generaciones')) t='<b>Tres generaciones.</b><br><br>Can Soler explica que ya son tres generaciones trabajando en la elaboración de helados, horchatas, turrones y dulces. La continuidad familiar forma parte central de la identidad del negocio.';
  if(label.includes('Campeonato 2019')) t='<b>Campeonato de España de Heladería Artesana · 2019.</b><br><br>La web oficial indica que el maestro heladero Albert Soler consiguió ese año el campeonato de España, reconocimiento que la casa vincula al trabajo, la constancia y la innovación. En su carta, Xixollana aparece destacada como sabor ganador de España en 2019.';
  if(label.includes('Obradores')) t='<b>Elaboración propia.</b><br><br>Can Soler explica que elabora diariamente helados, horchatas, granizados y helados con palo en sus obradores. En temporada también fabrica panellets y turrones artesanos, con obradores vinculados a Badalona y Xixona.';
  if(label.includes('especial')) t='<b>Más que una heladería.</b><br><br>La web indica que han creado más de 90 sabores a lo largo de su historia. A ello se suman horchata, granizados, crepes, turrones de temporada y combinaciones con identidad propia como Agua de Badalona, Palmera, Lletuga, Canario, Cubano, Blanco y negro o Café con leche de verano.';
  addBot(t);
  buttons(['📖 Seguir conociendo Can Soler','⭐ Ver especialidades','Volver al inicio']);
  state.step='historiaExtra';
}
function flowOtra(){
  state={flow:'otra',step:'libre',data:{}};
  addBot('Claro. Escriba su pregunta.');
}

function freeReply(text){
  const n=norm(text);
  if(!n) return;
  if(n.includes('pistacho')) return replyFlavour('Pistacho');
  if(n.includes('xixollana')) return explainSpecial('Xixollana');
  if(n.includes('historia') || n.includes('1969') || n.includes('campeonato') || n.includes('albert soler') || n.includes('generaciones')) return flowHistoria();
  if(n.includes('horchata')) {addBot('Sí. Can Soler publica horchata natural de chufa, además de combinaciones que la utilizan. Esta demo no confirma disponibilidad diaria.'); return followup();}
  if(n.includes('granizado')) return flowGranizados();
  if(n.includes('crepe') || n.includes('gofre')) return flowCrepes();
  if(n.includes('alerg') || n.includes('gluten') || n.includes('lactosa') || n.includes('frutos secos')) return flowAlergenos();
  if(n.includes('horario') || n.includes('abierto') || n.includes('cierra')) {
    addBot('No voy a confirmar un horario actual con datos que pueden estar desactualizados. En esta demo ese dato se deriva hasta que Can Soler lo configure y lo mantenga vigente.');
    safety('DATO NO CONFIGURADO / VIGENCIA NO CONFIRMADA → NO INVENTAR.');
    return followup();
  }
  if(n.includes('direccion') || n.includes('donde esta') || n.includes('ubicacion')) return flowPuntos();
  if(n.includes('precio') || n.includes('cuanto cuesta')) {
    addBot('Los precios no están configurados como fuente vigente en esta prueba. No voy a inventarlos.');
    safety('Precio no configurado → registrar / derivar.');
    return followup();
  }
  if(n.includes('pedido') || n.includes('encargo') || n.includes('reserv')) {
    addBot('Esta prueba no realiza pedidos ni confirma encargos. Esa función solo se activaría con reglas aprobadas por Can Soler.');
    return followup();
  }
  const possible = HELADOS.find(x=>n.includes(norm(x)));
  if(possible) return replyFlavour(possible);

  addBot('No tengo ese dato configurado de forma segura en esta prueba.');
  safety('DATO NO CONFIGURADO → NO INFERIR → NO INVENTAR → REGISTRAR / DERIVAR AL ESTABLECIMIENTO.');
  followup();
}

function sendFree(){
  const t=input.value.trim();
  if(!t) return;
  input.value='';
  addUser(t);
  freeReply(t);
}
input.addEventListener('keydown',e=>{if(e.key==='Enter')sendFree()});

start();
</script>
