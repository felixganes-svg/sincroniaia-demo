<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
:root{
  --green:#00a884;--paper:#efeae2;--ink:#111b21;--line:#d8dddf;--white:#fff;
  --user:#d9fdd3;--soft:#f0f2f5;--gold:#9a6b31;--navy:#17223d;
  --safe:#fff6dd;--safeLine:#edcb74;--info:#edf5ff;--infoLine:#b9d3ff;
}
html,body{height:100%;background:#0b141a}
body{display:flex;justify-content:center;align-items:center;overflow:hidden;color:var(--ink)}
.app{width:100%;max-width:480px;height:100vh;height:100dvh;background:var(--paper);display:flex;flex-direction:column;overflow:hidden}
@media(min-width:500px){.app{height:95vh;border-radius:18px;box-shadow:0 10px 35px rgba(0,0,0,.45)}}

.header{background:var(--green);color:white;padding:9px 11px;display:flex;align-items:center;gap:10px;box-shadow:0 1px 4px rgba(0,0,0,.2);z-index:5}
.avatar{width:42px;height:42px;border-radius:50%;background:white;color:#0e3e36;display:flex;align-items:center;justify-content:center;font-family:Georgia,serif;font-weight:800;font-size:18px}
.headtxt{flex:1;min-width:0}
.headtxt h1{font-size:16px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.headtxt p{font-size:11px;opacity:.95;margin-top:2px}
.badge{font-size:9px;font-weight:800;border:1px solid rgba(255,255,255,.7);border-radius:999px;padding:5px 7px;white-space:nowrap;letter-spacing:.5px}

.chat{flex:1;overflow-y:auto;padding:13px 10px 18px;display:flex;flex-direction:column;gap:8px;background:
radial-gradient(circle at 1px 1px,rgba(96,110,117,.16) 1px,transparent 0) 0 0/25px 25px,
var(--paper);scroll-behavior:smooth}
.day{align-self:center;background:#d9e8ee;color:#4c626b;padding:5px 9px;border-radius:7px;font-size:10px;box-shadow:0 1px 1px rgba(0,0,0,.08)}
.msg{max-width:88%;padding:9px 10px 18px;border-radius:8px;font-size:14.5px;line-height:1.43;position:relative;box-shadow:0 1px 1px rgba(0,0,0,.09);animation:pop .17s ease-out}
@keyframes pop{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.bot{align-self:flex-start;background:#fff;border-top-left-radius:2px}
.user{align-self:flex-end;background:var(--user);border-top-right-radius:2px}
.time{position:absolute;right:7px;bottom:3px;color:#7b8b91;font-size:9px}
.msg strong{font-weight:750}
.options{align-self:stretch;display:flex;flex-wrap:wrap;gap:7px;max-width:100%;margin:2px 0 4px}
.chip{display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--green);background:#fff;color:#087967;border-radius:17px;padding:9px 11px;font-size:12.7px;font-weight:700;cursor:pointer;box-shadow:0 1px 2px rgba(0,0,0,.05);min-height:38px;text-align:center;white-space:normal}
.chip.gold{border-color:#a37842;color:#825b29}.chip.dark{border-color:#65757c;color:#425057}.chip:active{transform:scale(.97)}
.notice{align-self:stretch;border-radius:11px;padding:10px 11px;font-size:12.5px;line-height:1.4}
.notice.info{background:var(--info);border:1px solid var(--infoLine);color:#214c78}
.notice.safe{background:var(--safe);border:1px solid var(--safeLine);color:#654b16}
.notice strong{display:block;margin-bottom:3px}
.typing{align-self:flex-start;background:white;padding:9px 11px;border-radius:8px;color:#718188;font-size:12px}
.typing i{font-style:normal;letter-spacing:2px}

.bottom{background:var(--soft);border-top:1px solid var(--line)}
.footer{display:flex;gap:7px;align-items:center;padding:8px 9px calc(9px + env(safe-area-inset-bottom))}
.reset{border:0;background:transparent;color:#607078;font-size:20px;padding:7px;cursor:pointer}
.input{flex:1;min-width:0;border:0;border-radius:20px;background:white;padding:11px 13px;font-size:14px;outline:none}
.send{width:42px;height:42px;border:0;border-radius:50%;background:var(--green);color:white;font-weight:900;font-size:17px;cursor:pointer}
.smallnote{text-align:center;font-size:9px;color:#6f7e84;padding:0 9px 6px}
@media(max-width:420px){.options .chip{flex:1 1 calc(50% - 7px)}}
@media(max-width:360px){.badge{display:none}.msg{font-size:14px}.chip{font-size:12.2px;padding:8px 10px}}
</style>
</head>
<body>

  </div>
</div>

function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function norm(s){return String(s??'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim()}
function time(){return new Date().toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'})}
function scrollEnd(){setTimeout(()=>chat.scrollTop=chat.scrollHeight,30)}
function clearOptions(){chat.querySelectorAll('.options').forEach(x=>x.remove())}
function msg(html,who='bot'){const d=document.createElement('div');d.className='msg '+who;d.innerHTML=html+`<span class="time">${time()}</span>`;chat.appendChild(d);scrollEnd()}
function user(text){clearOptions();msg(esc(text),'user')}
function notice(kind,title,body){const d=document.createElement('div');d.className='notice '+kind;d.innerHTML=`<strong>${title}</strong>${body}`;chat.appendChild(d);scrollEnd()}
function buttons(items){const w=document.createElement('div');w.className='options';items.forEach(it=>{const b=document.createElement('button');b.className='chip '+(it.cls||'');b.textContent=it.label;b.onclick=()=>{user(it.label);route(it.value)};w.appendChild(b)});chat.appendChild(w);scrollEnd()}
function bot(html,opts){const t=document.createElement('div');t.className='typing';t.innerHTML='Can Soler está escribiendo <i>•••</i>';chat.appendChild(t);scrollEnd();setTimeout(()=>{t.remove();msg(html);if(opts)buttons(opts)},180)}
function safe(body='Ese dato no está configurado o no está confirmado como vigente.'){notice('safe','REGLA MAESTRA',body+' No se infiere ni se inventa; la consulta se registra o deriva al establecimiento.')}
function home(){
  state={step:'menu',branch:null,data:{}};
  bot('<strong>¿Qué desea hacer?</strong>',[
    {label:'1. 🛍️ Hacer un pedido',value:'pedido'},
    {label:'2. 📍 Puntos de venta',value:'puntos'},
    {label:'3. 🏆 Conocer Can Soler',value:'conocer',cls:'gold'},
    {label:'4. 💬 Otra consulta',value:'otra',cls:'dark'}
  ]);
}
function restart(){
  state={step:'menu',branch:null,data:{}};chat.innerHTML='';
  const d=document.createElement('div');d.className='day';d.textContent='HOY · DEMOSTRACIÓN';chat.appendChild(d);
  notice('info','DEMO AISLADA','Conversación tipo WhatsApp. Mantiene el historial visible. Los pedidos son simulados hasta que Can Soler defina sus reglas reales.');
  bot('Hola. Soy el asistente virtual de <strong>Can Soler</strong>.<br><br>Puedo ayudarle con pedidos de prueba, puntos de venta, información sobre Can Soler o cualquier otra consulta.',[
    {label:'1. 🛍️ Hacer un pedido',value:'pedido'},
    {label:'2. 📍 Puntos de venta',value:'puntos'},
    {label:'3. 🏆 Conocer Can Soler',value:'conocer',cls:'gold'},
    {label:'4. 💬 Otra consulta',value:'otra',cls:'dark'}
  ]);
}
function route(v){
  if(v==='inicio'){ return confirmarSalidaInicio(); }
  if(v==='menu_pedido'){ return volverMenuPedido(); }
  if(v==='categorias'){ return volverCategoriasPedido(); }
  if(v==='otra'){ return otraStart(); }
  if(state.step==='menu'){
    if(v==='pedido') return pedidoStart();
    if(v==='puntos') return puntosStart();
    if(v==='conocer') return conocerStart();
    if(v==='otra') return otraStart();
  }
  if(state.step==='pedidoPunto') return pedidoPunto(v);
  if(state.step==='pedidoModo') return pedidoModo(v);
  if(state.step==='pedidoCategoria') return pedidoCategoria(v);
  if(state.step==='pedidoGranizadoProducto') return pedidoGranizadoProducto(v);
  if(state.step==='pedidoCrepeTipo') return pedidoCrepeTipo(v);
  if(state.step==='pedidoBatidoTipo') return pedidoBatidoTipo(v);
  if(state.step==='pedidoCafeTipo') return pedidoCafeTipo(v);
  if(state.step==='pedidoEspecialFormato') return pedidoEspecialFormato(v);
  if(state.step==='horchataAzucar') return horchataAzucar(v);
  if(state.step==='horchataFormato') return horchataFormato(v);
  if(state.step==='pedidoHeladoFormato') return pedidoHeladoFormato(v);
  if(state.step==='pedidoHeladoSaboresCantidad') return pedidoHeladoSaboresCantidad(v);
  if(state.step==='pedidoHeladoSabor') return pedidoHeladoSabor(v);
  if(state.step==='pedidoHeladoConfirmarSabores') return pedidoHeladoConfirmarSabores(v);
  if(state.step==='pedidoHeladoMedida') return pedidoHeladoMedida(v);
  if(state.step==='pedidoCantidad') return pedidoCantidad(v);
  if(state.step==='pedidoMas') return pedidoMas(v);
  if(state.step==='pedidoConfirmar') return pedidoConfirmar(v);
  if(state.step==='pedidoFinalizado') return pedidoFinalizado(v);
  if(state.step==='pedidoModificar') return pedidoModificar(v);
  if(state.step==='pedidoFechaOpciones') return pedidoFechaOpciones(v);
  if(state.step==='pedidoFranjaHorario') return pedidoFranjaHorario(v);
  if(state.step==='pedidoIntervaloHorario') return pedidoIntervaloHorario(v);
  if(state.step==='salidaPedido') return salidaPedido(v);
  if(state.step==='pedidoNombre') return null;
  if(state.step==='puntos') return puntoDetalle(v);
  if(state.step==='puntoAccion') return puntoAccion(v);
  if(state.step==='conocer') return conocerDetalle(v);
  if(state.step==='conocerMas') return conocerMas(v);
}

function hayPedidoEnCurso(){
  return state && state.branch==='pedido' && (
    (state.data && state.data.point) ||
    (state.data && state.data.cart && state.data.cart.length) ||
    (state.data && state.data.product) ||
    (state.data && state.data.nombre) ||
    (state.data && state.data.telefono)
  );
}
function confirmarSalidaInicio(){
  if(hayPedidoEnCurso()){
    state.step='salidaPedido';
    return bot('<strong>Tiene un pedido en curso.</strong><br><br>¿Qué desea hacer?',[
      {label:'🛍️ Continuar pedido',value:'continuar_pedido'},
      {label:'🗑️ Cancelar pedido y volver al inicio',value:'cancelar_ir_inicio',cls:'dark'}
    ]);
  }
  return home();
}
function volverMenuPedido(){
  if(!state.data) state.data={};
  state.step='pedidoModo';
  return bot('<strong>Menú del pedido</strong><br><br>¿Ya sabe qué quiere pedir?',[
    {label:'Sí, elegir productos',value:'elegir'},
    {label:'✨ No, ayúdeme a elegir',value:'ayuda'},
    {label:'🏠 Volver al inicio',value:'inicio',cls:'dark'}
  ]);
}
function volverCategoriasPedido(){
  state.step='pedidoCategoria';
  return bot('<strong>¿Qué desea pedir?</strong>',[
    {label:'🍦 Helados',value:'helados'},
    {label:'🥤 Horchata / granizados',value:'granizados'},
    {label:'🥞 Crepes / gofres',value:'crepes'},
    {label:'🥛 Batidos / smoothies',value:'batidos'},
    {label:'☕ Cafés / bebidas',value:'cafes'},
    {label:'⭐ Especialidades Can Soler',value:'especiales',cls:'gold'},
    {label:'↩️ Volver al menú de pedidos',value:'menu_pedido',cls:'dark'},
    {label:'🏠 Inicio',value:'inicio',cls:'dark'}
  ]);
}
function salidaPedido(v){
  if(v==='continuar_pedido'){
    return volverMenuPedido();
  }
  if(v==='cancelar_ir_inicio'){
    msg('Pedido de demostración cancelado. No se ha enviado ninguna solicitud real.');
    state={step:'menu',branch:null,data:{}};
    return home();
  }
}
function pedidoStart(){
  state={step:'pedidoPunto',branch:'pedido',data:{cart:[]}};
  bot('<strong>¿Dónde desea recoger el pedido?</strong>',[
    {label:'Can Soler Mar',value:'mar'},
    {label:'Francesc Layret',value:'layret'},
    {label:'Mercado de Montgat',value:'montgat'},
    {label:'🏠 Volver al inicio',value:'inicio',cls:'dark'}

}
function pedidoPunto(v){
  state.data.point=v;
  if((state.data.cart||[]).length && state.data.nombre){
    return mostrarResumenPedido();

  state.step='pedidoModo';
  bot('Perfecto: <strong>'+POINTS[v].name+'</strong>.<br><br>¿Ya sabe qué quiere pedir?',[

    {label:'✨ No, ayúdeme a elegir',value:'ayuda'},

function pedidoModo(v){
  if(v==='ayuda'){
    state.step='pedidoCategoria';
    return bot('Le ayudo. ¿Qué le apetece más?',[
      {label:'🍫 Chocolate / intenso',value:'mood_choc'},
      {label:'🍓 Frutal / fresco',value:'mood_fruit'},
      {label:'❄️ Refrescante',value:'mood_cold'},

      {label:'↩️ Volver al menú de pedidos',value:'menu_pedido',cls:'dark'},
      {label:'🏠 Inicio',value:'inicio',cls:'dark'}

  }
  state.step='pedidoCategoria';
  bot('<strong>¿Qué desea pedir?</strong>',[
    {label:'🍦 Helados',value:'helados'},
    {label:'🥤 Horchata / granizados',value:'granizados'},
    {label:'🥞 Crepes / gofres',value:'crepes'},
    {label:'🥛 Batidos / smoothies',value:'batidos'},
    {label:'☕ Cafés / bebidas',value:'cafes'},
    {label:'⭐ Especialidades Can Soler',value:'especiales',cls:'gold'},

function opcionesCatalogo(arr, cls=''){
  return arr.map(x=>({label:x,value:x,cls}));
}
function elegirProductoConcreto(titulo, arr, nextStep='pedidoCantidad'){
  state.step=nextStep;
  bot('<strong>'+titulo+'</strong>',opcionesCatalogo(arr).concat([
    {label:'↩️ Volver a categorías',value:'categorias',cls:'dark'},
    {label:'🏠 Inicio',value:'inicio',cls:'dark'}
  ]));
}
function describirProducto(nombre){
  const d=DESCRIPCIONES[nombre];
  return d ? '<br><small>'+esc(d)+'</small>' : '';
}
function pedidoCategoria(v){
  if(v.startsWith('mood_')){
    let text='';
    if(v==='mood_choc')text='Si le apetece chocolate, podemos mirar helados de chocolate publicados, un <strong>Cubano</strong> o alguna opción de crepe.';

      {label:'🏠 Volver al inicio',value:'inicio'},
      {label:'💬 Nueva consulta',value:'otra',cls:'dark'}
    ]);
  }
}
function pedidoModificar(v){
  if(v==='productos'){
    state.data.cart=[];
    limpiarProductoActual();
    state.step='pedidoCategoria';
    return bot('De acuerdo. Volvemos a seleccionar los productos del pedido.',[
      {label:'🍦 Helados',value:'helados'},
      {label:'🥤 Horchata / granizados',value:'granizados'},
      {label:'🥞 Crepes / gofres',value:'crepes'},
      {label:'🥛 Batidos / smoothies',value:'batidos'},
      {label:'☕ Cafés / bebidas',value:'cafes'},
      {label:'⭐ Especialidades Can Soler',value:'especiales',cls:'gold'}
    ]);
  }
  if(v==='cliente'){
    state.step='pedidoNombre';
    return bot('¿A qué nombre registramos el pedido?');
  }
  if(v==='recogida'){
    delete state.data.fechaRecogida;
    delete state.data.franjaGeneral;
    delete state.data.horaRecogida;
    state.step='pedidoFechaOpciones';
    return bot('<strong>¿Para qué día desea solicitar la recogida?</strong>',[
      {label:'Hoy',value:'hoy'},
      {label:'Mañana',value:'manana'},
      {label:'Otra fecha',value:'otra_fecha'},
      {label:'↩️ Volver al resumen',value:'volver_resumen',cls:'dark'}
    ]);
  }
  if(v==='punto'){
    state.step='pedidoPunto';
    return bot('¿Dónde desea recoger el pedido?',[
      {label:'Can Soler Mar',value:'mar'},
      {label:'Francesc Layret',value:'layret'},
      {label:'Mercado de Montgat',value:'montgat'}
    ]);
  }
}


const HORARIO_RECOGIDA={
  inicio:'11:00',
  fin:'23:00',
  franjas:{
    mediodia:{
      label:'☀️ Mediodía · 11:00–15:00',
      intervalos:['11:00–12:00','12:00–13:00','13:00–14:00','14:00–15:00']
    },
    tarde:{
      label:'🌤️ Tarde · 15:00–19:00',
      intervalos:['15:00–16:00','16:00–17:00','17:00–18:00','18:00–19:00']
    },
    noche:{
      label:'🌙 Noche · 19:00–23:00',
      intervalos:['19:00–20:00','20:00–21:00','21:00–22:00','22:00–23:00']
    }
  }
};

function preguntarFranjaHorario(){
  state.step='pedidoFranjaHorario';
  return bot(
    '<strong>¿A qué hora desea recogerlo?</strong><br><br>'+
    'Nuestro horario de recogida es de <strong>11:00 a 23:00</strong>.<br><br>'+
    '<strong>¿En qué franja horaria lo desea?</strong>',
    [
      {label:HORARIO_RECOGIDA.franjas.mediodia.label,value:'mediodia'},
      {label:HORARIO_RECOGIDA.franjas.tarde.label,value:'tarde'},
      {label:HORARIO_RECOGIDA.franjas.noche.label,value:'noche'},
      {label:'↩️ Volver al día',value:'volver_dia',cls:'dark'},
      {label:'🏠 Inicio',value:'inicio',cls:'dark'}
    ]
  );
}

function pedidoFranjaHorario(v){
  if(v==='volver_dia'){
    state.step='pedidoFechaOpciones';
    return bot('<strong>¿Para qué día desea solicitar la recogida?</strong>',[
      {label:'Hoy',value:'hoy'},
      {label:'Mañana',value:'manana'},
      {label:'Otra fecha',value:'otra_fecha'},
      {label:'↩️ Volver al resumen',value:'volver_resumen',cls:'dark'}
    ]);
  }

  const franja=HORARIO_RECOGIDA.franjas[v];
  if(!franja) return;

  state.data.franjaGeneral=v;
  state.step='pedidoIntervaloHorario';
  return bot(
    '<strong>'+franja.label+'</strong><br><br>'+
    '<strong>¿En qué intervalo desea recogerlo?</strong>',
    franja.intervalos.map(x=>({label:x,value:x})).concat([
      {label:'↩️ Cambiar franja',value:'volver_franja',cls:'dark'},
      {label:'🏠 Inicio',value:'inicio',cls:'dark'}
    ])
  );
}

function pedidoIntervaloHorario(v){
  if(v==='volver_franja'){
    return preguntarFranjaHorario();
  }

  const franja=HORARIO_RECOGIDA.franjas[state.data.franjaGeneral];
  if(!franja || !franja.intervalos.includes(v)) return;

  state.data.horaRecogida=v;
  mostrarResumenPedido();
}

function pedidoFechaOpciones(v){
  if(v==='volver_resumen'){
    return mostrarResumenPedido();
  }
  if(v==='hoy'){
    state.data.fechaRecogida='Hoy';
    return preguntarFranjaHorario();
  }
  if(v==='manana'){
    state.data.fechaRecogida='Mañana';
    return preguntarFranjaHorario();
  }
  if(v==='otra_fecha'){
    state.step='pedidoFecha';
    bot('<strong>Indique el día o la fecha que desea.</strong><br><br>Por ejemplo: viernes, 14 de agosto o 14/08.');
    input.focus();
  }
}

function puntosStart(){
  state={step:'puntos',branch:'puntos',data:{}};
  bot('¿Qué punto de venta quiere consultar?',[
    {label:'Can Soler Mar',value:'mar'},
    {label:'Francesc Layret',value:'layret'},
    {label:'Mercado de Montgat',value:'montgat'}
  ]);
}
function puntoDetalle(v){
  state.data.point=v;
  const p=POINTS[v];
  msg('<strong>'+p.name+'</strong><br>📍 '+p.address+'<br>📞 '+p.phone+(p.email?'<br>✉️ '+p.email:''));
  safe('Horario de recogida confirmado para esta demostración: de 11:00 a 23:00.');
  state.step='puntoAccion';
  buttons([
    {label:'🛍️ Hacer pedido aquí',value:'pedido'},
    {label:'📍 Ver otro punto',value:'otro'},

  ]);
}
function puntoAccion(v){
  if(v==='pedido'){
    const keep=state.data.point;
    state={step:'pedidoModo',branch:'pedido',data:{point:keep,cart:[]}};
    return bot('Perfecto. El pedido quedará asociado a <strong>'+POINTS[keep].name+'</strong>.<br><br>¿Ya sabe qué quiere?',[
      {label:'Sí, elegir productos',value:'elegir'},
      {label:'✨ No, ayúdeme a elegir',value:'ayuda'}
    ]);
  }
  if(v==='otro') return puntosStart();
  if(v==='inicio'){state.step='menu';return home()}
}

function conocerStart(){
  state={step:'conocer',branch:'conocer',data:{}};
  bot('<strong>Can Soler nació en Badalona en 1969.</strong><br><br>La casa explica una trayectoria familiar de tres generaciones dedicada a helados, horchatas, turrones y dulces artesanos.<br><br>¿Qué quiere conocer?',[
    {label:'📖 Historia desde 1969',value:'historia'},
    {label:'👨‍👩‍👧 Tres generaciones',value:'generaciones'},
    {label:'🏭 Obrador de Badalona',value:'badalona'},
    {label:'🍯 Obrador de Jijona',value:'jijona'},
    {label:'🏆 Campeonato 2019',value:'campeonato'},
    {label:'🍦 Productos y elaboración',value:'productos'},
    {label:'⭐ Especialidades de la casa',value:'especialidades',cls:'gold'}
  ]);
}
function conocerDetalle(v){
  if(v==='historia') msg('<strong>Tradición desde 1969.</strong><br>Can Soler explica que fue fundada por Albert Soler y Pilar Miquel al llegar a Badalona. El primer establecimiento fue el de Francesc Layret; después llegó el de la calle Mar y, en 2016, el punto del Mercado de Montgat.');
  if(v==='generaciones') msg('<strong>Tres generaciones.</strong><br>La historia familiar une tradición heladera y turronera. La empresa cuenta que los abuelos ya estaban vinculados a los turrones y helados y que actualmente la tercera generación continúa la elaboración de helados, horchatas, turrones y dulces.');
  if(v==='badalona') msg('<strong>Obrador de Badalona.</strong><br>Can Soler explica que allí elabora diariamente buena parte de sus productos de verano: helados, leche merengada, horchata, polos y otras preparaciones, cuidando materias primas y procesos artesanales.');
  if(v==='jijona') msg('<strong>Obrador de Jijona.</strong><br>Está ligado a la tradición turronera familiar y a la producción estacional. La web menciona ingredientes como almendra Marcona, miel, canela, frutos secos y chocolate, y sitúa buena parte de la elaboración de turrones en los meses de noviembre y diciembre.');
  if(v==='campeonato') msg('<strong>Campeonato de España de Heladería Artesana 2019.</strong><br>Can Soler publica que su maestro heladero Albert Soler consiguió este reconocimiento gracias al trabajo, la constancia y la innovación.');
  if(v==='productos') msg('<strong>Elaboración propia.</strong><br>La casa publica una oferta que incluye más de 90 sabores creados a lo largo de su historia, horchata natural de chufa, granizados, leche merengada, polos, smoothies, batidos, crepes, cafés, tés, chocolates y turrones de temporada.');
  if(v==='especialidades') msg('<strong>Especialidades con identidad propia.</strong><br>Entre las combinaciones publicadas aparecen Xixollana, Agua de Badalona, Palmera, Canario, Cubano, Blanco y negro y Café con leche de verano.');
  state.step='conocerMas';
  buttons([
    {label:'📖 Seguir conociendo Can Soler',value:'seguir',cls:'gold'},
    {label:'🛍️ Quiero hacer un pedido',value:'pedido'},
    {label:'🏠 Inicio',value:'inicio',cls:'dark'}
  ]);
}
function conocerMas(v){
  if(v==='seguir') return conocerStart();
  if(v==='pedido') return pedidoStart();
  if(v==='inicio'){state.step='menu';return home()}
}

function otraStart(){
  state={step:'free',branch:'otra',data:{}};
  bot('Claro. <strong>Escriba su consulta con sus propias palabras.</strong><br><br>Si el dato no está configurado de forma segura, no lo inventaré.');
  input.focus();
}

function telefonoValido(text){
  const d=String(text||'').replace(/\D/g,'');
  return d.length>=9 && d.length<=15;
}
function handleOrderText(text){
  if(state.step==='pedidoCantidadManual'){
    const n=parseInt(String(text).replace(/\D/g,''),10);
    if(!n || n<1){
      bot('Indíqueme una cantidad válida, por ejemplo 1, 2 o 4.');
      return true;
    }
    state.data.quantity=String(n);
    guardarProductoActual();
    state.step='pedidoMas';
    bot('<strong>¿Desea algún producto más?</strong>',[
      {label:'Sí, añadir otro producto',value:'si'},
      {label:'No, continuar',value:'no'}
    ]);
    return true;
  }
  if(state.step==='pedidoNombre'){
    state.data.nombre=String(text).trim();
    state.step='pedidoTelefono';
    bot('Gracias. <strong>¿Puede indicarme un teléfono de contacto?</strong>');
    return true;
  }
  if(state.step==='pedidoTelefono'){
    if(!telefonoValido(text)){
      bot('Necesito un teléfono válido para que el establecimiento pueda contactar con usted. Escríbalo de nuevo, por favor.');
      return true;
    }
    state.data.telefono=String(text).trim();
    state.step='pedidoFechaOpciones';
    bot('<strong>¿Para qué día desea solicitar la recogida?</strong>',[
      {label:'Hoy',value:'hoy'},
      {label:'Mañana',value:'manana'},
      {label:'Otra fecha',value:'otra_fecha'},
      {label:'↩️ Volver al resumen',value:'volver_resumen',cls:'dark'}
    ]);
    return true;
  }
  if(state.step==='pedidoFecha'){
    state.data.fechaRecogida=String(text).trim();
    preguntarFranjaHorario();
    return true;
  }
  return false;
}
function sendFree(){
  const text=input.value.trim();
  if(!text)return;
  input.value='';
  user(text);
  if(handleOrderText(text)) return;
  answerFree(text);
}
function answerFree(text){
  const n=norm(text);
  const f=FLAVOURS.find(x=>norm(x)===n || norm(x).includes(n) || n.includes(norm(x)));
  if(f){msg('Sí. <strong>'+esc(f)+'</strong> aparece entre los sabores publicados de Can Soler.<br><br>No estoy confirmando que esté disponible hoy.');state.step='menu';return buttons([{label:'🏠 Inicio',value:'inicio'}])}
  if(n.includes('horario')||n.includes('abre')||n.includes('cierra')||n.includes('abierto')){
    msg('Puedo indicar los puntos de venta, pero no voy a afirmar un horario actual sin una fuente vigente confirmada.');
    safe();state.step='menu';return buttons([{label:'📍 Ver puntos de venta',value:'puntos'},{label:'🏠 Inicio',value:'inicio'}]);
  }
  if(n.includes('precio')||n.includes('cuanto cuesta')||n.includes('cuanto vale')){
    msg('Los precios vigentes no están configurados como fuente segura en esta demo.');
    safe('Precio vigente no configurado.');state.step='menu';return buttons([{label:'🏠 Inicio',value:'inicio'}]);
  }
  if(n.includes('pedido')||n.includes('encargo')){
    return pedidoStart();
  }
  if(n.includes('historia')||n.includes('1969')||n.includes('campeon')||n.includes('albert soler')||n.includes('obrador')){
    return conocerStart();
  }
  if(n.includes('direccion')||n.includes('donde')||n.includes('ubicacion')){
    return puntosStart();
  }
  if(n.includes('alerg')||n.includes('gluten')||n.includes('lactosa')||n.includes('frutos secos')){
    msg('En seguridad alimentaria no deduzco que un producto sea seguro solo por su nombre o descripción.');
    safe('La tabla oficial de alérgenos debe estar configurada y aprobada por el establecimiento.');
    state.step='menu';return buttons([{label:'🏠 Inicio',value:'inicio'}]);
  }
  msg('Entiendo la consulta, pero no tengo ese dato configurado de forma segura en esta prueba.');
  safe();state.step='menu';buttons([{label:'🏠 Inicio',value:'inicio'}]);
}
