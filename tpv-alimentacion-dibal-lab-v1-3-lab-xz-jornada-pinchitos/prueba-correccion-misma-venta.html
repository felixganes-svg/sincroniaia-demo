<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SINCRONIAIA TPV · Prueba corrección misma venta</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0f2238}
#tpv{display:block;width:100%;height:100%;border:0;background:#fff}
#labMark{position:fixed;z-index:99999;right:8px;top:8px;background:#7c2d12;color:#fff;border-radius:999px;padding:6px 10px;font:700 11px system-ui;box-shadow:0 2px 8px #0005;pointer-events:none}
</style>
</head>
<body>
<div id="labMark">PRUEBA · CORRECCIÓN MISMA VENTA</div>
<iframe id="tpv" src="./index.html?prueba-correccion-misma-venta=20260914b"></iframe>
<script>
(function(){
  const frame=document.getElementById('tpv');
  frame.addEventListener('load',function(){
    const d=frame.contentDocument;
    const s=d.createElement('script');
    s.textContent=String.raw`
(function(){
  if(window.__sincroniaCorreccionDirecta)return;
  window.__sincroniaCorreccionDirecta=true;

  const originalSaveOpenSaleQty=saveOpenSaleQty;
  const originalReceiptLineHtml=receiptLineHtml;
  function clone(v){return JSON.parse(JSON.stringify(v));}
  function cleanLine(line){const out=clone(line||{});delete out._ticketOriginal;delete out._ticketCorrection;return out;}
  function r2(n){return Math.round((Number(n)||0)*100)/100;}
  function r3(n){return Math.round((Number(n)||0)*1000)/1000;}
  function qtyText(qty,unit){const n=Number(qty)||0;return unit==='kg'?r3(n).toFixed(3).replace('.',',')+' kg':String(n).replace('.',',')+' ud';}

  saveOpenSaleQty=function(index){
    const current=cart&&cart[index];
    if(!current)return originalSaveOpenSaleQty(index);
    const before=clone(current);
    const ticketOriginal=before._ticketOriginal?cleanLine(before._ticketOriginal):cleanLine(before);
    const beforeQty=Number(before.qty)||0;
    originalSaveOpenSaleQty(index);
    const after=cart&&cart[index];
    if(!after||Math.abs((Number(after.qty)||0)-beforeQty)<0.0000001)return;
    const deltaQty=(Number(after.qty)||0)-(Number(ticketOriginal.qty)||0);
    if(Math.abs(deltaQty)<0.0000001){delete after._ticketOriginal;delete after._ticketCorrection;}
    else{
      after._ticketOriginal=ticketOriginal;
      after._ticketCorrection={
        qty:after.unit==='kg'?r3(deltaQty):deltaQty,
        total:r2((Number(after.total)||0)-(Number(ticketOriginal.total)||0)),
        normalTotal:r2((Number(after.normalTotal)||0)-(Number(ticketOriginal.normalTotal)||0)),
        discount:r2((Number(after.discount)||0)-(Number(ticketOriginal.discount)||0))
      };
    }
    sellerMems[selectedCloseSeller]=cart.map(clone);
    save();
    openSaleModification();
  };

  receiptLineHtml=function(line){
    if(!line||!line._ticketOriginal||!line._ticketCorrection)return originalReceiptLineHtml(line);
    const original=cleanLine(line._ticketOriginal),correction=line._ticketCorrection;
    const first=originalReceiptLineHtml(original),unit=original.unit||line.unit||'ud';
    const price=Number(original.price??line.price)||0,name=String(original.name||line.name||'Artículo');
    const second='<div class="line"><div><b>'+esc(name)+'</b><br><small>'+qtyText(correction.qty,unit)+' × '+euro(price)+'/'+esc(unit)+' = '+euro(correction.total)+'</small></div><b>'+euro(correction.total)+'</b></div>';
    return first+second;
  };

  window.openPendingSaleForModification=function(encodedName){
    const name=decodeURIComponent(encodedName);
    const pending=sellerMems[name]||[];
    if(!pending.length)return alert('Este vendedor no tiene una venta abierta para modificar.');
    selectedCloseSeller=name;
    cart=pending.map(clone);
    openSaleModification();
  };

  window.directModifyOpenSale=function(){
    const pending=activeSellers().filter(s=>(sellerMems[s.name]||[]).length>0);
    if(!pending.length)return alert('No hay ninguna venta abierta para modificar.');
    if(pending.length===1)return openPendingSaleForModification(encodeURIComponent(pending[0].name));
    modal('<h2>Modificar venta abierta</h2><p>Selecciona el vendedor cuya venta quieres corregir.</p><div class="sellerKeys">'+pending.map(s=>'<button class="brand" onclick="openPendingSaleForModification(\''+encodeURIComponent(s.name)+'\')">'+esc(s.name)+'</button>').join('')+'</div><p><button onclick="closeModal()">Cancelar</button></p>');
  };

  function enhanceBar(){
    const bar=document.getElementById('bar');
    if(!bar||bar.style.display==='none')return;
    const inner=bar.querySelector('.inner');
    if(!inner||document.getElementById('directModifyBtn'))return;
    inner.style.gridTemplateColumns='1fr 1fr 1fr';
    const btn=document.createElement('button');
    btn.id='directModifyBtn';
    btn.textContent='MODIFICAR VENTA';
    btn.onclick=directModifyOpenSale;
    btn.style.fontSize='13px';
    inner.insertBefore(btn,inner.lastElementChild);
  }
  new MutationObserver(enhanceBar).observe(document.body,{childList:true,subtree:true,attributes:true,attributeFilter:['style']});
  setInterval(enhanceBar,500);
  enhanceBar();
})();`;
    d.body.appendChild(s);
  });
})();
</script>
</body>
</html>
