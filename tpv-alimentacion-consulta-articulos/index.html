<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SINCRONIAIA · Consulta de artículos</title>
<meta name="theme-color" content="#0f2238">
<style>
:root{--bg:#f4f7fb;--card:#fff;--ink:#102033;--muted:#667085;--line:#d9e2ec;--brand:#0f766e;--purple:#7c3aed;--orange:#ea580c;--dark:#111827;--blue:#155eef}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;background:var(--bg);color:var(--ink)}
body{padding-bottom:env(safe-area-inset-bottom)}
header{position:sticky;top:0;z-index:5;background:#0f2238;color:white;padding:12px 14px;box-shadow:0 2px 12px #0002}
header b{display:block;font-size:18px}header small{display:block;color:#cfe5e2;font-size:12px;margin-top:2px}
main{max-width:760px;margin:0 auto;padding:14px 12px 28px}
.screen{display:none}.screen.active{display:block}
.hero{padding:8px 2px 4px}.hero h1{font-size:28px;line-height:1.05;margin:6px 0}.hero p{margin:6px 0 14px;color:var(--muted)}
.homegrid{display:grid;grid-template-columns:1fr;gap:14px}
.bigbtn{min-height:112px;border:0;border-radius:22px;padding:20px 18px;text-align:left;font-weight:1000;font-size:24px;box-shadow:0 8px 24px #10203314;cursor:pointer}
.bigbtn small{display:block;font-size:14px;font-weight:700;opacity:.85;margin-top:8px}
.carn{background:var(--brand);color:#fff}.char{background:var(--purple);color:#fff}.elab{background:var(--orange);color:#fff}.az{background:var(--dark);color:#fff}
.topbar{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:center;margin-bottom:12px}
.back{border:0;border-radius:14px;background:#e8eef5;color:var(--ink);font-weight:900;padding:13px 15px;font-size:16px;cursor:pointer}
.titlebox h2{margin:0;font-size:24px;line-height:1.05}.titlebox small{color:var(--muted)}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px;box-shadow:0 8px 24px #1020330d;margin-bottom:12px}
.search{display:grid;grid-template-columns:1fr auto;gap:8px}
.search input{width:100%;border:1px solid var(--line);border-radius:14px;padding:14px;font-size:18px}
.search button{border:0;border-radius:14px;padding:0 14px;font-weight:900;background:#e8eef5}
.subgrid{display:grid;grid-template-columns:1fr;gap:12px}
.subbtn{min-height:82px;border:1px solid var(--line);background:#fff;border-radius:18px;padding:16px;text-align:left;font-size:21px;font-weight:1000;box-shadow:0 6px 18px #1020330d}
.subbtn small{display:block;font-size:14px;color:var(--muted);font-weight:700;margin-top:5px}
.letters{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.letter{min-height:64px;border:1px solid var(--line);background:#fff;border-radius:16px;font-size:24px;font-weight:1000}
.letter.active{background:var(--dark);color:#fff}
.resultsHead{display:flex;justify-content:space-between;align-items:end;gap:10px;margin:8px 2px 10px}.resultsHead b{font-size:18px}.count{font-weight:900;color:var(--muted)}
.products{display:grid;grid-template-columns:1fr;gap:10px}
.prod{border:1px solid var(--line);background:#fff;border-radius:18px;padding:15px;text-align:left;box-shadow:0 5px 16px #1020330d}
.prod b{display:block;font-size:20px;line-height:1.15}.prod small{display:block;color:var(--muted);margin-top:5px;font-size:14px}
.price{font-size:24px;font-weight:1000;margin-top:8px}
.empty{background:#fff;border:1px solid var(--line);border-radius:18px;padding:24px;text-align:center;color:var(--muted)}
.modal{position:fixed;inset:0;background:#0008;display:none;align-items:flex-end;z-index:30}.modal.show{display:flex}
.sheet{background:#fff;width:100%;max-width:760px;margin:auto;border-radius:24px 24px 0 0;padding:20px 16px calc(18px + env(safe-area-inset-bottom))}
.detailName{font-size:30px;font-weight:1000;line-height:1.05;margin-bottom:12px}.detailPrice{font-size:36px;font-weight:1000;margin:12px 0}.code{display:inline-block;background:#f1f5f9;border-radius:12px;padding:10px 12px;font-size:19px;font-weight:900}
.close{width:100%;margin-top:18px;border:0;border-radius:16px;background:#0f2238;color:#fff;padding:15px;font-size:18px;font-weight:1000}
.note{font-size:13px;color:var(--muted);text-align:center;margin-top:18px}
@media(min-width:560px){
 .homegrid{grid-template-columns:1fr 1fr}
 .subgrid{grid-template-columns:1fr 1fr}
 .products{grid-template-columns:1fr 1fr}
 .letters{grid-template-columns:repeat(7,1fr)}
}
</style>
</head>
<body>
<header>
  <b>SINCRONIAIA · Consulta de artículos</b>
  <small>Solo búsqueda · no vende · no cobra · no modifica</small>
</header>
<main>
  <section id="home" class="screen active">
    <div class="hero">
      <h1>¿Qué quieres consultar?</h1>
      <p>Una opción por pantalla para que sea cómodo desde el móvil.</p>
    </div>
    <div class="homegrid">
      <button class="bigbtn carn" onclick="openArea('Carne')">CARNICERÍA<small>Ternera, cerdo, pollo, cordero…</small></button>
      <button class="bigbtn char" onclick="openArea('Charcutería')">CHARCUTERÍA<small>Embutidos, jamones, quesos…</small></button>
      <button class="bigbtn elab" onclick="openArea('Elaborados')">ELABORADOS<small>Preparados, hamburguesas, croquetas…</small></button>
      <button class="bigbtn az" onclick="openAZ()">ARTÍCULOS A-Z<small>Buscar cualquier artículo por letra, nombre o código.</small></button>
    </div>
    <div class="note" id="source"></div>
  </section>

  <section id="sectionScreen" class="screen">
    <div class="topbar">
      <button class="back" onclick="goHome()">← Inicio</button>
      <div class="titlebox"><h2 id="sectionTitle"></h2><small>Selecciona una subsección</small></div>
    </div>
    <div class="subgrid" style="margin-bottom:12px"><button class="subbtn" style="background:#111827;color:#fff" onclick="openSectionAZ()">ARTÍCULOS A-Z<small style="color:#cbd5e1">Ver solo los artículos de esta sección</small></button></div><div id="subgrid" class="subgrid"></div>
  </section>

  <section id="listScreen" class="screen">
    <div class="topbar">
      <button class="back" onclick="backFromList()">← Volver</button>
      <div class="titlebox"><h2 id="listTitle"></h2><small id="listSubtitle"></small></div>
    </div>
    <div class="card">
      <div class="search">
        <input id="sectionSearch" placeholder="Buscar por nombre o código…" oninput="renderList()">
        <button onclick="sectionSearch.value='';renderList()">Limpiar</button>
      </div>
    </div>
    <div class="resultsHead"><b>Artículos</b><span class="count" id="listCount"></span></div>
    <div id="sectionProducts" class="products"></div>
  </section>

  <section id="azScreen" class="screen">
    <div class="topbar">
      <button class="back" onclick="azScope==='section'?openArea(currentArea):goHome()">← Volver</button>
      <div class="titlebox"><h2 id="azTitle">Artículos A-Z</h2><small>Busca por letra, nombre o código</small></div>
    </div>
    <div class="card">
      <div class="search">
        <input id="azSearch" placeholder="Buscar por nombre o código…" oninput="renderAZ()">
        <button onclick="azSearch.value='';renderAZ()">Limpiar</button>
      </div>
    </div>
    <div class="card">
      <div id="letters" class="letters"></div>
    </div>
    <div class="resultsHead"><b id="azHeading">Todos los artículos</b><span class="count" id="azCount"></span></div>
    <div id="azProducts" class="products"></div>
  </section>
</main>

<div id="modal" class="modal" onclick="if(event.target===this)closeDetail()">
  <div id="sheet" class="sheet"></div>
</div>

<script>
const STORAGE_KEY='tpv_lab_v13_rect_products';
const SOURCE='../tpv-alimentacion-lab-verificado-20260908-cerrar/index.html';
let products=[], currentArea='', currentSub='', currentLetter='', azScope='all';

function applyListadoPrueba(){
  const wanted=new Set();
  for(let n=0;n<=144;n++)wanted.add(String(n).padStart(6,'0'));
  wanted.add('000795');
  products=products.filter(p=>wanted.has(String(p.code||'').padStart(6,'0')));
  products.forEach(p=>p.code=String(p.code||'').padStart(6,'0'));

  if(!products.some(p=>p.code==='000000')){
    products.push({code:'000000',name:'',price:0,unit:'kg',area:'Carne',subcat:'Otros',cat:'Otros',active:true});
  }
  if(!products.some(p=>p.code==='000795')){
    products.push({code:'000795',name:'',price:0,unit:'kg',area:'Carne',subcat:'Otros',cat:'Otros',active:true});
  }

  const fideua=products.find(p=>p.code==='000049');
  if(fideua)fideua.price=8778.88;

  products.sort((a,b)=>Number(a.code)-Number(b.code));
  source.textContent='PRUEBA · 146 códigos del listado impreso';
}

function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function norm(s){return String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLocaleLowerCase('es')}
function euro(n){return Number(n||0).toLocaleString('es-ES',{minimumFractionDigits:2,maximumFractionDigits:2})+' €'}
function subcats(p){return Array.from(new Set([...(Array.isArray(p.subcats)?p.subcats:[]),p.subcat,p.cat].filter(Boolean)))}
function normalizeArea(a){return a==='Carnicería'?'Carne':a}
function areaLabel(a){return a==='Carne'?'Carnicería':a}
function showScreen(id){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active');window.scrollTo({top:0,behavior:'instant'})}

function loadLocal(){
 try{
  const x=JSON.parse(localStorage.getItem(STORAGE_KEY)||'null');
  if(Array.isArray(x)&&x.length){products=x;source.textContent='Catálogo actual de este dispositivo';return true}
 }catch(e){}
 return false
}
function extractArray(src,name){
 let i=src.indexOf('const '+name+' =');if(i<0)i=src.indexOf('const '+name+'=');if(i<0)return null;i=src.indexOf('[',i);if(i<0)return null;
 let depth=0,quote='',escp=false;
 for(let j=i;j<src.length;j++){const c=src[j];if(quote){if(escp){escp=false;continue}if(c==='\\'){escp=true;continue}if(c===quote)quote='';continue}
 if(c==="'"||c==='"'||c==='\x60'){quote=c;continue}if(c==='[')depth++;else if(c===']'){depth--;if(depth===0){try{return Function('"use strict";return ('+src.slice(i,j+1)+')')()}catch(e){return null}}}}
 return null
}
function mergeByCode(base,arr){
 if(!Array.isArray(arr))return;arr.forEach(n=>{if(!n||!n.code)return;let p=base.find(x=>String(x.code)===String(n.code));if(p)Object.assign(p,n,{cat:n.subcat||n.cat||p.cat});else base.push({...n,cat:n.subcat||n.cat||'Otros',active:n.active!==false,offer:n.offer||{enabled:false,type:'none'}})})
}
async function loadFallback(){
 try{
  const src=await fetch(SOURCE+'?catalog='+Date.now(),{cache:'no-store'}).then(r=>r.text());
  let base=extractArray(src,'seedProducts')||[];
  ['importedCodes20260819','catalogCorrections20260905','catalogAdditions20260908','catalogCorrections20260907','pantryItems20260907'].forEach(n=>mergeByCode(base,extractArray(src,n)));
  products=base;source.textContent='Catálogo base leído del TPV original';
 }catch(e){products=[];source.textContent='No se pudo leer el catálogo';}
}

function goHome(){currentArea='';currentSub='';currentLetter='';showScreen('home')}
function openArea(a){
 currentArea=a;currentSub='';
 sectionTitle.textContent=areaLabel(a);
 const all=products.filter(p=>p.active!==false&&normalizeArea(p.area)===a);
 const subs=Array.from(new Set(all.flatMap(subcats))).sort((x,y)=>x.localeCompare(y,'es'));
 subgrid.innerHTML=subs.map(s=>{
   const n=all.filter(p=>subcats(p).includes(s)).length;
   return '<button class="subbtn" onclick="openSub('+JSON.stringify(s).replace(/"/g,'&quot;')+')">'+esc(s)+'<small>'+n+' artículos</small></button>';
 }).join('') || '<div class="empty">No hay subsecciones disponibles.</div>';
 showScreen('sectionScreen')
}
function openSub(s){
 currentSub=s;sectionSearch.value='';
 listTitle.textContent=areaLabel(currentArea)+' · '+s;
 listSubtitle.textContent='Consulta de artículos';
 renderList();showScreen('listScreen')
}
function backFromList(){openArea(currentArea)}
function renderProducts(list,target){
 document.getElementById(target).innerHTML=list.length?list.map(p=>'<button class="prod" onclick="detail('+JSON.stringify(String(p.code)).replace(/"/g,'&quot;')+')"><b>'+esc(p.name||'—')+'</b><small>Código '+esc(p.code)+'</small><div class="price">'+euro(p.price)+(p.unit==='kg'?' /kg':' /ud')+'</div></button>').join(''):'<div class="empty">No hay artículos con esta búsqueda.</div>'
}
function renderList(){
 let list=products.filter(p=>p.active!==false&&normalizeArea(p.area)===currentArea&&subcats(p).includes(currentSub));
 const term=norm(sectionSearch.value.trim());
 if(term)list=list.filter(p=>norm(p.name).includes(term)||String(p.code||'').includes(term)||(p.alternateCodes||[]).some(c=>String(c).includes(term)));
 list.sort((a,b)=>String(a.name||'').localeCompare(String(b.name||''),'es',{sensitivity:'base'}));
 listCount.textContent=list.length+' artículos';renderProducts(list,'sectionProducts')
}

function azBaseList(){
 let list=products.filter(p=>p.active!==false);
 if(azScope==='section')list=list.filter(p=>normalizeArea(p.area)===currentArea);
 return list
}
function openAZ(){
 azScope='all';currentArea='';currentLetter='';azSearch.value='';
 azTitle.textContent='Artículos A-Z';
 renderLetters();renderAZ();showScreen('azScreen')
}
function openSectionAZ(){
 azScope='section';currentLetter='';azSearch.value='';
 azTitle.textContent=areaLabel(currentArea)+' · Artículos A-Z';
 renderLetters();renderAZ();showScreen('azScreen')
}
function renderLetters(){
 const available=new Set(
   azBaseList().map(p=>String(p.name||'').trim()).filter(Boolean).map(n=>n.charAt(0).toLocaleUpperCase('es'))
 );
 const arr='ABCDEFGHIJKLMNÑOPQRSTUVWXYZ'.split('').filter(l=>available.has(l));
 if(currentLetter&&!available.has(currentLetter))currentLetter='';
 letters.innerHTML=arr.map(l=>'<button class="letter '+(currentLetter===l?'active':'')+'" data-letter="'+l+'">'+l+'</button>').join('');
 letters.querySelectorAll('.letter').forEach(btn=>btn.onclick=()=>{currentLetter=currentLetter===btn.dataset.letter?'':btn.dataset.letter;renderLetters();renderAZ()})
}
function renderAZ(){
 let list=azBaseList();
 if(currentLetter)list=list.filter(p=>norm(p.name).startsWith(norm(currentLetter)));
 const term=norm(azSearch.value.trim());
 if(term)list=list.filter(p=>norm(p.name).includes(term)||String(p.code||'').includes(term)||(p.alternateCodes||[]).some(c=>String(c).includes(term)));
 list.sort((a,b)=>String(a.name||'').localeCompare(String(b.name||''),'es',{sensitivity:'base'}));
 azHeading.textContent=currentLetter?'Letra '+currentLetter:(azScope==='section'?'Todos los artículos de '+areaLabel(currentArea):'Todos los artículos');
 azCount.textContent=list.length+' artículos';renderProducts(list,'azProducts')
}
function detail(code){
 const p=products.find(x=>String(x.code)===String(code));if(!p)return;
 const loc=[areaLabel(normalizeArea(p.area)),...subcats(p)].filter(Boolean).join(' · ');
 sheet.innerHTML='<div class="detailName">'+esc(p.name)+'</div><div class="code">Código '+esc(p.code)+'</div><p>'+esc(loc)+'</p><div class="detailPrice">'+euro(p.price)+(p.unit==='kg'?' /kg':' /ud')+'</div>'+(p.alternateCodes?.length?'<p><b>Otros códigos:</b> '+p.alternateCodes.map(esc).join(', ')+'</p>':'')+'<button class="close" onclick="closeDetail()">CERRAR</button>';
 modal.classList.add('show')
}
function closeDetail(){modal.classList.remove('show')}
(async()=>{if(!loadLocal())await loadFallback();applyListadoPrueba();})();
</script>
</body>
</html>
