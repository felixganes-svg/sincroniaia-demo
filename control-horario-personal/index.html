<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101828">
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
<title>SINCRONIAIA · Control Horario</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fff;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
#app{width:100%;height:100%;border:0;display:block}
</style>
</head>
<body>
<iframe id="app" src="./app-base.html?v=20260903-schedule0709-visible" allow="geolocation"></iframe>
<script>
const frame=document.getElementById('app');
frame.addEventListener('load',()=>{
  try{
    const w=frame.contentWindow,d=frame.contentDocument;
    if(!w||!d)return;

    if(!w.__schedule0709Applied){
      w.eval(`(()=>{
        const prev=SCHEDULES.find(s=>s.id==='NORMAL_2026');
        if(prev)prev.to='2026-09-06';
        if(!SCHEDULES.some(s=>s.id==='HORARIO_0709_2026')){
          SCHEDULES.push({id:'HORARIO_0709_2026',name:'Horario desde 07/09/2026',from:'2026-09-07',to:null,weeklyMinutes:2400,days:{
            1:[['17:00','20:15']],
            2:[['07:30','13:30']],
            3:[['07:30','13:45']],
            4:[['07:30','13:30'],['17:00','20:15']],
            5:[['07:30','13:30'],['17:00','20:15']],
            6:[['07:30','13:30']],
            0:[]
          }});
          SCHEDULES.sort((a,b)=>a.from.localeCompare(b.from));
        }
        render();
      })()`);
      w.__schedule0709Applied=true;
    }

    const summary=d.getElementById('scheduleSummary');
    if(summary&&!d.getElementById('schedule0709Notice')){
      const box=d.createElement('div');
      box.id='schedule0709Notice';
      box.className='schedule-box';
      box.innerHTML='<span class="tag next">PRÓXIMO</span> <b>Horario desde 07/09/2026</b><br><span class="muted">40:00 h/semana</span><div style="margin-top:8px;font-size:13px;line-height:1.6"><b>Lunes:</b> 17:00–20:15 · 3:15<br><b>Martes:</b> 07:30–13:30 · 6:00<br><b>Miércoles:</b> 07:30–13:45 · 6:15<br><b>Jueves:</b> 07:30–13:30 / 17:00–20:15 · 9:15<br><b>Viernes:</b> 07:30–13:30 / 17:00–20:15 · 9:15<br><b>Sábado:</b> 07:30–13:30 · 6:00<br><b>Domingo:</b> Descanso</div>';
      summary.insertAdjacentElement('afterend',box);
    }

    const company=d.getElementById('company');
    if(company&&!d.getElementById('correctionAccess')){
      const cards=[...company.querySelectorAll('.card')];
      const history=cards.find(x=>x.textContent.includes('Histórico mensual'));
      const card=d.createElement('div');
      card.className='card';
      card.id='correctionAccess';
      card.innerHTML='<b>Corrección de fichajes</b><p class="muted">Modifica una entrada o salida con copia previa y registro de auditoría.</p><button class="btn dark" id="openCorrection">CORREGIR FICHAJE</button>';
      if(history)history.parentNode.insertBefore(card,history);else company.appendChild(card);
      card.querySelector('#openCorrection').onclick=()=>{location.href='./corregir.html?v=20260903-schedule0709-visible'};
    }

    if(typeof w.doPunch==='function'&&!w.__sincroniaBackupWrapped){
      const original=w.doPunch;
      const snapshot=()=>{try{const o=JSON.parse(localStorage.getItem('sincroniaia_control_personal_master')||'{}');return JSON.stringify({days:o.days||{},open:o.open||null})}catch(e){return ''}};
      w.doPunch=async function(){
        const before=snapshot();
        await original.apply(w,arguments);
        const after=snapshot();
        if(before!==after&&typeof w.makeBackup==='function'){
          w.makeBackup();
          if(typeof w.toast==='function')w.toast('✅ Fichaje guardado + copia automática');
        }
      };
      w.__sincroniaBackupWrapped=true;
    }
  }catch(e){console.error('Control horario wrapper',e)}
});
</script>
</body>
</html>
