<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101828">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<title>SINCRONIAIA · Control Horario</title>
</head>
<body>
<div style="font-family:system-ui;padding:24px;text-align:center">Abriendo Control Horario…</div>
<script>
(async()=>{
  const K='sincroniaia_control_personal_master';
  let d={};
  try{d=JSON.parse(localStorage.getItem(K)||'{}')}catch(e){}
  if(!d.days)d.days={};
  if(!d.pending)d.pending=[];
  if(!d.backups)d.backups=[];
  if(!d.config)d.config={weeklyContractHours:40};

  // Regularización autorizada 29/08/2026: jornada 07:30–13:49.
  const day='2026-08-29';
  const inIso=new Date(2026,7,29,7,30,0).toISOString();
  const outIso=new Date(2026,7,29,13,49,0).toISOString();
  if(!d.days[day])d.days[day]={sessions:[],source:'regularizacion_manual_2026-08-29'};
  if(!Array.isArray(d.days[day].sessions))d.days[day].sessions=[];
  let target=d.days[day].sessions.find(s=>{
    const x=new Date(s.in);
    return Number.isFinite(x.getTime())&&x.getHours()===7&&x.getMinutes()===30;
  });
  if(target){
    target.in=inIso;
    target.out=outIso;
    target.minutes=379;
    target.source='regularizacion_manual_2026-08-29_0730_1349';
  }else{
    d.days[day].sessions.push({in:inIso,out:outIso,minutes:379,source:'regularizacion_manual_2026-08-29_0730_1349'});
  }
  if(d.open){
    const x=new Date(d.open.in);
    if(Number.isFinite(x.getTime())&&x.getFullYear()===2026&&x.getMonth()===7&&x.getDate()===29)d.open=null;
  }
  localStorage.setItem(K,JSON.stringify(d));

  if('serviceWorker' in navigator){
    try{await navigator.serviceWorker.register('./sw.js',{scope:'./'});}catch(e){console.warn('PWA SW',e)}
  }
  try{
    const r=await fetch('./app.html?v=20260829-pwa3',{cache:'no-store'});
    if(!r.ok)throw new Error('No se pudo cargar app.html');
    let html=await r.text();
    const pwa='<link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon.svg" type="image/svg+xml"><meta name="theme-color" content="#101828"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">';
    html=html.replace('</head>',pwa+'</head>');
    document.open();document.write(html);document.close();
  }catch(e){
    location.replace('./app.html?v=20260829-pwa3');
  }
})();
</script>
</body>
</html>
