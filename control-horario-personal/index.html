<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101828">
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
<title>SINCRONIAIA · Control Horario</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fff;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
#app{width:100%;height:100%;border:0;display:block}
</style>
</head>
<body>
<iframe id="app" src="./app-base.html?v=20260914-banco-24agosto-300" allow="geolocation"></iframe>
<script>
const frame=document.getElementById('app');
frame.addEventListener('load',()=>{
  try{
    const w=frame.contentWindow,d=frame.contentDocument;
    if(!w||!d)return;

    // Nuevo periodo de horario desde 14/09/2026. El histórico anterior queda intacto.
    if(!w.__schedule1409Applied){
      try{
        w.eval(`(()=>{
          const anterior=SCHEDULES.find(s=>s.id==='HORARIO_0709_2026');
          if(anterior)anterior.to='2026-09-13';
          if(!SCHEDULES.some(s=>s.id==='HORARIO_1409_2026')){
            SCHEDULES.push({
              id:'HORARIO_1409_2026',
              name:'Horario desde 14/09/2026',
              from:'2026-09-14',
              to:null,
              weeklyMinutes:2400,
              days:{
                1:[['17:00','20:00']],
                2:[['08:00','13:30'],['17:00','20:00']],
                3:[['07:30','13:30']],
                4:[['09:00','13:30'],['17:00','20:00']],
                5:[['07:30','13:30'],['17:00','20:00']],
                6:[['07:30','13:30']],
                0:[]
              }
            });
          }
          render();
        })()`);
      }catch(e){console.error('Horario desde 14/09',e)}
      w.__schedule1409Applied=true;
    }

    // Cómputo histórico confirmado del 24/08/2026.
    // El fichaje real fue 08:30–13:30 = 5:00; el horario previsto era 07:30–13:30 = 6:00.
    // Por tanto este día genera -1:00 en el banco y NO se altera el fichaje real.
    if(!w.__compute2408Applied){
      try{
        w.eval(`(()=>{
          HISTORICAL_COMPUTE['2026-08-24']=300;
          HISTORICAL_NOTES['2026-08-24']='Fichaje real 08:30–13:30 (5:00). Horario previsto 07:30–13:30 (6:00). Diferencia banco: -1:00, posteriormente recuperada.';
          render();
        })()`);
      }catch(e){console.error('Cómputo 24/08',e)}
      w.__compute2408Applied=true;
    }

    // Fichaje real confirmado: 08/09/2026 · 07:30–13:45.
    if(!w.__fix0809Applied){
      try{
        w.eval(`(()=>{
          const k='2026-09-08';
          data.days[k]={sessions:[{
            in:isoLocal(2026,9,8,7,30,0),
            out:isoLocal(2026,9,8,13,45,0),
            minutes:375,
            source:'fichaje confirmado',
            fichajeEntrada:'F-20260908-073000-CONFIRMADO',
            fichajeSalida:'F-20260908-134500-CONFIRMADO'
          }],source:'fichaje confirmado'};
          save();render();
        })()`);
      }catch(e){console.error('Fichaje 08/09',e)}
      w.__fix0809Applied=true;
    }

    // Fichaje real confirmado: 09/09/2026 · 07:30–13:45.
    if(!w.__fix0909Applied){
      try{
        w.eval(`(()=>{
          const k='2026-09-09';
          data.days[k]={sessions:[{
            in:isoLocal(2026,9,9,7,30,0),
            out:isoLocal(2026,9,9,13,45,0),
            minutes:375,
            source:'fichaje confirmado',
            fichajeEntrada:'F-20260909-073000-CONFIRMADO',
            fichajeSalida:'F-20260909-134500-CONFIRMADO'
          }],source:'fichaje confirmado'};
          save();render();
        })()`);
      }catch(e){console.error('Fichaje 09/09',e)}
      w.__fix0909Applied=true;
    }

    // Fichaje real confirmado: 10/09/2026 · 07:30–13:35 y 17:00–20:15.
    if(!w.__fix1009DoubleApplied){
      try{
        w.eval(`(()=>{
          const k='2026-09-10';
          data.days[k]={sessions:[
            {
              in:isoLocal(2026,9,10,7,30,0),
              out:isoLocal(2026,9,10,13,35,0),
              minutes:365,
              source:'fichaje confirmado',
              fichajeEntrada:'F-20260910-073000-MANUAL',
              fichajeSalida:'F-20260910-133500-MANUAL'
            },
            {
              in:isoLocal(2026,9,10,17,0,0),
              out:isoLocal(2026,9,10,20,15,0),
              minutes:195,
              source:'fichaje confirmado',
              fichajeEntrada:'F-20260910-170000-CONFIRMADO',
              fichajeSalida:'F-20260910-201500-CONFIRMADO'
            }
          ],source:'fichaje confirmado'};
          if(data.open&&dateKey(new Date(data.open.in))===k)data.open=null;
          save();render();
        })()`);
      }catch(e){console.error('Fichaje 10/09',e)}
      w.__fix1009DoubleApplied=true;
    }

    const bankNote=d.getElementById('bankNote');
    if(bankNote&&!d.getElementById('bankExplanation')){
      const info=d.createElement('div');
      info.id='bankExplanation';
      info.style.cssText='margin-top:10px;padding:12px;border-radius:14px;background:#f8fafc;border:1px solid #e4e7ec;font-size:13px;line-height:1.55';
      bankNote.parentNode.insertBefore(info,bankNote.nextSibling);
    }
    const updateBankExplanation=()=>{
      const info=d.getElementById('bankExplanation');
      if(!info)return;
      try{
        const state=w.eval('bankState(new Date())');
        const fmt=m=>w.eval('dur('+Math.abs(Math.round(m||0))+')');
        const historical=w.eval(`(()=>{
          const w1s=new Date('2026-08-17T00:00:00'),w1e=new Date('2026-08-23T23:59:59');
          const w2s=new Date('2026-08-24T00:00:00'),w2e=new Date('2026-08-30T23:59:59');
          const w4s=new Date('2026-09-07T00:00:00'),w4e=new Date('2026-09-13T23:59:59');
          return {a:sumComputableBetween(w1s,w1e)-contractMinutesWeek(),b:sumComputableBetween(w2s,w2e)-contractMinutesWeek(),c:sumComputableBetween(w4s,w4e)-contractMinutesWeek()};
        })()`);
        const parts=[];
        parts.push('<b>24/08:</b> fichaje real 5:00 frente a 6:00 previstas → <b>-1:00</b>.');
        if(historical){
          parts.push('<b>Semana 17–23/08:</b> '+(historical.a<0?'-':'+')+fmt(historical.a)+'.');
          parts.push('<b>Semana 24–30/08:</b> '+(historical.b<0?'-':'+')+fmt(historical.b)+'.');
          parts.push('<b>Semana 07–13/09:</b> '+(historical.c<0?'-':'+')+fmt(historical.c)+'.');
          const cierre=historical.a+historical.b+historical.c;
          parts.push('<b>Saldo tras recuperar las horas pendientes:</b> '+(cierre===0?'0:00 · CUADRADO':(cierre<0?'-':'+')+fmt(cierre))+'.');
        }
        if(state&&state.current!==0)parts.push('<span class="muted">El saldo de la semana actual se calcula aparte desde el 14/09.</span>');
        info.innerHTML=parts.join('<br>');
      }catch(e){info.textContent='El saldo se calcula semana a semana y conserva el fichaje real.'}
    };
    updateBankExplanation();
    setInterval(updateBankExplanation,1500);

    const company=d.getElementById('company');
    if(company&&!d.getElementById('correctionAccess')){
      const cards=[...company.querySelectorAll('.card')];
      const history=cards.find(x=>x.textContent.includes('Histórico mensual'));
      const card=d.createElement('div');
      card.className='card';
      card.id='correctionAccess';
      card.innerHTML='<b>Corrección de fichajes</b><p class="muted">Modifica una entrada o salida con copia previa y registro de auditoría.</p><button class="btn dark" id="openCorrection">CORREGIR FICHAJE</button>';
      if(history)history.parentNode.insertBefore(card,history);else company.appendChild(card);
      card.querySelector('#openCorrection').onclick=()=>{location.href='./corregir.html?v=20260903-day-detail'};
    }

    if(typeof w.doPunch==='function'&&!w.__sincroniaBackupWrapped){
      const original=w.doPunch;
      const snapshot=()=>{try{const o=JSON.parse(localStorage.getItem('sincroniaia_control_personal_master')||'{}');return JSON.stringify({days:o.days||{},open:o.open||null})}catch(e){return ''}};
      w.doPunch=async function(){
        const before=snapshot();
        await original.apply(w,arguments);
        const after=snapshot();
        if(before!==after&&typeof w.makeBackup==='function'){
          w.makeBackup();
          if(typeof w.toast==='function')w.toast('✅ Fichaje guardado + copia automática');
        }
      };
      w.__sincroniaBackupWrapped=true;
    }
  }catch(e){console.error('Control horario wrapper',e)}
});
</script>
</body>
</html>
