<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101828">
<link rel="manifest" href="./manifest.webmanifest">
<title>SINCRONIAIA · Control Horario</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fff}#app{width:100%;height:100%;border:0;display:block}</style>
</head>
<body>
<iframe id="app" src="./app-base.html?v=20260829-backup-correction" allow="geolocation"></iframe>
<script>
const frame=document.getElementById('app');
frame.addEventListener('load',()=>{
  const w=frame.contentWindow,d=frame.contentDocument;
  if(!w||!d)return;
  try{
    const company=d.getElementById('company');
    const history=[...company.querySelectorAll('.card')].find(x=>x.textContent.includes('Histórico mensual'));
    if(history&&!d.getElementById('correctionAccess')){
      const card=d.createElement('div');
      card.className='card';card.id='correctionAccess';
      card.innerHTML='<b>Corrección de fichajes</b><p class="muted">La empresa puede corregir una entrada o salida. Antes de guardar se crea una copia y queda registrada la modificación.</p><button class="btn dark" id="openCorrection">CORREGIR FICHAJE</button>';
      history.parentNode.insertBefore(card,history);
      card.querySelector('#openCorrection').onclick=()=>{location.href='./corregir.html'};
    }
    if(typeof w.doPunch==='function'&&!w.__sincroniaBackupWrapped){
      const original=w.doPunch;
      const core=()=>{try{const o=JSON.parse(localStorage.getItem('sincroniaia_control_personal_master')||'{}');return JSON.stringify({days:o.days||{},open:o.open||null})}catch(e){return ''}};
      w.doPunch=async function(){
        const before=core();
        await original.apply(w,arguments);
        const after=core();
        if(before!==after&&typeof w.makeBackup==='function'){
          w.makeBackup();
          if(typeof w.toast==='function')w.toast('✅ Fichaje guardado + copia automática');
        }
      };
      w.__sincroniaBackupWrapped=true;
    }
  }catch(e){console.error('Integración control horario',e)}
});
</script>
</body>
</html>
