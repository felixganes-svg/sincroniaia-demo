<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101828">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<title>SINCRONIAIA · Control Horario</title>
</head>
<body>
<div style="font-family:system-ui;padding:24px;text-align:center">Abriendo Control Horario…</div>
<script>
(async()=>{
  const K='sincroniaia_control_personal_master';
  const BK='sincroniaia_control_personal_autobackups_v1';
  const INCIDENTS='sincroniaia_control_personal_integrity_incidents_v1';
  const nativeSet=Storage.prototype.setItem;

  function parse(v,fallback){try{return JSON.parse(v)}catch(e){return fallback}}
  function historicalCount(obj){
    if(!obj||!obj.days)return 0;
    const today=new Date(); today.setHours(0,0,0,0);
    let n=0;
    Object.entries(obj.days).forEach(([k,v])=>{
      const dt=new Date(k+'T12:00:00');
      if(dt<today&&Array.isArray(v?.sessions)) n+=v.sessions.filter(s=>s&&s.in&&s.out).length;
    });
    return n;
  }
  function pushBackup(raw,reason){
    if(!raw)return;
    const arr=parse(localStorage.getItem(BK),[]);
    arr.unshift({at:new Date().toISOString(),reason,data:raw});
    nativeSet.call(localStorage,BK,JSON.stringify(arr.slice(0,30)));
  }
  function logIncident(type,detail){
    const arr=parse(localStorage.getItem(INCIDENTS),[]);
    arr.unshift({at:new Date().toISOString(),type,detail});
    nativeSet.call(localStorage,INCIDENTS,JSON.stringify(arr.slice(0,50)));
  }

  // Protección transversal: antes de sobrescribir el histórico se conserva una copia.
  // Si una actualización intenta guardar menos sesiones históricas cerradas, se bloquea.
  Storage.prototype.setItem=function(key,value){
    if(this===localStorage&&key===K){
      const previous=localStorage.getItem(K);
      if(previous&&previous!==value){
        pushBackup(previous,'antes_de_guardar');
        const prevObj=parse(previous,null),nextObj=parse(value,null);
        const prevCount=historicalCount(prevObj),nextCount=historicalCount(nextObj);
        if(prevCount>0&&nextObj&&nextCount<prevCount){
          logIncident('BLOQUEO_PERDIDA_HISTORICO',{prevCount,nextCount});
          return;
        }
      }
    }
    return nativeSet.call(this,key,value);
  };

  let raw=localStorage.getItem(K);
  let d=parse(raw,null);

  // Recuperación automática si la clave maestra se pierde o queda ilegible.
  if(!d||typeof d!=='object'){
    const backups=parse(localStorage.getItem(BK),[]);
    for(const b of backups){
      const candidate=parse(b.data,null);
      if(candidate&&candidate.days){d=candidate;break;}
    }
  }
  if(!d||typeof d!=='object')d={};
  if(!d.days)d.days={};
  if(!d.pending)d.pending=[];
  if(!d.backups)d.backups=[];
  if(!d.config)d.config={weeklyContractHours:40};
  if(!Array.isArray(d.audit))d.audit=[];

  function ensureConfirmedDay(day,y,m,dd,hh1,mm1,hh2,mm2,source){
    const inIso=new Date(y,m-1,dd,hh1,mm1,0).toISOString();
    const outIso=new Date(y,m-1,dd,hh2,mm2,0).toISOString();
    const minutes=(hh2*60+mm2)-(hh1*60+mm1);
    if(!d.days[day])d.days[day]={sessions:[],source};
    if(!Array.isArray(d.days[day].sessions))d.days[day].sessions=[];
    let target=d.days[day].sessions.find(s=>{
      const x=new Date(s.in);
      return Number.isFinite(x.getTime())&&x.getHours()===hh1&&x.getMinutes()===mm1;
    });
    if(target){
      target.in=inIso;target.out=outIso;target.minutes=minutes;target.source=source;
    }else{
      d.days[day].sessions.push({in:inIso,out:outIso,minutes,source});
    }
  }

  // Histórico confirmado por el responsable. Estas jornadas no pueden desaparecer por una actualización.
  ensureConfirmedDay('2026-08-27',2026,8,27,7,30,13,30,'historico_confirmado_2026-08-27');
  ensureConfirmedDay('2026-08-28',2026,8,28,7,30,13,30,'historico_confirmado_2026-08-28');
  ensureConfirmedDay('2026-08-29',2026,8,29,7,30,13,30,'regularizacion_confirmada_2026-08-29');

  if(d.open){
    const x=new Date(d.open.in);
    if(Number.isFinite(x.getTime())&&x.getFullYear()===2026&&x.getMonth()===7&&x.getDate()===29)d.open=null;
  }
  localStorage.setItem(K,JSON.stringify(d));

  if('serviceWorker' in navigator){
    try{await navigator.serviceWorker.register('./sw.js',{scope:'./'});}catch(e){console.warn('PWA SW',e)}
  }
  try{
    const r=await fetch('./app.html?v=20260829-correction1',{cache:'no-store'});
    if(!r.ok)throw new Error('No se pudo cargar app.html');
    let html=await r.text();
    const pwa='<link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon.svg" type="image/svg+xml"><meta name="theme-color" content="#101828"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">';
    html=html.replace('</head>',pwa+'</head>');

    const correctionCard='<div class="card" id="correctionCard"><b>Corregir fichaje</b><p class="muted">Modificación manual auditada. El valor anterior se conserva en el registro de cambios.</p><label class="muted">Fecha</label><input id="corrDate" type="date" style="width:100%;padding:11px;border:1px solid #d0d5dd;border-radius:12px;margin:5px 0 8px;font-size:16px" onchange="loadCorrectionDay()"><label class="muted">Periodo</label><select id="corrSession" style="width:100%;padding:11px;border:1px solid #d0d5dd;border-radius:12px;margin:5px 0 8px;font-size:16px" onchange="loadCorrectionSession()"><option value="">Selecciona una fecha</option></select><div class="row"><div><label class="muted">Entrada</label><input id="corrIn" type="time" style="width:100%;padding:11px;border:1px solid #d0d5dd;border-radius:12px;margin-top:5px;font-size:16px"></div><div><label class="muted">Salida</label><input id="corrOut" type="time" style="width:100%;padding:11px;border:1px solid #d0d5dd;border-radius:12px;margin-top:5px;font-size:16px"></div></div><label class="muted" style="display:block;margin-top:9px">Motivo de la corrección</label><input id="corrReason" type="text" maxlength="180" placeholder="Ej.: salida anotada incorrectamente" style="width:100%;padding:11px;border:1px solid #d0d5dd;border-radius:12px;margin:5px 0 2px;font-size:16px"><button class="btn dark" onclick="applyCorrection()">GUARDAR CORRECCIÓN</button><div id="corrInfo" class="sync muted"></div><details><summary>Registro de modificaciones</summary><div id="auditList" class="muted" style="margin-top:8px">Sin modificaciones manuales.</div></details></div>';
    html=html.replace('<div class="card"><b>Histórico mensual</b>',correctionCard+'<div class="card"><b>Histórico mensual</b>');

    const correctionScript='<script>(function(){function p2(n){return String(n).padStart(2,"0")}function localDayIso(day,time){var a=day.split("-").map(Number),b=time.split(":").map(Number);return new Date(a[0],a[1]-1,a[2],b[0],b[1],0).toISOString()}function hhmm(v){var x=new Date(v);return Number.isFinite(x.getTime())?p2(x.getHours())+":"+p2(x.getMinutes()):""}window.loadCorrectionDay=function(){var day=document.getElementById("corrDate").value,sel=document.getElementById("corrSession"),ss=(data.days[day]&&Array.isArray(data.days[day].sessions))?data.days[day].sessions:[];sel.innerHTML=ss.length?ss.map(function(s,i){return "<option value=\\""+i+"\\">Periodo "+(i+1)+" · "+hhmm(s.in)+"–"+hhmm(s.out)+"</option>"}).join(""):"<option value=\\"\\">No hay fichajes cerrados ese día</option>";if(ss.length){sel.value="0";loadCorrectionSession()}else{document.getElementById("corrIn").value="";document.getElementById("corrOut").value=""}};window.loadCorrectionSession=function(){var day=document.getElementById("corrDate").value,i=Number(document.getElementById("corrSession").value),s=data.days[day]&&data.days[day].sessions&&data.days[day].sessions[i];if(!s)return;document.getElementById("corrIn").value=hhmm(s.in);document.getElementById("corrOut").value=hhmm(s.out)};window.renderCorrectionAudit=function(){if(!Array.isArray(data.audit))data.audit=[];var el=document.getElementById("auditList");if(!el)return;el.innerHTML=data.audit.length?data.audit.slice(0,10).map(function(a){return "<div class=\\"backup-item\\"><b>"+(a.day||"")+"</b> · "+(a.before?a.before.in+"–"+a.before.out:"")+" → <b>"+(a.after?a.after.in+"–"+a.after.out:"")+"</b><br><span class=\\"tiny\\">"+(a.reason||"")+" · "+new Date(a.at).toLocaleString("es-ES")+"</span></div>"}).join(""):"Sin modificaciones manuales."};window.applyCorrection=function(){var day=document.getElementById("corrDate").value,rawIndex=document.getElementById("corrSession").value,ti=document.getElementById("corrIn").value,to=document.getElementById("corrOut").value,reason=document.getElementById("corrReason").value.trim();if(!day||rawIndex===""){toast("⚠️ Selecciona un fichaje existente");return}var i=Number(rawIndex),s=data.days[day]&&data.days[day].sessions&&data.days[day].sessions[i];if(!s){toast("⚠️ No se encuentra ese fichaje");return}if(!ti||!to){toast("⚠️ Indica entrada y salida");return}var ni=localDayIso(day,ti),no=localDayIso(day,to),mins=Math.floor((new Date(no)-new Date(ni))/60000);if(!Number.isFinite(mins)||mins<=0||mins>1440){toast("⚠️ Revisa las horas indicadas");return}if(reason.length<4){toast("⚠️ Indica el motivo de la corrección");return}var before={in:hhmm(s.in),out:hhmm(s.out),minutes:s.minutes};var after={in:ti,out:to,minutes:mins};if(before.in===after.in&&before.out===after.out){toast("ℹ️ No hay ningún cambio que guardar");return}if(!confirm("¿Confirmas corregir "+day+" de "+before.in+"–"+before.out+" a "+after.in+"–"+after.out+"?"))return;if(!Array.isArray(data.audit))data.audit=[];data.audit.unshift({at:new Date().toISOString(),actor:"Empresa",action:"CORRECCION_FICHAJE",day:day,sessionIndex:i,before:before,after:after,reason:reason});data.audit=data.audit.slice(0,100);s.in=ni;s.out=no;s.minutes=mins;s.source="correccion_empresa_auditada";save();render();renderCorrectionAudit();loadCorrectionDay();document.getElementById("corrReason").value="";document.getElementById("corrInfo").innerHTML="<span class=\\"ok\\">✅ Corrección guardada con auditoría y copia automática.</span>";toast("✅ Fichaje corregido y auditado")};setTimeout(function(){var d=document.getElementById("corrDate");if(d){d.value=dateKey(new Date());loadCorrectionDay();renderCorrectionAudit()}},0)})();<\/script>';
    html=html.replace('</body>',correctionScript+'</body>');
    document.open();document.write(html);document.close();
  }catch(e){
    location.replace('./app.html?v=20260829-correction1');
  }
})();
</script>
</body>
</html>
