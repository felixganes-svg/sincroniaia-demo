<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101828">
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
<title>SINCRONIAIA · Control Horario</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fff;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
#app{width:100%;height:100%;border:0;display:block}
#correctionBar{position:fixed;left:12px;right:12px;bottom:12px;z-index:9999;background:#101828;color:#fff;border-radius:14px;padding:12px 14px;box-shadow:0 8px 24px rgba(16,24,40,.25);display:flex;align-items:center;gap:10px}
#correctionBar .txt{flex:1;font-size:13px;line-height:1.25}#correctionBar b{display:block;font-size:14px}
#correctionBar button{border:0;border-radius:10px;background:#fff;color:#101828;padding:10px 12px;font-weight:800;white-space:nowrap}
</style>
</head>
<body>
<iframe id="app" src="./app-base.html?v=20260829-stable-final" allow="geolocation"></iframe>
<div id="correctionBar"><div class="txt"><b>Empresa · Corrección de fichajes</b>Modifica una entrada o salida con copia y auditoría.</div><button onclick="location.href='./corregir.html?v=20260829-final'">CORREGIR FICHAJE</button></div>
<script>
const frame=document.getElementById('app');
frame.addEventListener('load',()=>{
  try{
    const w=frame.contentWindow;
    if(typeof w.doPunch==='function'&&!w.__sincroniaBackupWrapped){
      const original=w.doPunch;
      const snapshot=()=>{try{const o=JSON.parse(localStorage.getItem('sincroniaia_control_personal_master')||'{}');return JSON.stringify({days:o.days||{},open:o.open||null})}catch(e){return ''}};
      w.doPunch=async function(){
        const before=snapshot();
        await original.apply(w,arguments);
        const after=snapshot();
        if(before!==after&&typeof w.makeBackup==='function'){
          w.makeBackup();
          if(typeof w.toast==='function')w.toast('✅ Fichaje guardado + copia automática');
        }
      };
      w.__sincroniaBackupWrapped=true;
    }
  }catch(e){console.error('Control horario wrapper',e)}
});
</script>
</body>
</html>
