<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101828">
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
<title>SINCRONIAIA · Control Horario</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fff;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
#app{width:100%;height:100%;border:0;display:block}
</style>
</head>
<body>
<iframe id="app" src="./app-base.html?v=20260917-restaurado-estable" allow="geolocation"></iframe>
<script>
const frame=document.getElementById('app');
frame.addEventListener('load',()=>{
  try{
    const w=frame.contentWindow,d=frame.contentDocument;
    if(!w||!d)return;

    if(!w.__schedule1409Applied){
      try{
        w.eval(`(()=>{
          const anterior=SCHEDULES.find(s=>s.id==='HORARIO_0709_2026');
          if(anterior)anterior.to='2026-09-13';
          if(!SCHEDULES.some(s=>s.id==='HORARIO_1409_2026')){
            SCHEDULES.push({
              id:'HORARIO_1409_2026',name:'Horario desde 14/09/2026',from:'2026-09-14',to:null,weeklyMinutes:2400,
              days:{1:[['17:00','20:00']],2:[['08:00','13:30'],['17:00','20:00']],3:[['07:30','13:30']],4:[['09:00','13:30'],['17:00','20:00']],5:[['07:30','13:30'],['17:00','20:00']],6:[['07:30','13:30']],0:[]}
            });
          }
          render();
        })()`);
      }catch(e){console.error('Horario desde 14/09',e)}
      w.__schedule1409Applied=true;
    }

    if(!w.__historicalBankFixApplied){
      try{
        w.eval(`(()=>{
          HISTORICAL_COMPUTE['2026-08-24']=300;
          HISTORICAL_NOTES['2026-08-24']='Fichaje real 08:30–13:30 (5:00). Horario previsto 07:30–13:30 (6:00). Diferencia: -1:00. Recuperada en la semana 07–13/09.';
          HISTORICAL_COMPUTE['2026-09-12']=360;
          HISTORICAL_NOTES['2026-09-12']='Fichaje real 07:30–13:38 (6:08). Cómputo de banco: 6:00. Los 8 minutos residuales no generan nuevo saldo.';
          render();
        })()`);
      }catch(e){console.error('Cómputo histórico banco',e)}
      w.__historicalBankFixApplied=true;
    }

    if(!w.__fix0809Applied){
      try{w.eval(`(()=>{const k='2026-09-08';data.days[k]={sessions:[{in:isoLocal(2026,9,8,7,30,0),out:isoLocal(2026,9,8,13,45,0),minutes:375,source:'fichaje confirmado',fichajeEntrada:'F-20260908-073000-CONFIRMADO',fichajeSalida:'F-20260908-134500-CONFIRMADO'}],source:'fichaje confirmado'};save();render();})()`)}catch(e){console.error('Fichaje 08/09',e)}
      w.__fix0809Applied=true;
    }

    if(!w.__fix0909Applied){
      try{w.eval(`(()=>{const k='2026-09-09';data.days[k]={sessions:[{in:isoLocal(2026,9,9,7,30,0),out:isoLocal(2026,9,9,13,45,0),minutes:375,source:'fichaje confirmado',fichajeEntrada:'F-20260909-073000-CONFIRMADO',fichajeSalida:'F-20260909-134500-CONFIRMADO'}],source:'fichaje confirmado'};save();render();})()`)}catch(e){console.error('Fichaje 09/09',e)}
      w.__fix0909Applied=true;
    }

    if(!w.__fix1009DoubleApplied){
      try{
        w.eval(`(()=>{
          const k='2026-09-10';
          data.days[k]={sessions:[
            {in:isoLocal(2026,9,10,7,30,0),out:isoLocal(2026,9,10,13,35,0),minutes:365,source:'fichaje confirmado',fichajeEntrada:'F-20260910-073000-MANUAL',fichajeSalida:'F-20260910-133500-MANUAL'},
            {in:isoLocal(2026,9,10,17,0,0),out:isoLocal(2026,9,10,20,15,0),minutes:195,source:'fichaje confirmado',fichajeEntrada:'F-20260910-170000-CONFIRMADO',fichajeSalida:'F-20260910-201500-CONFIRMADO'}
          ],source:'fichaje confirmado'};
          if(data.open&&dateKey(new Date(data.open.in))===k)data.open=null;
          save();render();
        })()`);
      }catch(e){console.error('Fichaje 10/09',e)}
      w.__fix1009DoubleApplied=true;
    }

    const bankNote=d.getElementById('bankNote');
    if(bankNote&&!d.getElementById('bankExplanation')){
      const info=d.createElement('div');
      info.id='bankExplanation';
      info.style.cssText='margin-top:10px;padding:12px;border-radius:14px;background:#f8fafc;border:1px solid #e4e7ec;font-size:13px;line-height:1.6';
      bankNote.parentNode.insertBefore(info,bankNote.nextSibling);
    }

    const updateBankUI=()=>{
      try{
        const now=new Date();
        const state=w.eval('bankState(new Date())');
        const fmt=m=>w.eval('dur('+Math.abs(Math.round(m||0))+')');
        const signed=m=>(m<0?'−':m>0?'+':'')+fmt(m);
        const bp=d.getElementById('bankPrevious'),bd=d.getElementById('bankWeekDelta'),bc=d.getElementById('bankCurrent'),bn=d.getElementById('bankNote');
        if(state){
          if(bp)bp.textContent=signed(state.previous);
          if(bd)bd.textContent=signed(state.weekDelta);
          if(bc)bc.textContent=signed(state.current);
          if(bn)bn.textContent=state.current>0?'Horas a favor del trabajador: '+fmt(state.current):state.current<0?'Horas pendientes: '+fmt(state.current):'Banco de horas cuadrado: 0:00';
        }
        const info=d.getElementById('bankExplanation');
        if(info){
          info.innerHTML='<b style="font-size:14px">Trazabilidad de horas recuperadas</b><br><br><b>17–23/08:</b> 39:00 h − 40:00 h = <b>−1:00 h</b> → <b>recuperada en 07–13/09</b>.<br><b>24/08:</b> fichaje real 08:30–13:30 = 5:00 h; previstas 07:30–13:30 = 6:00 h → <b>−1:00 h adicional</b> → <b>recuperada en 07–13/09</b>.<br><b>24–30/08:</b> saldo ordinario semanal 39:00 h − 40:00 h = <b>−1:00 h</b> → <b>recuperada en 07–13/09</b>.<br><br><b>Total pendiente acumulado:</b> −3:00 h.<br><b>Semana 07–13/09:</b> 43:00 h computables − 40:00 h = <b>+3:00 h</b> destinadas a recuperar el saldo anterior.<br><b>Fichaje real de la semana:</b> 43:08 h; los 8 minutos residuales quedan visibles pero no generan banco.<br><b>Saldo histórico pendiente al 13/09:</b> <b>0:00 h · CUADRADO</b>.';
        }
      }catch(e){console.error('Banco UI',e)}
    };
    updateBankUI();
    setInterval(updateBankUI,1500);

    const company=d.getElementById('company');
    if(company&&!d.getElementById('correctionAccess')){
      const cards=[...company.querySelectorAll('.card')];
      const history=cards.find(x=>x.textContent.includes('Histórico mensual'));
      const card=d.createElement('div');
      card.className='card';card.id='correctionAccess';
      card.innerHTML='<b>Corrección de fichajes</b><p class="muted">Modifica una entrada o salida con copia previa y registro de auditoría.</p><button class="btn dark" id="openCorrection">CORREGIR FICHAJE</button>';
      if(history)history.parentNode.insertBefore(card,history);else company.appendChild(card);
      card.querySelector('#openCorrection').onclick=()=>{location.href='./corregir.html?v=20260903-day-detail'};
    }

    if(typeof w.doPunch==='function'&&!w.__sincroniaBackupWrapped){
      const original=w.doPunch;
      const snapshot=()=>{try{const o=JSON.parse(localStorage.getItem('sincroniaia_control_personal_master')||'{}');return JSON.stringify({days:o.days||{},open:o.open||null})}catch(e){return ''}};
      w.doPunch=async function(){const before=snapshot();await original.apply(w,arguments);const after=snapshot();if(before!==after&&typeof w.makeBackup==='function'){w.makeBackup();if(typeof w.toast==='function')w.toast('✅ Fichaje guardado + copia automática')}};
      w.__sincroniaBackupWrapped=true;
    }
  }catch(e){console.error('Control horario wrapper',e)}
});
</script>
</body>
</html>
