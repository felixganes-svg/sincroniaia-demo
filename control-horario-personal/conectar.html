<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101828">
<title>SINCRONIAIA · Conectar dispositivo</title>
<style>
html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:#f4f6f8;color:#172033}.wrap{max-width:560px;margin:0 auto;padding:28px 16px}.card{background:#fff;border:1px solid #e4e7ec;border-radius:18px;padding:22px;box-shadow:0 1px 3px rgba(16,24,40,.08)}h1{font-size:20px;margin:0 0 10px}.muted{color:#667085;font-size:14px;line-height:1.5}.ok{margin-top:16px;padding:12px;border-radius:12px;background:#eaf8ef;color:#176b3a;font-weight:700}.err{margin-top:16px;padding:12px;border-radius:12px;background:#fff4e5;color:#b54708;font-weight:700}.btn{display:block;width:100%;margin-top:16px;border:0;border-radius:14px;padding:14px;background:#101828;color:#fff;font-size:16px;font-weight:800;text-decoration:none;text-align:center;box-sizing:border-box}
</style>
</head>
<body>
<div class="wrap"><div class="card">
<h1>Conectar este dispositivo</h1>
<p class="muted">Esta página guarda la clave de acceso del backend únicamente en este navegador y después vuelve al Control Horario.</p>
<div id="state"></div>
<a id="go" class="btn" href="./?from=app">VOLVER AL CONTROL HORARIO</a>
</div></div>
<script>
(()=>{
  const ACCESS_KEY_NAME='sincroniaia_felix_backend_key';
  const state=document.getElementById('state');
  const key=new URLSearchParams(location.search).get('k');
  if(key&&key.trim()){
    localStorage.setItem(ACCESS_KEY_NAME,key.trim());
    history.replaceState({},document.title,location.pathname);
    state.className='ok';
    state.textContent='✅ Dispositivo autorizado. Ya puedes volver al Control Horario.';
    setTimeout(()=>location.replace('./?from=app'),900);
  }else if(localStorage.getItem(ACCESS_KEY_NAME)){
    state.className='ok';
    state.textContent='✅ Este dispositivo ya tiene una clave de acceso guardada.';
  }else{
    state.className='err';
    state.textContent='⚠️ Falta la clave de acceso. Abre esta página con ?k=TU_CLAVE.';
  }
})();
</script>
</body>
</html>
