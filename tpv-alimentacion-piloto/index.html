const PILOT_DB='SINCRONIAIA_TPV_PILOTO',PILOT_STORE='state';
let pilotDb=null,pilotReady=false;
function pilotSnapshot(){return {version:1,savedAt:new Date().toISOString(),company,sellers,products,tickets,zReports,sellerMems,customSubsections,orders}}
function openPilotDb(){return new Promise((resolve,reject)=>{if(!('indexedDB' in window))return reject(new Error('IndexedDB no disponible'));let q=indexedDB.open(PILOT_DB,1);q.onupgradeneeded=()=>{if(!q.result.objectStoreNames.contains(PILOT_STORE))q.result.createObjectStore(PILOT_STORE)};q.onsuccess=()=>{pilotDb=q.result;resolve(pilotDb)};q.onerror=()=>reject(q.error)})}
function persistPilotState(){if(!pilotDb)return;try{let tx=pilotDb.transaction(PILOT_STORE,'readwrite');tx.objectStore(PILOT_STORE).put(pilotSnapshot(),'current')}catch(e){console.warn('No se pudo guardar la copia local',e)}}
async function restorePilotState(){try{await openPilotDb();let snapshot=await new Promise((resolve,reject)=>{let tx=pilotDb.transaction(PILOT_STORE,'readonly'),q=tx.objectStore(PILOT_STORE).get('current');q.onsuccess=()=>resolve(q.result);q.onerror=()=>reject(q.error)});if(snapshot){company=snapshot.company||company;sellers=snapshot.sellers||sellers;products=snapshot.products||products;tickets=snapshot.tickets||tickets;zReports=snapshot.zReports||zReports;sellerMems=snapshot.sellerMems||sellerMems;customSubsections=snapshot.customSubsections||customSubsections;orders=snapshot.orders||orders;ensureMems();ensureEnabledSubsections()}pilotReady=true;save()}catch(e){pilotReady=true;console.warn('Funcionando con almacenamiento local básico',e)}render()}
function save(){localStorage.setItem('tpv_pilot_v1_company',JSON.stringify(company));localStorage.setItem('tpv_pilot_v1_sellers',JSON.stringify(sellers));localStorage.setItem('tpv_pilot_v1_products',JSON.stringify(products));localStorage.setItem('tpv_pilot_v1_tickets',JSON.stringify(tickets));localStorage.setItem('tpv_pilot_v1_zReports',JSON.stringify(zReports));localStorage.setItem('tpv_pilot_v1_sellerMems',JSON.stringify(sellerMems));localStorage.setItem('tpv_pilot_v1_customSubsections',JSON.stringify(customSubsections));localStorage.setItem('tpv_pilot_v1_orders',JSON.stringify(orders));persistPilotState()}
function downloadText(filename,text,type='application/json'){let blob=new Blob([text],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=filename;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function csvCell(v){let s=String(v??'');return /[;"\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s}
function csvDownload(filename,rows){downloadText(filename,'\ufeff'+rows.map(r=>r.map(csvCell).join(';')).join('\r\n'),'text/csv;charset=utf-8')}
function exportProductsCsv(){let rows=[['Código','Artículo','Familia','Subsecciones','Letras','Precio','Unidad','Activo','Oferta']];products.slice().sort((a,b)=>a.code.localeCompare(b.code)).forEach(p=>rows.push([p.code,p.name,areaLabel(p.area),productSubs(p).join(' | '),productLetters(p).join(' | '),Number(p.price).toFixed(2),p.unit,p.active!==false?'Sí':'No',offerText(p)]));csvDownload('SINCRONIAIA_articulos.csv',rows)}
function exportTicketsCsv(){let rows=[['Ticket','Fecha','Vendedor','Pago','Código','Artículo','Cantidad','Unidad','Precio','Importe','Descuento ticket','Total ticket','Rectifica']];tickets.slice().reverse().forEach(t=>(t.items||[]).forEach(l=>rows.push([t.number,t.date,t.seller,t.method,l.code,l.name,l.qty,l.unit,l.price,l.total,t.automaticDiscount||0,t.total,t.rectifies||''])));csvDownload('SINCRONIAIA_tickets.csv',rows)}

function importPilotBackup(input){let file=input.files&&input.files[0];if(!file)return;let reader=new FileReader();reader.onload=()=>{try{let d=JSON.parse(reader.result);if(!d.company||!Array.isArray(d.products)||!Array.isArray(d.tickets))throw new Error('Formato no válido');if(!confirm('La copia sustituirá los datos locales actuales de este piloto. ¿Continuar?'))return;company=d.company;sellers=Array.isArray(d.sellers)?d.sellers:sellers;products=d.products;tickets=d.tickets;zReports=Array.isArray(d.zReports)?d.zReports:[];sellerMems=d.sellerMems||{};customSubsections=d.customSubsections||{};orders=Array.isArray(d.orders)?d.orders:[];ensureMems();ensureEnabledSubsections();save();render();alert('Copia restaurada correctamente.')}catch(e){alert('No se ha podido leer esta copia: '+e.message)}};reader.readAsText(file);input.value=''}
function euro(n){return (Number(n)||0).toLocaleString('es-ES',{style:'currency',currency:'EUR'})}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function round(n){return Math.round((Number(n)||0)*100)/100}
function normalSubtotal(lines=cart){return round(lines.reduce((s,l)=>s+(l.normalTotal||0),0))}
function offerDiscount(lines=cart){return round(lines.reduce((s,l)=>s+(l.discount||0),0))}
function subtotalAfterOffers(lines=cart){return round(normalSubtotal(lines)-offerDiscount(lines))}
function ruleDiscount(rule,lines=cart){if(!rule.active)return 0;let now=new Date(),ymd=now.toISOString().slice(0,10);if(rule.from&&ymd<rule.from)return 0;if(rule.to&&ymd>rule.to)return 0;if(rule.days&&rule.days.length&&!rule.days.includes(now.getDay()))return 0;let purchaseBase=subtotalAfterOffers(lines);if(purchaseBase<Number(rule.minPurchase||0))return 0;let base=purchaseBase;if(rule.scope==='section')base=round(lines.filter(l=>{let p=products.find(x=>x.code===l.code);return p&&p.area===rule.target}).reduce((s,l)=>s+(l.total||0),0));return round(base*Number(rule.percent||0)/100)}
function activeAutoDiscount(lines=cart){let options=(company.discountRules||[]).map(r=>({rule:r,amount:ruleDiscount(r,lines)})).filter(x=>x.amount>0).sort((a,b)=>b.amount-a.amount);return options[0]||{rule:null,amount:0}}
function dayDiscount(lines=cart){return activeAutoDiscount(lines).amount}
function totalBeforeManual(lines=cart){return round(subtotalAfterOffers(lines)-dayDiscount(lines))}
function finalTotal(lines=cart){return totalBeforeManual(lines)}
function productSubs(p){return Array.from(new Set((Array.isArray(p.subcats)&&p.subcats.length?p.subcats:[p.subcat||p.cat||'Otros']).filter(Boolean)))}
function hasProductSub(p,s){return productSubs(p).includes(s)}
function firstAccessLetter(name){return String(name||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim().charAt(0).toUpperCase()||'#'}
function productLetters(p){let a=Array.isArray(p.accessLetters)?p.accessLetters:[];return Array.from(new Set((a.length?a:[firstAccessLetter(p.name)]).filter(x=>ACCESS_LETTERS.includes(x))))}
function letterChecks(selected=[],prefix='letter'){let chosen=new Set(selected);return ACCESS_LETTERS.map(l=>`<label><input type="checkbox" data-lettergroup="${prefix}" value="${l}" ${chosen.has(l)?'checked':''}>${l}</label>`).join('')}
function collectLetters(prefix,name){let a=[...document.querySelectorAll(`[data-lettergroup="${prefix}"]:checked`)].map(x=>x.value);return a.length?a:[firstAccessLetter(name)]}
function allSubsForArea(a){const base=SUB_BY_AREA[a]||['Otros'];const custom=customSubsections[a]||[];const created=products.filter(p=>p.area===a).flatMap(productSubs);return Array.from(new Set([...base,...custom,...created])).sort()}

function saleTicketLookupRows(q){q=(q||'').trim().toLowerCase();let list=tickets.filter(t=>{let items=(t.items||[]).map(i=>i.name).join(' '),haystack=`${t.number} ${t.date} ${t.seller} ${t.method} ${t.total} ${Number(t.total).toLocaleString('es-ES')} ${items}`.toLowerCase();return !q||haystack.includes(q)}).slice(0,30);return list.map(t=>`<div class="line"><div><b>Ticket nº ${esc(t.number)}</b><br><small>${esc(t.date)} · ${esc(t.seller)} · ${esc(t.method)} · ${euro(t.total)}</small></div><div><button onclick="openStoredTicket('${t.id}')">Ver / copia</button> <button onclick="beginTicketCorrection('${t.id}')">Rectificar</button></div></div>`).join('')||'<p>No se encontró ningún ticket con esos datos.</p>'}
function refreshSaleTicketLookup(){let q=(document.getElementById('saleTicketQuery')?.value||'').trim();document.getElementById('saleTicketResults').innerHTML=saleTicketLookupRows(q)}
function beginTicketCorrection(id){let t=tickets.find(x=>String(x.id)===String(id));if(!t)return alert('Ticket no encontrado.');if(t.rectifies)return alert('Un ticket rectificativo no se modifica directamente. Abre el ticket original o genera otra rectificación.');modal(`<h2>Rectificar ticket nº ${esc(t.number)}</h2><p class="warn">El original no se borra. Se creará otro ticket por la diferencia y quedará relacionado con este.</p>${t.items.map((l,i)=>`<div class="line"><div><b>${esc(l.name)}</b><br><small>${String(l.qty).replace('.',',')} ${l.unit} × ${euro(l.price)} = ${euro(l.total)}</small></div><button onclick="correctTicketLine('${t.id}',${i})">Corregir línea</button></div>`).join('')}<p><button onclick="openStoredTicket('${t.id}')">Volver</button></p>`)}
function correctTicketLine(id,index){let t=tickets.find(x=>String(x.id)===String(id)),l=t?.items?.[index],active=activeSellers();if(!l)return alert('Línea no encontrada.');modal(`<h2>Corregir · ${esc(l.name)}</h2><p>Importe cobrado: <b>${euro(l.total)}</b></p><div class="grid two"><div><label>${l.unit==='kg'?'Peso correcto (kg)':'Unidades correctas'}</label><input id="correctQty" type="number" step="${l.unit==='kg'?'0.001':'1'}" value="${l.qty}"></div><div><label>Precio correcto por ${l.unit}</label><input id="correctPrice" type="number" step="0.01" value="${l.price}"></div></div><p class="notice">El motivo se calculará automáticamente según cambie el peso, las unidades o el precio.</p><label>Vendedor que realiza la rectificación</label><select id="correctSeller">${active.map(s=>`<option>${esc(s.name)}</option>`).join('')}</select>${active.length?'':'<p class="warn">Antes debes iniciar un vendedor.</p>'}<p><button class="primary" ${active.length?'':'disabled'} onclick="saveTicketCorrection('${t.id}',${index})">Calcular y rectificar</button> <button onclick="beginTicketCorrection('${t.id}')">Cancelar</button></p>`)}
function saveTicketCorrection(id,index){let t=tickets.find(x=>String(x.id)===String(id)),l=t?.items?.[index],qty=Number(correctQty.value),price=Number(correctPrice.value),seller=correctSeller.value;if(!l||qty<0||price<0||!seller)return alert('Revisa el peso, las unidades, el precio y el vendedor.');let qtyChanged=Math.abs(qty-Number(l.qty))>0.000001,priceChanged=Math.abs(price-Number(l.price))>0.000001,reason=qtyChanged&&priceChanged?`${l.unit==='kg'?'Peso':'Cantidad'} y precio incorrectos`:qtyChanged?(l.unit==='kg'?'Peso incorrecto':'Cantidad incorrecta'):priceChanged?'Precio incorrecto':'Importe incorrecto';let corrected=round(qty*price),difference=round(corrected-Number(l.total));if(!difference)return alert('No hay diferencia que rectificar.');if(!confirm(`Se creará una rectificación de ${euro(difference)} sobre el ticket nº ${t.number}. Motivo: ${reason}. ¿Continuar?`))return;let number=String(Math.max(0,...tickets.map(x=>Number(x.number)||0))+1).padStart(4,'0'),now=new Date().toLocaleString('es-ES'),r={id:Date.now(),number,date:now,seller,method:difference<0?'Devolución':'Cobro diferencia',total:difference,cashGiven:null,change:null,automaticDiscount:0,automaticDiscountName:'',offerDiscount:0,rectifies:t.number,correction:{originalDate:t.date,originalSeller:t.seller,reason,oldLine:{name:l.name,qty:l.qty,unit:l.unit,price:l.price,total:l.total},newLine:{name:l.name,qty,unit:l.unit,price,total:corrected},difference},items:[{code:l.code,name:`Rectificación: ${l.name}`,qty:1,unit:'ud',price:difference,normalTotal:difference,total:difference,discount:0,offerLabel:'',time:new Date().toLocaleTimeString('es-ES')}]};t.rectifications=t.rectifications||[];t.rectifications.push(number);tickets.unshift(r);save();modal(receiptHtml(r,true))}
function openPeriodTickets(){let last=zReports[0]?.closedAt||0;return tickets.filter(t=>Number(t.id)>last)}
function reportData(list){let bySeller={},directLines=[];list.forEach(t=>{let n=t.seller||'Sin vendedor';if(!bySeller[n])bySeller[n]={seller:n,count:0,total:0,negativeCount:0,negativeTotal:0,discounts:0};let r=bySeller[n],amount=Number(t.total)||0;r.count++;r.total=round(r.total+amount);if(amount<0){r.negativeCount++;r.negativeTotal=round(r.negativeTotal+amount)}r.discounts=round(r.discounts+Number(t.offerDiscount||0)+Number(t.automaticDiscount||t.dayDiscount||0));(t.items||[]).filter(l=>l.direct).forEach(l=>directLines.push(l))});let rows=Object.values(bySeller),directByArea={};directLines.forEach(l=>{let a=l.area||'Sin sección';directByArea[a]=round((directByArea[a]||0)+Number(l.total||0))});return {tickets:list.length,total:round(list.reduce((s,t)=>s+(Number(t.total)||0),0)),negativeCount:list.filter(t=>Number(t.total)<0).length,negativeTotal:round(list.filter(t=>Number(t.total)<0).reduce((s,t)=>s+Number(t.total),0)),discounts:round(list.reduce((s,t)=>s+Number(t.offerDiscount||0)+Number(t.automaticDiscount||t.dayDiscount||0),0)),directCount:directLines.length,directTotal:round(directLines.reduce((s,l)=>s+Number(l.total||0),0)),directByArea,rows}}
function reportBlock(data,title,dateText){return `<div class="panel"><h2>${title}</h2><p class="muted">${esc(dateText)}</p><div class="totals"><div><span>Tickets</span><b>${data.tickets}</b></div><div><span>Ventas directas</span><b>${data.directCount||0} · ${euro(data.directTotal||0)}</b></div>${Object.entries(data.directByArea||{}).map(([a,v])=>`<div><span>Directa · ${areaLabel(a)}</span><b>${euro(v)}</b></div>`).join('')}<div><span>Ventas negativas</span><b>${data.negativeCount} · ${euro(data.negativeTotal)}</b></div><div><span>Descuentos realizados</span><b>${euro(data.discounts)}</b></div><div class="final"><span>VENTA TOTAL</span><b>${euro(data.total)}</b></div></div><div class="tableWrap"><table><thead><tr><th>Vendedor</th><th>Tickets</th><th>Venta</th><th>Negativas</th><th>Descuentos</th></tr></thead><tbody>${data.rows.map(r=>`<tr><td>${esc(r.seller)}</td><td>${r.count}</td><td>${euro(r.total)}</td><td>${r.negativeCount} · ${euro(r.negativeTotal)}</td><td>${euro(r.discounts)}</td></tr>`).join('')||'<tr><td colspan="5">Sin ventas registradas en este periodo.</td></tr>'}</tbody></table></div></div>`}
function cashExpectedFrom(list){return round(list.filter(t=>t.method==='Efectivo'||t.method==='Devolución').reduce((a,t)=>a+Number(t.total||0),0))}
function reportsHtml(){let list=openPeriodTickets(),data=reportData(list),since=zReports[0]?new Date(zReports[0].closedAt).toLocaleString('es-ES'):'Inicio de registros',expected=cashExpectedFrom(list);return `<div id="cashReport">${reportBlock(data,'Informe X · Consulta de caja','Periodo abierto desde: '+since)}</div>${company.cashMode==='shared'?`<div class="panel"><h2>Cuadre de caja compartida</h2><p>Efectivo esperado por movimientos registrados: <b>${euro(expected)}</b></p><label>Efectivo contado en el cajón</label><input id="sharedCashCount" type="number" inputmode="decimal" step="0.01"><button onclick="showSharedCashDifference(${expected})">Calcular diferencia</button><h3 id="sharedCashDifference"></h3><p class="warn">La diferencia corresponde al cajón compartido. No se asigna automáticamente a ningún vendedor.</p></div>`:''}<div class="panel"><div class="grid two"><button onclick="window.print()">Imprimir X</button><button class="danger" ${!list.length?'disabled':''} onclick="closeZReport()">HACER Z · CERRAR PERIODO</button></div><p class="warn"><b>X:</b> consulta sin cerrar. <b>Z:</b> guarda el cierre definitivo del periodo; no elimina los tickets.</p></div><div class="panel"><h2>Histórico de cierres Z</h2>${zReports.map((z,i)=>`<div class="line"><div><b>Z nº ${z.number}</b><br><small>${esc(z.date)} · ${z.data.tickets} tickets · ${euro(z.data.total)}</small></div><button onclick="showZReport(${i})">Ver Z</button></div>`).join('')||'<p>No se ha realizado ningún cierre Z.</p>'}</div>`}
function showSharedCashDifference(expected){let counted=Number(sharedCashCount.value)||0,d=round(counted-expected);sharedCashDifference.textContent=`Diferencia de caja compartida: ${euro(d)}`;sharedCashDifference.style.color=d===0?'green':'#c62828'}
function closeZReport(){let list=openPeriodTickets();if(!list.length)return alert('No hay ventas nuevas para cerrar.');if(!confirm('La Z cerrará el periodo actual. ¿Continuar?'))return;let z={number:String(zReports.length+1).padStart(4,'0'),closedAt:Date.now(),date:new Date().toLocaleString('es-ES'),data:reportData(list)};zReports.unshift(z);save();render();alert('Cierre Z guardado. Se ha iniciado un nuevo periodo de caja.')}
function showZReport(i){let z=zReports[i];if(!z)return;modal(`${reportBlock(z.data,'Informe Z nº '+z.number,'Cierre: '+z.date)}<button class="primary" onclick="window.print()">Imprimir Z</button> <button onclick="closeModal()">Cerrar</button>`)}
function changeCodeModal(){modal(`<h2>Cambiar código Empresa</h2><label>Código actual</label><input id="oldCode" type="password"><label>Nuevo código</label><input id="newCode1" type="password"><label>Repetir nuevo código</label><input id="newCode2" type="password"><p><button class="primary" onclick="saveNewCode()">Guardar</button> <button onclick="closeModal()">Cancelar</button></p>`)}

function subsectionsHtml(){return `<div class="panel"><h2>Subsecciones que quiere la Empresa en el TPV</h2><div class="grid three"><div><label>Familia</label><select id="newSubArea">${PRODUCT_AREAS.map(a=>`<option>${a}</option>`).join('')}</select></div><div><label>Nueva subsección</label><input id="newSubName" placeholder="Ej: Potro, Cabrito, Ternera Blanca"></div><div><label>&nbsp;</label><button class="brand" onclick="createSubsection()">Crear y activar</button></div></div><p class="notice">Solo las marcadas aparecen en Venta Mostrador.</p></div><div class="panel">${PRODUCT_AREAS.map(a=>`<h3>${a}</h3><div class="grid three">${allSubsForArea(a).map(s=>`<label class="locked"><input type="checkbox" ${isSubEnabled(a,s)?'checked':''} onchange="setSubEnabled('${a}','${esc(s)}',this.checked)"> ${esc(s)}</label>`).join('')}</div>`).join('')}</div>`}
function createSubsection(){let a=newSubArea.value,n=newSubName.value.trim();if(!n)return alert('Indica el nombre de la subsección.');customSubsections[a]=customSubsections[a]||[];if(!customSubsections[a].includes(n))customSubsections[a].push(n);company.enabledSubsections[a]=company.enabledSubsections[a]||[];if(!company.enabledSubsections[a].includes(n))company.enabledSubsections[a].push(n);save();area=a;subcat=n;render()}

 if(area==='A–Z'&&subcat)return `<div class="grid two"><button onclick="backToFamily()">← Letras A–Z</button><button onclick="backToRoot()">Menú principal</button></div><h2>Letra ${esc(subcat)}${azScope?' · '+areaLabel(azScope):''}</h2><div class="products" id="plist">${filtered.map(productButton).join('')||'<p>No hay artículos en esta letra.</p>'}</div>`;
 if(!subcat)return `<div class="grid compactNav"><button onclick="backToRoot()">← MENÚ</button><button class="brand" onclick="openAlphabetic('${area}')">ARTÍCULOS A–Z</button></div><h2>${areaLabel(area)}</h2>${['Carne','Charcutería'].includes(area)?`<button class="directSale" onclick="directSaleModal('${area}')">VENTA DIRECTA · PESO Y PRECIO</button>`:''}<div class="submenu">${subcatsForArea(area).map(s=>`<button onclick="setSub('${esc(s)}')">${esc(s)}</button>`).join('')}</div>`;

function productsHtml(){return `<div class="panel"><h2>Crear producto</h2><p class="notice"><b>Un código = un artículo.</b> Las subsecciones y las letras son solo atajos; nunca crean copias.</p><div class="grid three"><div><label>Código</label><input id="pcode" placeholder="000145"></div><div><label>Nombre</label><input id="pname"></div><div><label>Familia</label><select id="parea" onchange="renderSubChecks('parea','pSubChoices','pSub',[])">${PRODUCT_AREAS.map(a=>`<option>${a}</option>`).join('')}</select></div><div><label>Otra subsección nueva</label><input id="psubcatOther" placeholder="Solo si no está en la lista"></div><div><label>Tipo venta</label><select id="punit"><option value="kg">Por peso / €/kg</option><option value="ud">Por unidades / €/unidad</option></select></div><div><label>Precio normal</label><input id="pprice" type="number" step="0.01"></div><div><label>Oferta</label><select id="poffer"><option value="none">Sin oferta</option><option value="unit_pack">Unidades: X uds por Y €</option><option value="weight_tier">Peso: desde X kg a Y €/kg</option></select></div><div><label>Cantidad tramo</label><input id="offerQty" type="number" step="0.001"></div><div><label>Precio oferta</label><input id="offerPrice" type="number" step="0.01"></div></div><h3>Subsecciones donde aparece</h3><div id="pSubChoices" class="grid three">${subCheckboxes('Carne',['Pollo'],'pSub')}</div><h3>Letras donde aparece</h3><div class="letterChecks">${letterChecks([],'pLetter')}</div><p class="muted">Si no marcas ninguna, se utilizará automáticamente la primera letra del nombre.</p><p><button class="brand" onclick="addProduct()">Guardar producto</button></p></div><div class="panel"><h2>Listado de artículos</h2><div class="grid three"><div><label>Familia / sección</label><select id="listArea" onchange="refreshAdminSubFilter()"><option value="Todos">Todas</option>${PRODUCT_AREAS.map(a=>`<option value="${a}">${areaLabel(a)}</option>`).join('')}</select></div><div><label>Subsección</label><select id="listSub" onchange="filterAdminProducts()"><option value="Todos">Todas</option></select></div><div><label>Código o nombre</label><input id="listQuery" placeholder="Ej: 78 o hamburguesa" oninput="filterAdminProducts()"></div></div><p id="listCount" class="muted"></p><div class="tableWrap"><table><thead><tr><th>Código</th><th>Artículo</th><th>Familia</th><th>Subsecciones</th><th>Letras</th><th>Precio</th><th>Venta</th><th>Oferta</th><th>Estado</th><th>Acción</th></tr></thead><tbody id="adminProductBody">${adminProductRows(products)}</tbody></table></div></div>`}

function loginSeller(){let s=sellers.find(x=>x.code===sellerCodeLogin.value.trim()&&x.pin===sellerPinLogin.value);if(!s)return alert('Código o PIN incorrecto.');s.active=true;if(!s.loginAt)s.loginAt=Date.now();ensureMems();save();closeModal();render()}
function logoutSellerModal(){modal(`<h2>Terminar sesión vendedor</h2>${sellers.map(s=>`<div class="line"><div><b>${esc(s.name)}</b><br><small>${s.active?'Activo':'No iniciado'} · memoria: ${(sellerMems[s.name]||[]).length} líneas</small></div><button ${!s.active?'disabled':''} onclick="logoutSeller('${esc(s.name)}')">Terminar sesión</button></div>`).join('')}<p><button onclick="closeModal()">Cerrar</button></p>`)}
function logoutSeller(name){let s=findSellerByName(name);if(!s)return;if((sellerMems[name]||[]).length>0&&!confirm('Este vendedor tiene una venta pendiente. ¿Terminar sesión igualmente?'))return;s.active=false;s.loginAt=null;save();closeModal();render()}
function filteredProducts(){if(area==='A–Z')return products.filter(p=>p.active!==false&&(!azScope||p.area===azScope)&&subcat&&productLetters(p).includes(subcat)).sort((a,b)=>a.name.localeCompare(b.name,'es'));return products.filter(p=>p.active!==false&&p.area===area&&(subcat==='Todos'||hasProductSub(p,subcat)))}
function productButton(p){return `<button class="prod" onclick="selectProduct('${p.code}')"><b>${esc(p.name)}</b><small>${esc(p.code)} · ${productSubs(p).map(esc).join(', ')} · ${euro(p.price)} / ${p.unit}${p.offer&&p.offer.enabled?' · OFERTA':''}</small></button>`}
function searchProducts(q){q=q.toLowerCase();plist.innerHTML=products.filter(p=>p.active!==false&&p.area===area&&hasProductSub(p,subcat)&&(p.name+' '+p.code).toLowerCase().includes(q)).map(productButton).join('')}
function priceModal(){modal(`<h2>Consulta de precios</h2><input placeholder="Buscar precio..." oninput="priceList.innerHTML=priceRows(this.value)"><div id="priceList">${priceRows('')}</div><p><button onclick="closeModal()">Cerrar</button></p>`)}
function priceRows(q){q=(q||'').toLowerCase();return products.filter(p=>p.active!==false&&(p.name+' '+p.code+' '+p.area+' '+productSubs(p).join(' ')).toLowerCase().includes(q)).slice(0,80).map(p=>`<div class="line"><div><b>${esc(p.name)}</b><br><small>${esc(p.area)} · ${productSubs(p).map(esc).join(', ')} · Código ${esc(p.code)}</small></div><b>${euro(p.price)} / ${p.unit}</b></div>`).join('')||'<p>No encontrado.</p>'}
function nextOrderNumber(){return String(Math.max(0,...orders.map(o=>Number(String(o.number).replace(/\D/g,''))||0))+1).padStart(4,'0')}
function ordersModal(){let sorted=[...orders].sort((a,b)=>(a.pickupDate+' '+a.pickupTime).localeCompare(b.pickupDate+' '+b.pickupTime));modal(`<h2>Encargos</h2><div class="grid two"><button class="primary" onclick="newOrderModal()">NUEVO ENCARGO</button><input id="orderQuery" placeholder="Buscar nombre, teléfono, fecha o número" oninput="refreshOrderList()"></div><div id="orderList">${orderRows(sorted)}</div><p><button onclick="closeModal()">Cerrar</button></p>`)}
function orderRows(list){return list.map(o=>`<div class="line"><div><b>${esc(o.number)} · ${esc(o.customer)}</b><br><small>${esc(o.pickupDate)} ${esc(o.pickupTime||'')} · ${esc(o.phone||'Sin teléfono')} · ${esc(o.status)}</small></div><button onclick="openOrder('${o.id}')">Abrir</button></div>`).join('')||'<p>No hay encargos.</p>'}
function refreshOrderList(){let q=(orderQuery.value||'').toLowerCase(),list=orders.filter(o=>(`${o.number} ${o.customer} ${o.phone} ${o.pickupDate} ${o.status}`).toLowerCase().includes(q));orderList.innerHTML=orderRows(list)}
function newOrderModal(){let active=activeSellers();modal(`<h2>Nuevo encargo</h2><div class="grid two"><div><label>Nombre clienta/cliente</label><input id="orderCustomer"></div><div><label>Teléfono</label><input id="orderPhone" inputmode="tel"></div><div><label>Fecha recogida</label><input id="orderDate" type="date"></div><div><label>Hora aproximada</label><input id="orderTime" type="time"></div></div><label>Descripción y preparación solicitada</label><textarea id="orderNotes" rows="3" placeholder="Ej: bandeja de embutido para 6 personas; cortar fino"></textarea><label>Vendedor que recoge el encargo</label><select id="orderSeller">${active.map(s=>`<option>${esc(s.name)}</option>`).join('')}</select>${active.length?'':'<p class="warn">Debes iniciar un vendedor antes de registrar el encargo.</p>'}<p><button class="primary" ${active.length?'':'disabled'} onclick="createOrder()">Guardar encargo</button> <button onclick="ordersModal()">Cancelar</button></p>`)}
function createOrder(){let customer=orderCustomer.value.trim(),pickupDate=orderDate.value,seller=orderSeller.value;if(!customer||!pickupDate||!seller)return alert('Indica cliente, fecha de recogida y vendedor.');let n=nextOrderNumber(),o={id:Date.now(),number:'E-'+n,preticketNumber:'PT-'+n,customer,phone:orderPhone.value.trim(),pickupDate,pickupTime:orderTime.value,notes:orderNotes.value.trim(),createdAt:new Date().toLocaleString('es-ES'),createdBy:seller,status:'Pendiente de preparar',items:[],ticketNumber:null};orders.unshift(o);save();openOrder(o.id)}
function openOrder(id){let o=orders.find(x=>String(x.id)===String(id));if(!o)return alert('Encargo no encontrado.');let total=round(o.items.reduce((s,l)=>s+Number(l.total||0),0));modal(`<h2>${esc(o.number)} · ${esc(o.customer)}</h2><p><b>Recogida:</b> ${esc(o.pickupDate)} ${esc(o.pickupTime||'')}<br><b>Teléfono:</b> ${esc(o.phone||'—')}<br><b>Vendedor:</b> ${esc(o.createdBy)}<br><b>Estado:</b> ${esc(o.status)}<br><b>Preparación:</b> ${esc(o.notes||'—')}</p>${o.items.map((l,i)=>`<div class="line"><div><b>${esc(l.name)}</b><br><small>${ticketQty(l)} × ${euro(l.price)}/${l.unit}</small></div><div><b>${euro(l.total)}</b>${o.status!=='Entregado'?` <button class="danger" onclick="removeOrderLine('${o.id}',${i})">Quitar</button>`:''}</div></div>`).join('')||'<p class="notice">Todavía no se han pesado ni añadido artículos.</p>'}<h2>Total preparado: ${euro(total)}</h2>${o.status==='Entregado'?`<p class="notice">Venta finalizada · Ticket nº ${esc(o.ticketNumber)}</p><button onclick="openStoredTicket('${o.ticketId}')">Ver ticket</button>`:`<div class="grid two"><button onclick="orderAddProduct('${o.id}')">AÑADIR / PESAR ARTÍCULO</button><button ${!o.items.length?'disabled':''} onclick="makePreticket('${o.id}')">GENERAR PRETICKET</button><button ${o.status!=='Preparado'?'disabled':''} class="primary" onclick="chargeOrder('${o.id}')">COBRAR Y GENERAR VENTA</button><button onclick="printPreticket('${o.id}')">Ver preticket</button></div>`}<p><button onclick="ordersModal()">Volver a encargos</button></p>`)}
function orderAddProduct(id){modal(`<h2>Añadir artículo al encargo</h2><label>Código del artículo</label><input id="orderProductCode" inputmode="numeric" autofocus placeholder="Ej: 000001"><p><button class="primary" onclick="findOrderProduct('${id}')">Buscar</button> <button onclick="openOrder('${id}')">Cancelar</button></p>`);setTimeout(()=>document.getElementById('orderProductCode')?.focus(),50)}
function findOrderProduct(id){let raw=normalizeProductCode(orderProductCode.value),p=products.find(x=>x.active!==false&&x.code===raw);if(!p)return alert('No existe ese artículo.');modal(`<h2>${esc(p.name)}</h2><p>${euro(p.price)} / ${p.unit}</p><label>${p.unit==='kg'?'Peso real preparado (kg)':'Unidades preparadas'}</label><input id="orderQty" type="number" inputmode="decimal" step="${p.unit==='kg'?'0.001':'1'}" autofocus><p><button class="primary" onclick="saveOrderProduct('${id}','${p.code}')">Guardar peso/unidades</button> <button onclick="openOrder('${id}')">Cancelar</button></p>`);setTimeout(()=>document.getElementById('orderQty')?.focus(),50)}
function saveOrderProduct(id,code){let o=orders.find(x=>String(x.id)===String(id)),p=products.find(x=>x.code===code),qty=Number(orderQty.value);if(!o||!p||qty<=0)return alert('Peso o cantidad no válido.');let c=calcLine(p,qty);o.items.push({code:p.code,name:p.name,qty,unit:p.unit,price:p.price,normalTotal:c.normal,total:c.total,discount:c.disc,offerLabel:c.label,offerPrice:c.appliedPrice,time:new Date().toLocaleTimeString('es-ES')});o.status='En preparación';save();openOrder(o.id)}
function removeOrderLine(id,index){let o=orders.find(x=>String(x.id)===String(id));if(!o)return;o.items.splice(index,1);o.status=o.items.length?'En preparación':'Pendiente de preparar';save();openOrder(o.id)}
function makePreticket(id){let o=orders.find(x=>String(x.id)===String(id));if(!o||!o.items.length)return;o.status='Preparado';o.preparedAt=new Date().toLocaleString('es-ES');save();printPreticket(o.id)}
function preticketHtml(o){let total=round(o.items.reduce((s,l)=>s+Number(l.total||0),0));return `<div id="printTicket"><h2>PRETICKET ${esc(o.preticketNumber)}</h2><p><b>NO ES UNA VENTA · PENDIENTE DE COBRO</b><br>Encargo: ${esc(o.number)}<br>Cliente: ${esc(o.customer)}<br>Recogida: ${esc(o.pickupDate)} ${esc(o.pickupTime||'')}<br>Preparado: ${esc(o.preparedAt||'Pendiente')}</p>${o.items.map(receiptLineHtml).join('')}<div class="totals"><div class="final"><span>TOTAL PREPARADO</span><b>${euro(total)}</b></div></div></div>`}
function printPreticket(id){let o=orders.find(x=>String(x.id)===String(id));if(!o)return;modal(`${preticketHtml(o)}<button class="primary" onclick="window.print()">Imprimir preticket</button> <button onclick="openOrder('${o.id}')">Volver</button>`)}
function chargeOrder(id){let o=orders.find(x=>String(x.id)===String(id)),active=activeSellers();if(!o||o.status!=='Preparado')return alert('Primero debes generar el preticket.');modal(`<h2>Cobrar ${esc(o.number)}</h2><p>Selecciona el vendedor que entrega y cobra el encargo.</p><div class="sellerKeys">${active.map(s=>`<button class="brand" onclick="orderPayment('${o.id}','${esc(s.name)}')">${esc(s.name)}</button>`).join('')}</div>${active.length?'':'<p class="warn">No hay vendedores iniciados.</p>'}<p><button onclick="openOrder('${o.id}')">Cancelar</button></p>`)}
function orderPayment(id,seller){let o=orders.find(x=>String(x.id)===String(id)),total=round(o.items.reduce((s,l)=>s+Number(l.total||0),0));modal(`<h2>Cobrar preticket ${esc(o.preticketNumber)}</h2><h2>Total: ${euro(total)}</h2><div class="grid two"><button class="primary" onclick="orderCash('${o.id}','${esc(seller)}')">Efectivo</button><button onclick="finishOrderPay('${o.id}','${esc(seller)}','Tarjeta')">Tarjeta</button><button onclick="finishOrderPay('${o.id}','${esc(seller)}','Bizum')">Bizum</button></div><p><button onclick="chargeOrder('${o.id}')">Volver</button></p>`)}
function orderCash(id,seller){let o=orders.find(x=>String(x.id)===String(id)),total=round(o.items.reduce((s,l)=>s+Number(l.total||0),0));modal(`<h2>Pago efectivo · ${esc(o.number)}</h2><h2>Total: ${euro(total)}</h2><label>Entrega cliente</label><input id="orderCashGiven" type="number" inputmode="decimal" step="0.01" oninput="orderChange.textContent=euro((Number(this.value)||0)-${total})"><h2>Devolución: <span id="orderChange">${euro(0)}</span></h2><button class="primary" onclick="finishOrderPay('${o.id}','${esc(seller)}','Efectivo',Number(orderCashGiven.value)||0)">Finalizar venta</button> <button onclick="orderPayment('${o.id}','${esc(seller)}')">Volver</button>`)}
function finishOrderPay(id,seller,method,cashGiven=0){let o=orders.find(x=>String(x.id)===String(id));if(!o||o.status!=='Preparado')return alert('El encargo ya no está pendiente de cobro.');let total=round(o.items.reduce((s,l)=>s+Number(l.total||0),0));if(method==='Efectivo'&&cashGiven<total)return alert('El importe entregado es insuficiente.');let number=String(Math.max(0,...tickets.map(x=>Number(x.number)||0))+1).padStart(4,'0'),t={id:Date.now(),number,date:new Date().toLocaleString('es-ES'),seller,method,total,cashGiven:cashGiven||null,change:method==='Efectivo'?round(cashGiven-total):null,automaticDiscount:0,automaticDiscountName:'',offerDiscount:offerDiscount(o.items),orderNumber:o.number,preticketNumber:o.preticketNumber,items:JSON.parse(JSON.stringify(o.items))};tickets.unshift(t);o.status='Entregado';o.ticketNumber=number;o.ticketId=t.id;o.deliveredAt=t.date;o.deliveredBy=seller;save();modal(receiptHtml(t));render()}
function quickCodeModal(){modal(`<h2>Venta rápida por código</h2><p class="muted">Introduce el código del producto y pulsa Enter.</p><label>Código</label><input id="quickCode" inputmode="numeric" autofocus placeholder="000070" onkeydown="if(event.key==='Enter')findQuickCode()"><p><button class="primary" onclick="findQuickCode()">Aceptar</button> <button onclick="closeModal()">Cancelar</button></p>`);setTimeout(()=>document.getElementById('quickCode')?.focus(),50)}
function findQuickCode(){let raw=normalizeProductCode(document.getElementById('quickCode')?.value||'');let p=products.find(x=>x.active!==false&&x.code===raw);if(!p)return alert('No existe un producto activo con ese código.');selectProduct(p.code)}
function selectProduct(code){if(!hasActiveSeller())return alert('Debe iniciar al menos un vendedor antes de vender.');let p=products.find(x=>x.code===code);if(!p)return;p.unit==='kg'?weightModal(p):unitModal(p)}
function weightModal(p){modal(`<h2>${esc(p.name)}</h2><div class="visor"><div class="visorTop"><span>VENTA POR PESO</span><span>ENTRADA MANUAL</span></div><div class="visorProduct">${esc(p.name)}</div><div class="visorNumbers"><div><small>PESO NETO</small><b id="visorQty">0,000 kg</b></div><div><small>PRECIO</small><b>${euro(p.price)}/kg</b></div><div><small>IMPORTE</small><b id="importPreview">${euro(0)}</b></div></div></div><label>Peso introducido (kg)</label><input id="qmanual" type="number" inputmode="decimal" step="0.001" placeholder="0.780" oninput="previewWeight('${p.code}')" onkeydown="if(event.key==='Enter'){event.preventDefault();prepareLine('${p.code}',netWeight())}"><p><button id="tareButton" onclick="toggleProductTare('${p.code}')"><b>T · TARA</b></button></p><div id="tarePanel" class="notice" hidden><label>Tara del envase (kg)</label><input id="tareManual" type="number" inputmode="decimal" min="0" step="0.001" placeholder="0.000" oninput="previewWeight('${p.code}')"><small>Se descontará únicamente en esta línea.</small></div><p class="notice">El peso se considera neto por defecto. Pulsa T · TARA solo si has introducido un peso con envase.</p><p><button class="primary" onclick="prepareLine('${p.code}',netWeight())">Elegir vendedor</button> <button onclick="closeModal()">Cancelar</button></p>`);setTimeout(()=>document.getElementById('qmanual')?.focus(),50)}
function unitModal(p){modal(`<h2>${esc(p.name)}</h2><div class="visor"><div class="visorTop"><span>VISOR CLIENTE · LÍNEA ACTUAL</span><span>UNIDADES</span></div><div class="visorProduct">${esc(p.name)}</div><div class="visorNumbers"><div><small>CANTIDAD</small><b id="visorQty">0 ud</b></div><div><small>PRECIO</small><b>${euro(p.price)}/ud</b></div><div><small>IMPORTE</small><b id="importPreview">${euro(0)}</b></div></div></div><label>Unidades</label><input id="qmanual" type="number" inputmode="numeric" step="1" placeholder="2" oninput="previewImport('${p.code}')" onkeydown="if(event.key==='Enter'){event.preventDefault();prepareLine('${p.code}',Number(qmanual.value))}"><p><button class="primary" onclick="prepareLine('${p.code}',Number(qmanual.value))">Elegir vendedor</button> <button onclick="closeModal()">Cancelar</button></p>`);setTimeout(()=>document.getElementById('qmanual')?.focus(),50)}
function toggleProductTare(code){let panel=document.getElementById('tarePanel'),input=document.getElementById('tareManual'),button=document.getElementById('tareButton');if(!panel||!input)return;panel.hidden=!panel.hidden;if(panel.hidden){input.value='';button?.classList.remove('brand');document.getElementById('qmanual')?.focus()}else{button?.classList.add('brand');input.focus()}previewWeight(code)}
function netWeight(){return Math.max(0,(Number(document.getElementById('qmanual')?.value)||0)-(Number(document.getElementById('tareManual')?.value)||0))}
function previewWeight(code){let q=netWeight();visorQty.textContent=q.toFixed(3).replace('.',',')+' kg';let p=products.find(x=>x.code===code);if(p)importPreview.textContent=euro(calcLine(p,q).total)}
function previewImport(code){let p=products.find(x=>x.code===code),q=Number(qmanual.value)||0;if(!p)return;let c=calcLine(p,q);importPreview.textContent=euro(c.total);if(document.getElementById('visorQty'))visorQty.textContent=String(q).replace('.',',')+' ud'}
function calcLine(p,qty){let normal=round(qty*p.price),total=normal,disc=0,label='',appliedPrice=p.price;let of=p.offer||{};if(of.enabled&&of.type==='unit_pack'&&p.unit==='ud'&&of.qty>0&&of.packPrice>0){let packs=Math.floor(qty/of.qty),rest=qty%of.qty;total=round(packs*of.packPrice+rest*p.price);disc=round(normal-total);label=disc>0?`${of.qty} uds por ${euro(of.packPrice)}`:''}if(of.enabled&&of.type==='weight_tier'&&p.unit==='kg'&&of.minQty>0&&of.specialPrice>0&&qty>=of.minQty){appliedPrice=of.specialPrice;total=round(qty*appliedPrice);disc=round(normal-total);label=disc>0?`Desde ${of.minQty} kg a ${euro(appliedPrice)}/kg`:''}return {normal,total,disc,label,appliedPrice}}
function prepareLine(code,qty){let p=products.find(x=>x.code===code);if(!p||!qty||qty<=0)return alert('Cantidad o peso no válido.');let c=calcLine(p,qty);pendingLine={code:p.code,name:p.name,qty,unit:p.unit,price:p.price,normalTotal:c.normal,total:c.total,discount:c.disc,offerLabel:c.label,offerPrice:c.appliedPrice,time:new Date().toLocaleTimeString('es-ES')};selectSellerForLine()}
function directSaleModal(section){if(!hasActiveSeller())return alert('Debe iniciar al menos un vendedor antes de vender.');area=section;modal(`<h2>Venta directa · ${areaLabel(section)}</h2><p class="notice">Para un producto que no está dado de alta. Introduce manualmente el peso y el precio por kilo.</p><div class="visor"><div class="visorTop"><span>VENTA DIRECTA</span><span>${areaLabel(section)}</span></div><div class="visorProduct">Producto sin código</div><div class="visorNumbers"><div><small>PESO NETO</small><b id="directWeightOut">0,000 kg</b></div><div><small>PRECIO / KG</small><b id="directPriceOut">${euro(0)}</b></div><div><small>IMPORTE</small><b id="directTotalOut">${euro(0)}</b></div></div></div><div class="grid two"><div><label>Peso introducido (kg)</label><input id="directWeight" type="number" inputmode="decimal" min="0" step="0.001" placeholder="0.450" oninput="previewDirectSale()"></div><div><label>Precio por kg</label><input id="directPrice" type="number" inputmode="decimal" min="0" step="0.01" placeholder="18.00" oninput="previewDirectSale()" onkeydown="if(event.key==='Enter'){event.preventDefault();prepareDirectSale('${section}')}"></div></div><p><button id="directTareButton" onclick="toggleDirectTare()"><b>T · TARA</b></button></p><div id="directTarePanel" class="notice" hidden><label>Tara del envase (kg)</label><input id="directTare" type="number" inputmode="decimal" min="0" step="0.001" placeholder="0.000" oninput="previewDirectSale()"><small>Se descontará únicamente en esta línea.</small></div><p class="warn">No crea un artículo nuevo ni aplica ofertas de artículo. Los descuentos generales configurados por la Empresa sí se mantienen.</p><p><button class="primary" onclick="prepareDirectSale('${section}')">Elegir vendedor</button> <button onclick="closeModal()">Cancelar</button></p>`);setTimeout(()=>document.getElementById('directWeight')?.focus(),50)}
function toggleDirectTare(){let panel=document.getElementById('directTarePanel'),input=document.getElementById('directTare'),button=document.getElementById('directTareButton');if(!panel||!input)return;panel.hidden=!panel.hidden;if(panel.hidden){input.value='';button?.classList.remove('brand');document.getElementById('directWeight')?.focus()}else{button?.classList.add('brand');input.focus()}previewDirectSale()}
function directNetWeight(){return Math.max(0,(Number(document.getElementById('directWeight')?.value)||0)-(Number(document.getElementById('directTare')?.value)||0))}
function previewDirectSale(){let weight=directNetWeight(),price=Number(document.getElementById('directPrice')?.value)||0;directWeightOut.textContent=weight.toFixed(3).replace('.',',')+' kg';directPriceOut.textContent=euro(price);directTotalOut.textContent=euro(round(weight*price))}
function prepareDirectSale(section){let qty=directNetWeight(),price=Number(document.getElementById('directPrice')?.value)||0;if(qty<=0||price<=0)return alert('Indica un peso neto y un precio por kilo válidos.');let total=round(qty*price);pendingLine={code:'DIRECT-'+section.toUpperCase().replace('Í','I'),name:'Venta directa · '+areaLabel(section),qty,unit:'kg',price,normalTotal:total,total,discount:0,offerLabel:'',offerPrice:price,time:new Date().toLocaleTimeString('es-ES'),direct:true,area:section};selectSellerForLine()}
function selectSellerForLine(){modal(`<h2>Validar con vendedor</h2><div class="visor"><div class="visorProduct">${esc(pendingLine.name)}</div><div class="visorNumbers"><div><small>${pendingLine.unit==='kg'?'PESO':'UNIDADES'}</small><b>${String(pendingLine.qty).replace('.',',')} ${pendingLine.unit}</b></div><div><small>PRECIO</small><b>${euro(pendingLine.price)}</b></div><div><small>IMPORTE LÍNEA</small><b>${euro(pendingLine.total)}</b></div></div></div><p class="flowhint">Pulsa tu vendedor. La línea se guarda y vuelve al menú.</p><div class="sellerKeys">${sellers.map(s=>`<button ${!s.active?'disabled':''} class="${s.active?'brand':''}" onclick="saveLineToSeller('${esc(s.name)}')">${esc(s.name)}<br><small>${s.active?'ACTIVO':'NO INICIADO'}</small></button>`).join('')}</div><p><button onclick="closeModal()">Cancelar</button></p>`)}
function saveLineToSeller(name){let s=findSellerByName(name);if(!s||!s.active)return alert('Este vendedor no tiene sesión iniciada.');sellerMems[name]=sellerMems[name]||[];sellerMems[name].push({...pendingLine,seller:name});pendingLine=null;save();closeModal();atRoot=true;render();flash('Artículo guardado en '+name)}
function flash(msg){let n=document.createElement('div');n.className='flash';n.textContent=msg;document.body.appendChild(n);setTimeout(()=>n.remove(),1300)}
function myActivityModal(){let active=activeSellers();modal(`<h2>Mi actividad</h2><p class="muted">Selecciona tu vendedor e introduce tu PIN. Solo verás tus propias ventas.</p>${active.map(s=>`<div class="line"><div><b>${esc(s.name)}</b><br><small>Sesión activa</small></div><button onclick="myActivityPin('${esc(s.name)}')">Entrar</button></div>`).join('')||'<p>No hay vendedores iniciados.</p>'}<p><button onclick="closeModal()">Cerrar</button></p>`)}
function myActivityPin(name){modal(`<h2>${esc(name)} · Mi actividad</h2><label>PIN vendedor</label><input id="activityPin" type="password" inputmode="numeric" autofocus onkeydown="if(event.key==='Enter')openMyActivity('${esc(name)}')"><p><button class="primary" onclick="openMyActivity('${esc(name)}')">Ver mi actividad</button> <button onclick="myActivityModal()">Volver</button></p>`);setTimeout(()=>document.getElementById('activityPin')?.focus(),50)}
function sellerActivityData(name){let s=findSellerByName(name),today=new Date();today.setHours(0,0,0,0);let since=Math.max(Number(s?.loginAt)||0,today.getTime()),list=tickets.filter(t=>t.seller===name&&Number(t.id)>=since),sum=m=>round(list.filter(t=>t.method===m).reduce((a,t)=>a+Number(t.total||0),0));return {since,list,count:list.length,total:round(list.reduce((a,t)=>a+Number(t.total||0),0)),cash:sum('Efectivo'),card:sum('Tarjeta'),bizum:sum('Bizum'),mixed:sum('Mixto'),returns:round(list.filter(t=>Number(t.total)<0).reduce((a,t)=>a+Number(t.total||0),0))}}
function openMyActivity(name){let s=findSellerByName(name),pin=document.getElementById('activityPin')?.value;if(!s||!s.active||pin!==s.pin)return alert('PIN incorrecto o sesión no iniciada.');let d=sellerActivityData(name),individual=company.cashMode==='individual';modal(`<div id="personalX"><h2>Mi actividad · ${esc(name)}</h2><p class="muted">Desde ${new Date(d.since).toLocaleString('es-ES')}</p><div class="totals"><div><span>Tickets</span><b>${d.count}</b></div><div><span>Efectivo</span><b>${euro(d.cash)}</b></div><div><span>Tarjeta</span><b>${euro(d.card)}</b></div><div><span>Bizum</span><b>${euro(d.bizum)}</b></div><div><span>Mixto</span><b>${euro(d.mixed)}</b></div><div><span>Devoluciones / rectificaciones</span><b>${euro(d.returns)}</b></div><div class="final"><span>VENTA NETA PERSONAL</span><b>${euro(d.total)}</b></div></div>${company.cashMode==='shared'?'<p class="warn"><b>Caja compartida:</b> estos datos identifican ventas registradas, pero cualquier diferencia de efectivo pertenece al cajón común.</p>':individual?`<div class="panel"><h3>Cuadre individual</h3><p>Efectivo esperado por ventas: <b>${euro(d.cash+d.returns)}</b></p><label>Efectivo contado</label><input id="personalCashCount" type="number" step="0.01"><button onclick="showPersonalDifference(${d.cash+d.returns})">Calcular diferencia</button><h3 id="personalCashDifference"></h3></div>`:'<p class="notice">Configuración mixta: el responsable debe indicar si este vendedor utiliza cajón propio o compartido.</p>'}<h3>Tickets del periodo</h3>${d.list.map(t=>`<div class="line"><div><b>Nº ${esc(t.number)}</b><br><small>${esc(t.date)} · ${esc(t.method)}</small></div><b>${euro(t.total)}</b></div>`).join('')||'<p>Sin ventas cerradas en esta sesión.</p>'}</div><p><button class="primary" onclick="window.print()">Imprimir X personal</button> <button onclick="closeModal()">Cerrar</button></p>`)}
function showPersonalDifference(expected){let counted=Number(personalCashCount.value)||0,d=round(counted-expected);personalCashDifference.textContent=`Diferencia: ${euro(d)}`;personalCashDifference.style.color=d===0?'green':'#c62828'}
function summaryModal(){modal(`<h2>Estado vendedores</h2>${sellers.map(s=>`<div class="line"><div><b>${esc(s.name)}</b><br><small>${s.active?'Activo':'No iniciado'} · ${(sellerMems[s.name]||[]).length?'Venta abierta':'Sin venta'}</small></div><span>${s.active?'●':'○'}</span></div>`).join('')}<p class="warn">El importe acumulado permanece oculto hasta SUBTOTAL / COBRAR.</p><p><button onclick="closeModal()">Cerrar</button></p>`)}
function closeSaleModal(){modal(`<h2>¿Qué vendedor consulta el subtotal?</h2>${sellers.map(s=>`<div class="line"><div><b>${esc(s.name)}</b><br><small>${s.active?'Activo':'No iniciado'} · ${(sellerMems[s.name]||[]).length?'Venta pendiente':'Sin venta'}</small></div><button ${!s.active||!(sellerMems[s.name]||[]).length?'disabled':''} onclick="openSellerTicket('${esc(s.name)}')">Ver subtotal</button></div>`).join('')}<p class="warn">Consultar el subtotal no cierra ni borra la venta.</p><p><button onclick="closeModal()">Cancelar</button></p>`)}
function openSellerTicket(name){let s=findSellerByName(name);if(!s||!s.active)return alert('Este vendedor debe iniciar sesión para cobrar.');cart=[...(sellerMems[name]||[])];selectedCloseSeller=name;showTicket()}
function showTicket(){modal(`<h2>Subtotal · ${esc(selectedCloseSeller)}</h2>${cart.length?cart.map((l,i)=>`<div class="line"><div><b>${esc(l.name)}</b><br><small>${String(l.qty).replace('.',',')} ${l.unit} × ${euro(l.price)} = ${euro(l.total)}</small>${l.discount>0?`<br><small>Oferta: -${euro(l.discount)}</small>`:''}</div><button class="danger" onclick="cart.splice(${i},1);sellerMems[selectedCloseSeller]=cart;save();showTicket()">Quitar</button></div>`).join(''):'<p>No hay líneas.</p>'}<h2>Total provisional: ${euro(totalBeforeManual(cart))}</h2><div class="grid two"><button class="brand" onclick="continueSelling()">SEGUIR VENDIENDO</button><button class="primary" onclick="subtotalModal()">COBRAR / CERRAR VENTA</button></div><p class="notice">Seguir vendiendo conserva todos los artículos en la memoria de ${esc(selectedCloseSeller)}.</p>`)}
function continueSelling(){sellerMems[selectedCloseSeller]=cart;save();closeModal();atRoot=true;subcat='';render()}
function subtotalModal(){if(!cart.length)return alert('No hay nada que cobrar');modalSubtotal()}
function totalsHtml(lines){let auto=activeAutoDiscount(lines);return `<div class="totals"><div><span>Subtotal normal</span><b>${euro(normalSubtotal(lines))}</b></div>${offerDiscount(lines)>0?`<div><span>Ofertas artículos</span><b>-${euro(offerDiscount(lines))}</b></div>`:''}<div><span>Subtotal</span><b>${euro(subtotalAfterOffers(lines))}</b></div>${auto.amount>0?`<div><span>${esc(auto.rule.name)} ${auto.rule.percent}%</span><b>-${euro(auto.amount)}</b></div>`:''}<div class="final"><span>TOTAL</span><b>${euro(finalTotal(lines))}</b></div></div>`}
function modalSubtotal(){modal(`<h2>Cerrar venta · ${esc(selectedCloseSeller)}</h2>${totalsHtml(cart)}<p class="notice">Los descuentos aplicables ya han sido calculados según la configuración de Empresa.</p><div class="grid two"><button class="primary" onclick="paymentModal()">ELEGIR FORMA DE PAGO</button><button onclick="showTicket()">Volver al subtotal</button></div>`)}
function paymentModal(){modal(`<h2>Forma de pago · ${esc(selectedCloseSeller)}</h2>${totalsHtml(cart)}<div class="grid two"><button class="primary" onclick="cashModal()">Efectivo</button><button onclick="finishPay('Tarjeta')">Tarjeta</button><button onclick="finishPay('Bizum')">Bizum</button><button onclick="finishPay('Mixto')">Mixto</button></div><p><button onclick="modalSubtotal()">Volver</button></p>`)}
function cashModal(){modal(`<h2>Pago efectivo</h2>${totalsHtml(cart)}<label>Entrega cliente</label><input id="cashGiven" type="number" inputmode="decimal" step="0.01" oninput="updateChange()"><h2>Devolución: <span id="changeOut">${euro(0)}</span></h2><button class="primary" onclick="finishPay('Efectivo',Number(cashGiven.value)||0)">Finalizar ticket</button> <button onclick="paymentModal()">Volver</button>`)}
function updateChange(){let d=(Number(cashGiven.value)||0)-finalTotal(cart);changeOut.textContent=d<0?'Faltan '+euro(Math.abs(d)):euro(d)}
function finishPay(method,cashGiven=0){let s=findSellerByName(selectedCloseSeller);if(!s||!s.active)return alert('El vendedor debe estar iniciado para finalizar su venta.');if(method==='Efectivo'&&cashGiven<finalTotal(cart))return alert('El importe entregado es insuficiente.');let auto=activeAutoDiscount(cart),number=String(Math.max(0,...tickets.map(x=>Number(x.number)||0))+1).padStart(4,'0');let t={id:Date.now(),number,date:new Date().toLocaleString('es-ES'),seller:selectedCloseSeller,method,total:finalTotal(cart),cashGiven:cashGiven||null,change:method==='Efectivo'?round(cashGiven-finalTotal(cart)):null,automaticDiscount:auto.amount,automaticDiscountName:auto.rule?.name||'',offerDiscount:offerDiscount(cart),items:JSON.parse(JSON.stringify(cart))};tickets.unshift(t);sellerMems[selectedCloseSeller]=[];cart=[];save();modal(receiptHtml(t));render()}
function ticketQty(l){return l.unit==='kg'?Number(l.qty).toFixed(3).replace('.',',')+' kg':String(l.qty).replace('.',',')+' ud'}
function receiptLineHtml(l){let q=ticketQty(l),normal=Number(l.normalTotal??l.qty*l.price),total=Number(l.total)||0,discount=Number(l.discount)||0;if(discount>0&&l.unit==='kg'){let offerPrice=Number(l.offerPrice)||(Number(l.qty)>0?total/Number(l.qty):0);return `<div class="line"><div><b>${esc(l.name)}</b><br><small>${q} × ${euro(l.price)}/kg = ${euro(normal)}</small><br><small><b>OFERTA: ${q} × ${euro(offerPrice)}/kg = ${euro(total)}</b></small><br><small>Ahorro: -${euro(discount)}</small><br><b>IMPORTE COBRADO: ${euro(total)}</b></div><b>${euro(total)}</b></div>`}if(discount>0)return `<div class="line"><div><b>${esc(l.name)}</b><br><small>${q} × ${euro(l.price)}/${l.unit} = ${euro(normal)}</small><br><small><b>OFERTA: ${esc(l.offerLabel||'Oferta aplicada')} = ${euro(total)}</b></small><br><small>Ahorro: -${euro(discount)}</small><br><b>IMPORTE COBRADO: ${euro(total)}</b></div><b>${euro(total)}</b></div>`;return `<div class="line"><div><b>${esc(l.name)}</b><br><small>${q} × ${euro(l.price)}/${l.unit} = ${euro(total)}</small></div><b>${euro(total)}</b></div>`}
function receiptHtml(t,reprint=false){if(t.rectifies&&t.correction)return correctionReceiptHtml(t,reprint);return `<div id="printTicket"><h2>Ticket nº ${t.number}${reprint?' · COPIA':''}</h2><p><b>${esc(company.name)}</b><br>${esc(t.date)}<br>Vendedor: ${esc(t.seller)}${t.orderNumber?`<br>Encargo: ${esc(t.orderNumber)} · Preticket: ${esc(t.preticketNumber)}`:''}${t.rectifications?.length?`<br><b>Rectificaciones: ${t.rectifications.map(esc).join(', ')}</b>`:''}</p>${t.items.map(receiptLineHtml).join('')}<div class="totals">${t.automaticDiscount>0?`<div><span>${esc(t.automaticDiscountName)}</span><b>-${euro(t.automaticDiscount)}</b></div>`:''}<div class="final"><span>TOTAL</span><b>${euro(t.total)}</b></div></div><p><b>Pago:</b> ${esc(t.method)}</p>${t.method==='Efectivo'?`<p><b>Entregado:</b> ${euro(t.cashGiven)}<br><b>Devolución:</b> ${euro(t.change)}</p>`:''}<p><b>Gracias por su compra</b></p></div><button class="primary" onclick="window.print()">${reprint?'Reimprimir copia':'Imprimir ticket'}</button> <button onclick="beginTicketCorrection('${t.id}')">Rectificar</button> <button onclick="closeModal();render()">${reprint?'Cerrar':'Cerrar y nueva venta'}</button>`}
function correctionReason(c){let o=c.oldLine,n=c.newLine,qtyChanged=Math.abs(Number(n.qty)-Number(o.qty))>0.000001,priceChanged=Math.abs(Number(n.price)-Number(o.price))>0.000001;return qtyChanged&&priceChanged?`${o.unit==='kg'?'Peso':'Cantidad'} y precio incorrectos`:qtyChanged?(o.unit==='kg'?'Peso incorrecto':'Cantidad incorrecta'):priceChanged?'Precio incorrecto':c.reason||'Importe incorrecto'}
function correctionReceiptHtml(t,reprint){let c=t.correction,o=c.oldLine,n=c.newLine,reason=correctionReason(c);return `<div id="printTicket"><h2>TICKET RECTIFICATIVO Nº R-${esc(t.number)}</h2><p><b>${esc(company.name)}</b><br>Modificación del ticket nº ${esc(t.rectifies)}<br>Fecha ticket original: ${esc(c.originalDate)}<br>Fecha modificación: ${esc(t.date)}<br>Vendedor original: ${esc(c.originalSeller)}<br>Rectificación realizada por: ${esc(t.seller)}<br>Motivo: ${esc(reason)}</p><div class="line"><div><b>COBRADO · ${esc(o.name)}</b><br><small>${String(o.qty).replace('.',',')} ${o.unit} × ${euro(o.price)}</small></div><b>${euro(o.total)}</b></div><div class="line"><div><b>CORRECTO · ${esc(n.name)}</b><br><small>${String(n.qty).replace('.',',')} ${n.unit} × ${euro(n.price)}</small></div><b>${euro(n.total)}</b></div><div class="totals"><div class="final"><span>DIFERENCIA TOTAL</span><b>${euro(c.difference)}</b></div><div class="final"><span>${c.difference<0?'A DEVOLVER':'A COBRAR'}</span><b>${euro(Math.abs(c.difference))}</b></div></div></div><button class="primary" onclick="window.print()">${reprint?'Reimprimir copia':'Imprimir rectificación'}</button> <button onclick="closeModal();render()">Cerrar</button>`}
function offerText(p){if(!p.offer||!p.offer.enabled)return 'No';if(p.offer.type==='unit_pack')return `${p.offer.qty} uds por ${euro(p.offer.packPrice)}`;if(p.offer.type==='weight_tier')return `Desde ${p.offer.minQty} kg a ${euro(p.offer.specialPrice)}/kg`;return 'No'}
function buildOffer(){let type=poffer.value;if(type==='none')return {enabled:false,type:'none'};if(type==='unit_pack')return {enabled:true,type:'unit_pack',qty:Number(offerQty.value)||0,packPrice:Number(offerPrice.value)||0};return {enabled:true,type:'weight_tier',minQty:Number(offerQty.value)||0,specialPrice:Number(offerPrice.value)||0}}
function addProduct(){if(!pname.value||!pprice.value)return alert('Falta nombre o precio');let code=normalizeProductCode(pcode.value);if(!code)return alert('Indica el código del artículo.');if(products.some(x=>x.code===code))return alert('Ya existe otro producto con ese código.');let subs=collectProductSubs('pSub','psubcatOther','parea');if(!subs.length)return alert('Selecciona al menos una subsección.');let name=pname.value.trim();products.push({code,name,area:parea.value,cat:subs[0],subcat:subs[0],subcats:subs,accessLetters:collectLetters('pLetter',name),price:Number(pprice.value),unit:punit.value,active:true,offer:buildOffer()});save();render()}
function editProduct(code){let p=products.find(x=>x.code===code);if(!p)return;let of=p.offer||{enabled:false,type:'none'};modal(`<h2>Editar producto</h2><p class="notice"><b>Ficha única.</b> Subsecciones y letras son atajos hacia el mismo código, precio y venta.</p><div class="grid three"><div><label>Código</label><input id="editCode" value="${esc(p.code)}"></div><div><label>Nombre</label><input id="editName" value="${esc(p.name)}"></div><div><label>Familia</label><select id="editArea" onchange="renderSubChecks('editArea','editSubChoices','editSubGroup',[])">${PRODUCT_AREAS.map(a=>`<option ${a===p.area?'selected':''}>${a}</option>`).join('')}</select></div><div><label>Otra subsección nueva</label><input id="editSubOther" placeholder="Ej: Ternera Gallega"></div><div><label>Tipo venta</label><select id="editUnit"><option value="kg" ${p.unit==='kg'?'selected':''}>Por peso / €/kg</option><option value="ud" ${p.unit==='ud'?'selected':''}>Por unidades / €/unidad</option></select></div><div><label>Precio</label><input id="editPrice" type="number" step="0.01" value="${p.price}"></div><div><label>Oferta</label><select id="editOffer"><option value="none" ${!of.enabled?'selected':''}>Sin oferta</option><option value="unit_pack" ${of.type==='unit_pack'?'selected':''}>Unidades</option><option value="weight_tier" ${of.type==='weight_tier'?'selected':''}>Peso</option></select></div><div><label>Cantidad tramo</label><input id="editOfferQty" type="number" step="0.001" value="${of.qty||of.minQty||''}"></div><div><label>Precio oferta</label><input id="editOfferPrice" type="number" step="0.01" value="${of.packPrice||of.specialPrice||''}"></div><div><label>Estado</label><select id="editActive"><option value="true" ${p.active!==false?'selected':''}>Activo</option><option value="false" ${p.active===false?'selected':''}>Inactivo</option></select></div></div><h3>Subsecciones donde aparece</h3><div id="editSubChoices" class="grid three">${subCheckboxes(p.area,productSubs(p),'editSubGroup')}</div><h3>Letras donde aparece</h3><div class="letterChecks">${letterChecks(productLetters(p),'editLetter')}</div><p><button class="primary" onclick="saveEditProduct('${p.code}')">Guardar cambios</button> <button onclick="closeModal()">Cancelar</button></p>`)}
function saveEditProduct(originalCode){let p=products.find(x=>x.code===originalCode);if(!p)return;let newCode=normalizeProductCode(editCode.value)||p.code;if(products.find(x=>x.code===newCode&&x!==p))return alert('Ya existe otro producto con ese código.');let subs=collectProductSubs('editSubGroup','editSubOther','editArea');if(!subs.length)return alert('Selecciona al menos una subsección.');p.code=newCode;p.name=editName.value.trim()||p.name;p.area=editArea.value;p.subcats=subs;p.subcat=subs[0];p.cat=subs[0];p.accessLetters=collectLetters('editLetter',p.name);p.price=Number(editPrice.value)||0;p.unit=editUnit.value;p.active=editActive.value==='true';p.offer=editOffer.value==='none'?{enabled:false,type:'none'}:(editOffer.value==='unit_pack'?{enabled:true,type:'unit_pack',qty:Number(editOfferQty.value)||0,packPrice:Number(editOfferPrice.value)||0}:{enabled:true,type:'weight_tier',minQty:Number(editOfferQty.value)||0,specialPrice:Number(editOfferPrice.value)||0});save();closeModal();render()}
function modal(content){document.getElementById('modalBox').innerHTML=content;document.getElementById('modal').style.display='flex'}
function closeModal(){document.getElementById('modal').style.display='none'}
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js').catch(e=>console.warn('Modo sin conexión no disponible',e)));
restorePilotState();
</script>
</body>
</html>
