<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SINCRONIAIA · Investigación de Campo · LAB 6 bloques</title><style>*{box-sizing:border-box}body{margin:0;background:#071327;color:#f8fafc;font-family:Arial,sans-serif}.wrap{max-width:860px;margin:auto;padding:16px}.hero,.card{background:#111f34;border:1px solid #2f4664;border-radius:18px;padding:20px;margin:14px 0}.hero b{color:#38bdf8}.lab{padding:12px;border:1px solid #f59e0b66;background:#78350f33;border-radius:12px;color:#fde68a}.progress{height:8px;background:#1e293b;border-radius:99px;overflow:hidden;margin:18px 0}.progress span{display:block;height:100%;background:#0ea5e9;width:16.6%}.q{margin:16px 0}.q label{display:block;font-weight:700;margin-bottom:8px}.q input,.q textarea,.q select{width:100%;padding:12px;border-radius:10px;border:1px solid #38506f;background:#08152a;color:#fff;font-size:16px}.q textarea{min-height:90px}.actions{display:flex;gap:10px}.actions button{flex:1;padding:13px;border-radius:10px;font-weight:800}.primary{background:#0ea5e9;color:#fff;border:0}.secondary{background:#18283e;color:#fff;border:1px solid #405774}.hidden{display:none}.check{display:grid;gap:8px}.check label{background:#0b172a;border:1px solid #334155;border-radius:10px;padding:10px}.muted{color:#94a3b8}.item{background:#0b172a;border:1px solid #334155;border-radius:10px;padding:10px;margin:8px 0}@media(max-width:600px){.actions{display:grid}}</style></head><body><div class="wrap"><section class="hero"><b>SINCRONIAIA · LAB AISLADA</b><h1>Investigación de Campo · 6 bloques</h1><p>Comparativa visual del cuestionario reorganizado. No modifica la Investigación de Campo actual.</p></section><div class="lab"><strong>LAB aislada.</strong> No guarda ni envía datos. Solo sirve para comparar el flujo.</div><div class="progress"><span id="bar"></span></div><section class="card" id="block"></section><div class="actions"><button class="secondary" id="prev">← Anterior</button><button class="primary" id="next">Siguiente →</button></div></div><script>const B=[['Conocer el negocio','Entender contexto, tamaño y funcionamiento',[['t','¿Cuánto tiempo lleva funcionando el negocio?'],['a','Cuénteme cómo es un día normal en su negocio.'],['t','¿Cuántas personas trabajan actualmente?'],['a','¿Cuál es su papel dentro del negocio?'],['a','¿Cómo llegan actualmente nuevos clientes a su negocio?']]],['Dependencia del propietario','Detectar qué depende demasiado de una sola persona',[['a','¿Qué tareas dependen exclusivamente de usted?'],['a','Si usted no viniera mañana, ¿qué cosas quedarían pendientes o podrían bloquearse?'],['a','¿Hay información o conocimientos importantes que solo usted o una persona concreta domina?'],['a','¿Qué ocurre en el negocio cuando usted se ausenta?']]],['Tiempo y tareas repetitivas','Detectar duplicaciones y tareas que consumen tiempo',[['a','Si pudiera eliminar una tarea de su día a día, ¿cuál sería?'],['a','¿Qué tareas suele ir dejando para más adelante por falta de tiempo?'],['a','¿Qué es lo que más le frustra o le hace perder tiempo actualmente?'],['s','¿Hay información que tenga que escribir, copiar o introducir más de una vez?',['No','A veces','Sí, semanalmente','Sí, casi a diario','Sí, varias veces al día']],['a','¿Qué tareas repite casi todos los días y le gustaría simplificar?']]],['Pedidos, clientes y errores','Entender pendientes, fallos y su impacto',[['a','¿Cómo gestionan avisos, encargos, reservas, citas o trabajos pendientes?'],['a','¿Qué errores u olvidos se repiten con más frecuencia?'],['s','Cuando aparece un problema, ¿con qué frecuencia suele ocurrir?',['Casi nunca','Mensualmente','Semanalmente','Varios días por semana','Todos los días']],['c','¿Qué consecuencia tiene normalmente?',['Pérdida de tiempo','Error interno','Cliente molesto','Pérdida de venta','Dinero perdido','Estrés o interrupciones']]]],['Trabajo fuera de horario','Medir cuánto invade el negocio el tiempo personal',[['s','¿Recibe consultas, mensajes o solicitudes fuera del horario de trabajo?',['Nunca','Alguna vez','Varias veces por semana','Casi todos los días','Todos los días']],['s','¿Sigue haciendo tareas del negocio cuando llega a casa?',['No','Algún día','Varias veces por semana','Casi todos los días','Todos los días']],['t','¿Cuántos días trabaja normalmente a la semana?'],['t','¿Cuántas horas dedica aproximadamente al negocio?'],['a','¿Cuánto tiempo libre real tiene durante la semana?'],['a','Si recuperara dos horas a la semana, ¿en qué le gustaría utilizarlas?']]],['Prioridad y futuro','Saber qué merece resolverse primero',[['a','¿Qué le gustaría que hubiera cambiado en su negocio dentro de un año?'],['a','Si mañana pudiera solucionar un solo problema del negocio, ¿cuál elegiría?'],['s','¿Cómo considera de urgente ese problema?',['Bajo','Medio','Alto','Muy alto','Crítico']],['a','¿Hay algo importante que no le haya preguntado y crea que debería saber sobre su negocio?']]]];let i=0,A={};const b=document.getElementById('block'),bar=document.getElementById('bar'),p=document.getElementById('prev'),n=document.getElementById('next');function k(q){return i+'-'+q}function qhtml(q,j){let [t,l,o]=q,id=k(j);if(t==='a')return `<div class=q><label>${l}</label><textarea id='${id}'></textarea></div>`;if(t==='s')return `<div class=q><label>${l}</label><select id='${id}'><option value=''>Seleccione…</option>${o.map(x=>`<option>${x}</option>`).join('')}</select></div>`;if(t==='c')return `<div class=q><label>${l}</label><div class=check>${o.map(x=>`<label><input type=checkbox data-id='${id}' value='${x}'> ${x}</label>`).join('')}</div></div>`;return `<div class=q><label>${l}</label><input id='${id}'></div>`}function save(){B[i][2].forEach((q,j)=>{let id=k(j);if(q[0]==='c')A[id]=[...document.querySelectorAll(`[data-id='${id}']:checked`)].map(x=>x.value);else A[id]=document.getElementById(id)?.value||''})}function load(){B[i][2].forEach((q,j)=>{let id=k(j);if(q[0]==='c')(A[id]||[]).forEach(v=>{let x=[...document.querySelectorAll(`[data-id='${id}']`)].find(e=>e.value===v);if(x)x.checked=true});else if(document.getElementById(id))document.getElementById(id).value=A[id]||''})}function render(){let x=B[i];bar.style.width=((i+1)/6*100)+'%';b.innerHTML=`<div class=muted>Bloque ${i+1} de 6</div><h2>${x[0]}</h2><p class=muted>${x[1]}</p>`+x[2].map(qhtml).join('');p.disabled=i===0;n.textContent=i===5?'Ver resumen':'Siguiente →';load()}function summary(){save();let h='<h2>Resumen LAB</h2><p class=muted>No se guarda ni se envía nada.</p>';B.forEach((x,bi)=>x[2].forEach((q,j)=>{let v=A[bi+'-'+j];if(Array.isArray(v)?v.length:String(v||'').trim())h+=`<div class=item><strong>${q[1]}</strong><div>${Array.isArray(v)?v.join(', '):v}</div></div>`}));b.innerHTML=h;n.classList.add('hidden');p.disabled=false;p.textContent='← Volver'}p.onclick=()=>{if(n.classList.contains('hidden')){n.classList.remove('hidden');p.textContent='← Anterior';render();return}save();if(i>0){i--;render()}};n.onclick=()=>{save();if(i<5){i++;render()}else summary()};render();</script></body></html>
