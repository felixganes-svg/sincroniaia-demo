<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#00a884">
<title>SINCRONIAIA — Todo Bueno Els Molins · BASE ESTABLE v1.1</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
:root{
  --green:#00a884;--paper:#efeae2;--ink:#111b21;--line:#d8dddf;--white:#fff;
  --user:#d9fdd3;--soft:#f0f2f5;--gold:#9a6b31;--navy:#17223d;
  --safe:#fff6dd;--safeLine:#edcb74;--info:#edf5ff;--infoLine:#b9d3ff;
}
html,body{height:100%;background:#0b141a}
body{display:flex;justify-content:center;align-items:flex-start;overflow:hidden;color:var(--ink)}
.app{width:100%;max-width:480px;height:100vh;height:100dvh;height:var(--app-height,100dvh);background:var(--paper);display:flex;flex-direction:column;overflow:hidden}
@media(min-width:500px){.app{height:min(95vh,var(--app-height,95vh));border-radius:18px;box-shadow:0 10px 35px rgba(0,0,0,.45)}}
.header{background:var(--green);color:white;padding:9px 11px;display:flex;align-items:center;gap:10px;box-shadow:0 1px 4px rgba(0,0,0,.2);z-index:5}
.avatar{width:42px;height:42px;border-radius:50%;background:white;color:#0e3e36;display:flex;align-items:center;justify-content:center;font-family:Georgia,serif;font-weight:800;font-size:18px}
.headtxt{flex:1;min-width:0}.headtxt h1{font-size:16px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.headtxt p{font-size:11px;opacity:.95;margin-top:2px}.badge{font-size:9px;font-weight:800;border:1px solid rgba(255,255,255,.7);border-radius:999px;padding:5px 7px;white-space:nowrap;letter-spacing:.5px}
.chat{flex:1;overflow-y:auto;padding:13px 10px 18px;display:flex;flex-direction:column;gap:8px;background:radial-gradient(circle at 1px 1px,rgba(96,110,117,.16) 1px,transparent 0) 0 0/25px 25px,var(--paper);scroll-behavior:smooth}
.day{align-self:center;background:#d9e8ee;color:#4c626b;padding:5px 9px;border-radius:7px;font-size:10px;box-shadow:0 1px 1px rgba(0,0,0,.08)}
.msg{max-width:88%;padding:9px 10px 18px;border-radius:8px;font-size:14.5px;line-height:1.43;position:relative;box-shadow:0 1px 1px rgba(0,0,0,.09);animation:pop .17s ease-out}@keyframes pop{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}.bot{align-self:flex-start;background:#fff;border-top-left-radius:2px}.user{align-self:flex-end;background:var(--user);border-top-right-radius:2px}.time{position:absolute;right:7px;bottom:3px;color:#7b8b91;font-size:9px}.msg strong{font-weight:750}
.options{align-self:stretch;display:flex;flex-wrap:wrap;gap:7px;max-width:100%;margin:2px 0 4px}.chip{display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--green);background:#fff;color:#087967;border-radius:17px;padding:9px 11px;font-size:12.7px;font-weight:700;cursor:pointer;box-shadow:0 1px 2px rgba(0,0,0,.05);min-height:38px;text-align:center;white-space:normal}.chip.gold{border-color:#a37842;color:#825b29}.chip.dark{border-color:#65757c;color:#425057}.chip:active{transform:scale(.97)}
.cartbox{align-self:stretch;background:#fff;border:1px solid #d9dfe1;border-radius:12px;padding:10px 11px;box-shadow:0 1px 2px rgba(0,0,0,.05)}.cartrow{display:flex;align-items:center;gap:9px;padding:9px 0;border-bottom:1px solid #edf0f1}.cartrow:last-child{border-bottom:0}.cartinfo{flex:1;min-width:0}.cartname{font-size:13.5px;font-weight:750;line-height:1.3}.cartqtytxt{font-size:11px;color:#65757c;margin-top:3px}.qtyctl{display:flex;align-items:center;gap:7px;flex:0 0 auto}.qtybtn{width:34px;height:34px;border-radius:50%;border:1px solid var(--green);background:#fff;color:#087967;font-size:20px;font-weight:800;line-height:1;cursor:pointer}.qtynum{min-width:26px;text-align:center;font-size:15px;font-weight:800}.editmini{border:1px solid var(--green);background:#fff;color:#087967;border-radius:15px;padding:7px 10px;font-size:11.5px;font-weight:750;cursor:pointer}.carthelp{font-size:11.5px;color:#52636a;margin:0 0 7px;line-height:1.35}.confirmbar{align-self:stretch;background:#fff6dd;border:1px solid #edcb74;border-radius:11px;padding:10px 11px;font-size:12.5px;line-height:1.4}
.notice{align-self:stretch;border-radius:11px;padding:10px 11px;font-size:12.5px;line-height:1.4}.notice.info{background:var(--info);border:1px solid var(--infoLine);color:#214c78}.notice.safe{background:var(--safe);border:1px solid var(--safeLine);color:#654b16}.notice strong{display:block;margin-bottom:3px}.typing{align-self:flex-start;background:white;padding:9px 11px;border-radius:8px;color:#718188;font-size:12px}.typing i{font-style:normal;letter-spacing:2px}
.bottom{background:var(--soft);border-top:1px solid var(--line);flex:0 0 auto;position:relative;z-index:20}html.keyboard-open .smallnote{display:none}html.keyboard-open .footer{padding-bottom:max(8px,env(safe-area-inset-bottom))}.footer{display:flex;gap:7px;align-items:center;padding:8px 9px calc(9px + env(safe-area-inset-bottom))}.reset{border:0;background:transparent;color:#607078;font-size:20px;padding:7px;cursor:pointer}.input{flex:1;min-width:0;border:1px solid #d8dddf;border-radius:20px;background:#fff!important;color:#111b21!important;-webkit-text-fill-color:#111b21!important;caret-color:#00a884!important;opacity:1!important;padding:11px 13px;font-size:16px;line-height:1.25;outline:none;appearance:none;-webkit-appearance:none}.input::placeholder{color:#667781!important;-webkit-text-fill-color:#667781!important;opacity:1!important}.input:focus{border-color:#00a884;box-shadow:0 0 0 2px rgba(0,168,132,.12)}.send{width:42px;height:42px;border:0;border-radius:50%;background:var(--green);color:white;font-weight:900;font-size:17px;cursor:pointer}.smallnote{text-align:center;font-size:9px;color:#6f7e84;padding:0 9px 6px}@media(max-width:420px){.options .chip{flex:1 1 calc(50% - 7px)}}@media(max-width:360px){.badge{display:none}.msg{font-size:14px}.chip{font-size:12.2px;padding:8px 10px}}
</style>
</head>
<body>
<div class="app"><header class="header"><div class="avatar">TB</div><div class="headtxt"><h1>Todo Bueno · Els Molins</h1><p>asistente en línea · conversación de prueba</p></div><div class="badge">DEMO ARTÍCULOS</div></header><main id="chat" class="chat" aria-live="polite"></main><div class="bottom"><footer class="footer"><button class="reset" title="Reiniciar" onclick="restart()">↻</button><input id="input" class="input" autocomplete="off" placeholder="Escriba un mensaje…" onkeydown="if(event.key==='Enter')sendFree()"><button class="send" onclick="sendFree()" aria-label="Enviar">➤</button></footer><div class="smallnote">BASE ESTABLE SINCRONIAIA · Todo Bueno Els Molins · v1.1 · TECLADO MÓVIL</div></div></div>
<script>
const chat=document.getElementById('chat');const input=document.getElementById('input');const app=document.querySelector('.app');const bottomBar=document.querySelector('.bottom');
function syncVisualViewport(){const vv=window.visualViewport;const h=Math.round(vv?vv.height:window.innerHeight);const layoutH=Math.round(window.innerHeight||h);document.documentElement.style.setProperty('--app-height',h+'px');const keyboardOpen=document.activeElement===input&&h<layoutH-120;document.documentElement.classList.toggle('keyboard-open',keyboardOpen);if(document.activeElement===input){requestAnimationFrame(()=>{chat.scrollTop=chat.scrollHeight;const r=bottomBar.getBoundingClientRect();const visualBottom=(vv?vv.offsetTop+vv.height:window.innerHeight);if(r.bottom>visualBottom+1){window.scrollBy(0,r.bottom-visualBottom+2)}})}}
if(window.visualViewport){visualViewport.addEventListener('resize',syncVisualViewport);visualViewport.addEventListener('scroll',syncVisualViewport)}window.addEventListener('resize',syncVisualViewport);window.addEventListener('orientationchange',()=>setTimeout(syncVisualViewport,120));input.addEventListener('focus',()=>{syncVisualViewport();setTimeout(syncVisualViewport,80);setTimeout(syncVisualViewport,300)});input.addEventListener('blur',()=>setTimeout(syncVisualViewport,80));syncVisualViewport();
let state={step:'menu',branch:null,data:{cart:[]}};
const CATALOG_DEMO={panaderia:[{name:'Hogaza rústica de masa madre',desc:'Ejemplo de pan para probar el recorrido.',mode:'unit'},{name:'Barra artesana',desc:'Ejemplo de producto habitual de panadería.',mode:'unit'},{name:'Pan multicereales y semillas',desc:'Ejemplo de pan especial.',mode:'unit'}],bolleria:[{name:'Croissant de mantequilla',desc:'Ejemplo de bollería para probar cantidades.',mode:'unit'},{name:'Napolitana de chocolate',desc:'Ejemplo de pieza de bollería.',mode:'unit'},{name:'Brioche / suizo',desc:'Ejemplo de pieza individual.',mode:'unit'}],salados:[{name:'Empanadillas artesanales',desc:'Ejemplo de producto salado por unidades.',mode:'unit'},{name:'Hojaldritos salados surtidos',desc:'Ejemplo de surtido.',mode:'weight'}],pasteleria:[{name:'Tarta de queso',desc:'Ejemplo de tarta por tamaño/personas.',mode:'people'},{name:'Pastel de celebración',desc:'Ejemplo configurable.',mode:'people'}]};
function now(){return new Date().toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'})}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function norm(s){return String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')}
function scroll(){requestAnimationFrame(()=>chat.scrollTop=chat.scrollHeight)}function msg(html,cls='bot'){const d=document.createElement('div');d.className='msg '+cls;d.innerHTML=html+'<span class="time">'+now()+'</span>';chat.appendChild(d);scroll();return d}function bot(html,opts){msg(html);if(opts)buttons(opts)}function user(t){msg(esc(t),'user')}function buttons(opts){const d=document.createElement('div');d.className='options';opts.forEach(o=>{const b=document.createElement('button');b.className='chip '+(o.cls||'');b.textContent=o.label;b.onclick=()=>handleAction(o.value,o.label);d.appendChild(b)});chat.appendChild(d);scroll();return d}function notice(type,title,body){const d=document.createElement('div');d.className='notice '+type;d.innerHTML='<strong>'+title+'</strong>'+body;chat.appendChild(d);scroll()}
function restart(){chat.innerHTML='';state={step:'menu',branch:null,data:{cart:[]}};input.placeholder='Escriba un mensaje…';const day=document.createElement('div');day.className='day';day.textContent='HOY';chat.appendChild(day);msg('👋 Hola. Soy el <strong>asistente virtual con inteligencia artificial de Todo Bueno · Els Molins</strong>.<br><br>Esta es una <strong>demostración</strong>: los artículos son ejemplos y no se muestran precios no facilitados por el negocio.');menu()}
function menu(){state.step='menu';buttons([{label:'🥖 Panadería',value:'cat_panaderia'},{label:'🥐 Bollería',value:'cat_bolleria'},{label:'🥟 Salados',value:'cat_salados'},{label:'🎂 Pastelería',value:'cat_pasteleria'},{label:'🕢 Horario',value:'horario'},{label:'✍️ Otra consulta',value:'otra'}])}
function tbMostrarCategoria(cat,title){state.step='categoria';state.data.categoria=cat;const items=CATALOG_DEMO[cat]||[];bot('<strong>'+title+'</strong><br><br>Selecciona un artículo de ejemplo.',items.map((it,i)=>({label:it.name,value:'prod_'+cat+'_'+i})).concat([{label:'🛒 Ver pedido actual',value:'ver_carrito',cls:'gold'},{label:'🏠 Inicio',value:'inicio',cls:'dark'}]))}
function selectProd(v){const m=v.match(/^prod_([^_]+)_(\d+)$/);if(!m)return;const it=(CATALOG_DEMO[m[1]]||[])[+m[2]];if(!it)return;state.data.producto=it;state.data.modoVenta=it.mode;if(it.mode==='unit'){state.step='cantidad_manual';bot('<strong>'+esc(it.name)+'</strong><br>'+esc(it.desc)+'<br><br>¿Cuántas unidades deseas?');input.placeholder='Ej.: 2';input.focus()}else if(it.mode==='weight'){state.step='cantidad_manual';bot('<strong>'+esc(it.name)+'</strong><br>'+esc(it.desc)+'<br><br>Indica el peso.');input.placeholder='Ej.: 500 g';input.focus()}else{state.step='cantidad_manual';bot('<strong>'+esc(it.name)+'</strong><br>'+esc(it.desc)+'<br><br>¿Para cuántas personas?');input.placeholder='Ej.: 8 personas';input.focus()}}
function addCurrent(cant){const p=state.data.producto;if(!p)return;state.data.cart=state.data.cart||[];state.data.cart.push({nombre:p.name,cantidad:cant,mode:p.mode});msg('✅ Añadido: <strong>'+esc(p.name)+'</strong> · '+esc(cant));viewCart()}
function parseQty(q){const n=parseInt(String(q).replace(/\D/g,''),10);return n>0?n:1}function viewCart(){state.step='carrito';const cart=state.data.cart||[];if(!cart.length){bot('Tu pedido está vacío.',[{label:'➕ Añadir productos',value:'anadir'},{label:'🏠 Inicio',value:'inicio',cls:'dark'}]);return}const box=document.createElement('div');box.className='cartbox';box.innerHTML='<div class="carthelp">Modifica las cantidades. Si bajas una unidad hasta 0, pediré confirmación antes de quitarla.</div>';cart.forEach((it,i)=>{const row=document.createElement('div');row.className='cartrow';const info=document.createElement('div');info.className='cartinfo';info.innerHTML='<div class="cartname">'+esc(it.nombre)+'</div><div class="cartqtytxt">'+esc(it.cantidad)+'</div>';row.appendChild(info);if(it.mode==='unit'){const ctl=document.createElement('div');ctl.className='qtyctl';const minus=document.createElement('button');minus.className='qtybtn';minus.textContent='−';minus.onclick=()=>changeQty(i,-1);const num=document.createElement('span');num.className='qtynum';num.textContent=parseQty(it.cantidad);const plus=document.createElement('button');plus.className='qtybtn';plus.textContent='+';plus.onclick=()=>changeQty(i,1);ctl.append(minus,num,plus);row.appendChild(ctl)}else{const edit=document.createElement('button');edit.className='editmini';edit.textContent='Modificar';edit.onclick=()=>editItem(i);row.appendChild(edit)}box.appendChild(row)});chat.appendChild(box);buttons([{label:'➕ Añadir más productos',value:'anadir'},{label:'✅ Continuar pedido',value:'continuar'},{label:'🏠 Inicio',value:'inicio',cls:'dark'}]);scroll()}
function changeQty(i,d){const it=state.data.cart[i];if(!it)return;const n=parseQty(it.cantidad)+d;if(n<=0){const bar=document.createElement('div');bar.className='confirmbar';bar.innerHTML='<strong>¿Quieres quitar '+esc(it.nombre)+' del pedido?</strong>';chat.appendChild(bar);buttons([{label:'Sí, quitar',value:'quitar_'+i},{label:'Cancelar',value:'ver_carrito',cls:'dark'}]);scroll();return}it.cantidad=n+' unidad'+(n===1?'':'es');viewCart()}
function editItem(i){const it=state.data.cart[i];state.data.editIndex=i;state.data.producto={name:it.nombre,mode:it.mode};state.data.modoVenta=it.mode;state.step='cantidad_manual';bot('Indica la nueva cantidad para <strong>'+esc(it.nombre)+'</strong>.');input.placeholder=it.mode==='weight'?'Ej.: 500 g':'Ej.: 8 personas';input.focus()}
function removeIndex(i){if(state.data.cart&&state.data.cart[i]){msg('🗑️ Eliminado: <strong>'+esc(state.data.cart[i].nombre)+'</strong>.');state.data.cart.splice(i,1)}viewCart()}
function askDate(){state.step='fecha_opciones';bot('<strong>¿Para qué día deseas la recogida?</strong>',[{label:'Hoy',value:'hoy'},{label:'Mañana',value:'manana'},{label:'Otra fecha',value:'otra_fecha'},{label:'🏠 Inicio',value:'inicio',cls:'dark'}])}function askHour(){state.step='hora';bot('<strong>¿A qué hora deseas pasar a buscarlo?</strong><br><br>Horario de apertura de agosto: <strong>07:30–13:30</strong>.');input.placeholder='Ej.: 11 o 11:30…';input.focus()}
function summary(){const d=state.data;let h='<strong>📋 RESUMEN DEL PEDIDO</strong><br><br>';d.cart.forEach((it,i)=>h+=(i+1)+'. '+esc(it.nombre)+' · <strong>'+esc(it.cantidad)+'</strong><br>');h+='<br><strong>Recogida:</strong> '+esc(d.fechaRecogida||'')+' · '+esc(d.horaRecogida||'');msg(h);notice('info','CONFIRMACIÓN DE DEMO','Revisa el pedido completo antes de registrar.');state.step='resumen';buttons([{label:'✅ Registrar solicitud',value:'confirmar'},{label:'✏️ Modificar artículos',value:'ver_carrito'},{label:'📅 Cambiar fecha/hora',value:'cambiar_fecha'},{label:'❌ Cancelar',value:'cancelar',cls:'dark'}])}
function handleAction(v,label){user(label);if(v==='inicio')return restart();if(v==='cat_panaderia')return tbMostrarCategoria('panaderia','Panadería Tradicional');if(v==='cat_bolleria')return tbMostrarCategoria('bolleria','Bollería y Masas Fermentadas');if(v==='cat_salados')return tbMostrarCategoria('salados','Especialidades Saladas');if(v==='cat_pasteleria')return tbMostrarCategoria('pasteleria','Repostería y Pastelería');if(v.startsWith('prod_'))return selectProd(v);if(v==='ver_carrito')return viewCart();if(v==='anadir')return menu();if(v==='continuar'){if(!(state.data.cart||[]).length)return bot('Añade al menos un artículo antes de continuar.');return askDate()}if(v.startsWith('quitar_'))return removeIndex(+v.split('_')[1]);if(v==='hoy'){state.data.fechaRecogida='Hoy';return askHour()}if(v==='manana'){state.data.fechaRecogida='Mañana';return askHour()}if(v==='otra_fecha'){state.step='fecha_manual';bot('Indica el día o la fecha que deseas.');input.placeholder='Ej.: viernes, 28 de agosto…';input.focus();return}if(v==='cambiar_fecha')return askDate();if(v==='horario'){msg('<strong>Horario especial de agosto</strong><br><br>🕢 07:30–13:30<br>🌙 Tardes cerrado.');return buttons([{label:'🥖 Ver artículos',value:'cat_panaderia'},{label:'🏠 Inicio',value:'inicio',cls:'dark'}])}if(v==='otra'){state.step='otra';bot('Escribe o dicta tu consulta o el artículo específico que buscas.');input.placeholder='Escribe tu consulta aquí…';input.focus();return}if(v==='cancelar')return restart();if(v==='confirmar'){state.step='nombre';bot('<strong>¿A qué nombre registramos la reserva de demostración?</strong>');input.placeholder='Tu nombre…';input.focus();return}}
function normalizarCantidad(text,mode){const raw=String(text||'').trim();if(!raw)return null;if(mode==='unit'){const n=parseInt(raw.replace(/\D/g,''),10);return n>0?n+' unidad'+(n===1?'':'es'):null}if(mode==='people'){const n=parseInt(raw.replace(/\D/g,''),10);return n>0?n+' personas':null}if(mode==='weight'){const s=raw.toLowerCase().replace(',','.');const m=s.match(/(\d+(?:\.\d+)?)\s*(kg|kilos?|g|gr|gramos?)?/);if(!m)return null;const n=parseFloat(m[1]);if(!(n>0))return null;let u=m[2]||'g';if(u.startsWith('k'))u='kg';else u='g';return String(n).replace('.',',')+' '+u}return raw}
function normalizarHora(v){let s=String(v||'').trim().toLowerCase().replace(/\s*h(?:oras?)?\.?$/,'').replace(/\./g,':').replace(/\s+/g,'');if(/^\d{1,2}$/.test(s)){const h=+s;if(h<=23)return String(h).padStart(2,'0')+':00 h'}if(/^\d{3}$/.test(s)){const h=+s.slice(0,1),m=+s.slice(1);if(m<=59)return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')+' h'}if(/^\d{4}$/.test(s)){const h=+s.slice(0,2),m=+s.slice(2);if(h<=23&&m<=59)return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')+' h'}const m=s.match(/^(\d{1,2}):(\d{1,2})$/);if(m&&+m[1]<=23&&+m[2]<=59)return String(+m[1]).padStart(2,'0')+':'+String(+m[2]).padStart(2,'0')+' h';return null}
function inHours(h){const m=String(h).match(/^(\d{2}):(\d{2})/);if(!m)return false;const n=+m[1]*60 + +m[2];return n>=450&&n<=810}
function registerDemo(){const d=state.data;const id='DEMO-'+Date.now().toString().slice(-6);msg('✅ <strong>Pedido de demostración registrado con éxito.</strong><br><br>Código de seguimiento: <strong>'+id+'</strong>.');notice('safe','MODO PRUEBA','No se ha enviado ningún pedido real a producción.');state.step='final';buttons([{label:'🏠 Volver al inicio',value:'inicio'}])}
function sendFree(){const text=input.value.trim();if(!text)return;input.value='';user(text);if(state.step==='cantidad_manual'){const q=normalizarCantidad(text,state.data.modoVenta);if(!q){bot('No he podido interpretar esa cantidad. Escríbela de nuevo, por favor.');input.focus();return}if(Number.isInteger(state.data.editIndex)){state.data.cart[state.data.editIndex].cantidad=q;delete state.data.editIndex;return viewCart()}return addCurrent(q)}if(state.step==='fecha_manual'){state.data.fechaRecogida=text;return askHour()}if(state.step==='hora'){const h=normalizarHora(text);if(!h){bot('No he podido interpretar esa hora. Prueba con 11, 915 o 11:30.');input.focus();return}if(!inHours(h)){bot('Esa hora queda fuera del horario de recogida configurado: <strong>07:30–13:30</strong>.');input.focus();return}state.data.horaRecogida=h;return summary()}if(state.step==='nombre'){state.data.nombre=text;state.step='telefono';bot('Gracias. <strong>Indica un teléfono de contacto:</strong>');input.placeholder='Teléfono…';input.focus();return}if(state.step==='telefono'){const d=text.replace(/\D/g,'');if(d.length<9||d.length>15){bot('Indica un número de teléfono válido.');input.focus();return}state.data.telefono=text;return registerDemo()}if(state.step==='otra'){msg('He anotado tu consulta: "'+esc(text)+'".');return askDate()}const n=norm(text);if(n.includes('horario'))return handleAction('horario','Horario');if(n.includes('pan'))return tbMostrarCategoria('panaderia','Panadería Tradicional');if(n.includes('croissant')||n.includes('bolleria'))return tbMostrarCategoria('bolleria','Bollería y Masas Fermentadas');msg('He anotado tu consulta: "'+esc(text)+'".');menu()}
restart();
</script>
</body>
</html>
