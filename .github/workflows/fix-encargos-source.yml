name: Fix Encargos source

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/fix-encargos-source.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Modify source exactly
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          enc = Path('tpv-alimentacion-dibal-lab-v1-3-lab-xz-jornada-pinchitos/encargos-libreta-v1.js')
          s = enc.read_text(encoding='utf-8')

          old = '''function closeOrderReceiptToOrders(orderId){
            extraOrderSaleContext=null;
            parkedOrderContext=null;
            closeModal();
            screen='venta';role='venta';area='Carne';subcat='';azScope=null;atRoot=true;
            render();
            ordersModal();
          }
          window.closeOrderReceiptToOrders=closeOrderReceiptToOrders;

          function wireOrderReceiptClose(orderId){
            setTimeout(()=>{
              let box=document.getElementById('modalBox');
              if(!box)return;
              let buttons=[...box.querySelectorAll('button')];
              let closeBtn=buttons.find(b=>/^cerrar/i.test((b.textContent||'').trim()));
              if(!closeBtn)return;
              closeBtn.textContent='CERRAR · VOLVER A ENCARGOS';
              closeBtn.onclick=()=>closeOrderReceiptToOrders(orderId);
            },0);
          }
          '''

          new = '''function closeOrderReceiptToSale(){
            extraOrderSaleContext=null;
            parkedOrderContext=null;
            closeModal();
            screen='venta';role='venta';area='Carne';subcat='';azScope=null;atRoot=true;
            render();
          }
          window.closeOrderReceiptToSale=closeOrderReceiptToSale;

          function closeOrderReceiptToOrders(orderId){
            extraOrderSaleContext=null;
            parkedOrderContext=null;
            closeModal();
            screen='venta';role='venta';area='Carne';subcat='';azScope=null;atRoot=true;
            render();
            ordersModal();
          }
          window.closeOrderReceiptToOrders=closeOrderReceiptToOrders;

          function wireOrderReceiptClose(orderId){
            setTimeout(()=>{
              let box=document.getElementById('modalBox');
              if(!box)return;
              let buttons=[...box.querySelectorAll('button')];
              let closeBtn=buttons.find(b=>/^cerrar/i.test((b.textContent||'').trim()));
              if(!closeBtn)return;
              closeBtn.textContent='CERRAR';
              closeBtn.onclick=()=>closeOrderReceiptToSale();

              let backBtn=buttons.find(b=>(b.textContent||'').trim()==='VOLVER A ENCARGOS');
              if(!backBtn){
                backBtn=document.createElement('button');
                backBtn.textContent='VOLVER A ENCARGOS';
                backBtn.onclick=()=>closeOrderReceiptToOrders(orderId);
                closeBtn.insertAdjacentText('afterend',' ');
                closeBtn.insertAdjacentElement('afterend',backBtn);
              }
            },0);
          }
          '''

          if s.count(old) != 1:
              raise SystemExit(f'BLOCK_MISMATCH: expected 1 exact source block, found {s.count(old)}')
          s = s.replace(old, new, 1)
          enc.write_text(s, encoding='utf-8')

          idx = Path('tpv-alimentacion-lab-verificado-20260908-cerrar/index.html')
          h = idx.read_text(encoding='utf-8')
          old_ref = 'encargos-libreta-v1.js?v=20260909-2341-pendiente-recoger-fix'
          new_ref = 'encargos-libreta-v1.js?v=20260911-2025-cierre-doble-origen'
          if h.count(old_ref) != 1:
              raise SystemExit(f'INDEX_REF_MISMATCH: expected 1 reference, found {h.count(old_ref)}')
          idx.write_text(h.replace(old_ref, new_ref, 1), encoding='utf-8')
          PY
      - name: Verify expected source state
        shell: bash
        run: |
          grep -F "closeBtn.textContent='CERRAR';" tpv-alimentacion-dibal-lab-v1-3-lab-xz-jornada-pinchitos/encargos-libreta-v1.js
          grep -F "backBtn.textContent='VOLVER A ENCARGOS';" tpv-alimentacion-dibal-lab-v1-3-lab-xz-jornada-pinchitos/encargos-libreta-v1.js
          grep -F "encargos-libreta-v1.js?v=20260911-2025-cierre-doble-origen" tpv-alimentacion-lab-verificado-20260908-cerrar/index.html
          ! grep -F "CERRAR · VOLVER A ENCARGOS" tpv-alimentacion-dibal-lab-v1-3-lab-xz-jornada-pinchitos/encargos-libreta-v1.js
      - name: Remove temporary workflow and commit source fix
        shell: bash
        run: |
          git config user.name "SINCRONIAIA source fix"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/fix-encargos-source.yml
          git add tpv-alimentacion-dibal-lab-v1-3-lab-xz-jornada-pinchitos/encargos-libreta-v1.js tpv-alimentacion-lab-verificado-20260908-cerrar/index.html
          git diff --cached --check
          git commit -m "Fix Encargos: cierre con destino Venta o Encargos en origen"
          git push
