name: verifactu backend 1.9

on:
  push:
    paths:
      - 'verifactu-lab-desarrollo/backend/**'
      - '.github/workflows/verifactu-backend-17.yml'
  workflow_dispatch:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: pip install -r verifactu-lab-desarrollo/backend/requirements.txt
      - name: Test backend append-only, states and transport guardrails
        working-directory: verifactu-lab-desarrollo/backend
        run: pytest -q
