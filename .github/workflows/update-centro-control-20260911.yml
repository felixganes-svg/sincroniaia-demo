name: Update Centro Control 20260911
on:
  push:
    paths:
      - '.github/workflows/update-centro-control-20260911.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update Centro de Control exact strings
        shell: python
        run: |
          from pathlib import Path
          p=Path('centro-control/index.html')
          s=p.read_text(encoding='utf-8')
          old_rule='''<div class="rule"><b>Regla maestra:</b> una sola producción oficial por módulo. Antes de crear, buscar. Antes de modificar, localizar la versión real. No se declara HECHO sin verificar acceso publicado, datos, persistencia, restauración de estado y móvil. Después de cada modificación: actualizar este Centro y conservar la versión anterior validada.</div>'''
          new_rule='''<div class="rule"><b>Regla maestra:</b> una sola producción oficial por módulo. <b>Antes de cualquier modificación: consultar el MASTER y la continuidad activa, localizar la función/fuente real y proteger lo ya validado.</b> No se acumulan parches externos si la función puede corregirse en origen. No se declara HECHO sin verificar código publicado, datos, persistencia, restauración de estado y móvil. Después de cada modificación: actualizar este Centro y conservar la versión anterior validada.</div>'''
          old_card='''<div class="card"><div class="row"><div class="name">SINCRONIAIA TPV Alimentación / Carnicería</div><span class="status hold">DESARROLLO ACTIVO</span></div><div class="desc"><b>Estado funcional documentado:</b> venta por Carnicería, Charcutería y Elaborados; vendedores; catálogo y edición; secciones/subsecciones; tickets y cobros; encargos; cobro de encargos; compra adicional; X/Z; caja; rectificaciones; impresión y trabajo móvil/PWA. Las últimas pruebas incluyeron activación/desactivación de vendedor y continuidad del flujo de encargos.</div><div class="meta"><b>Importante:</b> este estado recoge el trabajo hasta 11/09. La última ruta publicada que se puede identificar inequívocamente como validada en el repositorio sigue siendo la del 08/09. No se declara MASTER global.</div><a class="btn" target="_blank" rel="noopener" href="../tpv-alimentacion-lab-visible-20260908/?v=20260908-1620-price-close">Abrir última publicación validada 08/09</a><a class="btn alt" target="_blank" rel="noopener" href="../tpv-alimentacion-dibal-lab-v1-3-lab-xz-jornada-pinchitos/">Abrir LAB de trabajo localizada</a></div>'''
          new_card='''<div class="card"><div class="row"><div class="name">SINCRONIAIA TPV Alimentación / Carnicería</div><span class="status review">LAB ACTUAL · PRUEBA REAL</span></div><div class="desc"><b>Ruta actual de trabajo validada en pruebas reales:</b> venta por Carnicería, Charcutería y Elaborados; vendedores; catálogo/edición; secciones y subsecciones; tickets y cobros; Encargos; cobro separado de recogida; compra adicional antes del cobro; resumen visual <b>Encargo preparado + Compra adicional + Total a cobrar</b>; y cierre final del ticket con dos destinos independientes: <b>CERRAR → Ventas</b> y <b>VOLVER A ENCARGOS → Centro de Encargos</b>.</div><div class="meta"><b>Validado 11/09/2026:</b> flujo preparar → generar ticket → cobrar/entregar o dejar pendiente de recoger → recoger posteriormente; compra adicional integrada en el mismo cobro antes de pagar; desglose visual del importe; cierre del ticket en origen sin parches externos. <b>No se declara MASTER global:</b> quedan pruebas pendientes, entre ellas compra adicional cuando el ticket principal ya está cobrado, impresión MX06/Fun Print y sellado completo X/Z.</div><a class="btn" target="_blank" rel="noopener" href="../tpv-alimentacion-lab-verificado-20260908-cerrar/">Abrir TPV Carnicería · LAB actual</a><a class="btn alt" target="_blank" rel="noopener" href="../tpv-alimentacion-consulta-articulos/">Abrir consulta de artículos</a></div>'''
          for old,new,label in [(old_rule,new_rule,'master rule'),(old_card,new_card,'TPV card')]:
              count=s.count(old)
              if count!=1:
                  raise SystemExit(f'{label}: expected 1 match, found {count}')
              s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
      - name: Verify source update
        shell: bash
        run: |
          grep -F "consultar el MASTER y la continuidad activa" centro-control/index.html
          grep -F "tpv-alimentacion-lab-verificado-20260908-cerrar" centro-control/index.html
          grep -F "CERRAR → Ventas" centro-control/index.html
          grep -F "VOLVER A ENCARGOS → Centro de Encargos" centro-control/index.html
      - name: Commit update and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/update-centro-control-20260911.yml
          git config user.name "SINCRONIAIA Centro Control"
          git config user.email "actions@users.noreply.github.com"
          git add centro-control/index.html .github/workflows/update-centro-control-20260911.yml
          git commit -m "Centro de Control: actualizar TPV y reglas MASTER 11/09"
          git push
