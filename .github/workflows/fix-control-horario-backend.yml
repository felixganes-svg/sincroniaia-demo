name: Validate Control Horario backend root

on:
  push:
    paths:
      - '.github/workflows/fix-control-horario-backend.yml'

permissions:
  contents: write

jobs:
  validate-and-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Corregir llave residual y validar estructura
        shell: python
        run: |
          from pathlib import Path
          import re

          p=Path('control-horario-personal/app-base.html')
          s=p.read_text(encoding='utf-8')
          bad="'NO_DISPONIBLE')}}}\nasync function doPunch"
          good="'NO_DISPONIBLE')}}\nasync function doPunch"
          assert s.count(bad)==1, f'Llave residual esperada no encontrada exactamente una vez: {s.count(bad)}'
          s=s.replace(bad,good,1)
          assert "apiGet('consultar_fichajes'" in s
          assert "action:'fichaje'" in s
          assert "TIMEOUT_BACKEND" in s
          assert "horas_contrato_semana" in s
          p.write_text(s,encoding='utf-8')

          scripts=re.findall(r'<script>(.*?)</script>',s,re.S)
          assert len(scripts)==1, f'Se esperaba un script principal, encontrados {len(scripts)}'
          Path('/tmp/control-horario.js').write_text(scripts[0],encoding='utf-8')

      - name: Validar JavaScript real
        run: |
          node --check /tmp/control-horario.js
          git diff --check
          grep -q "apiGet('consultar_fichajes'" control-horario-personal/app-base.html
          grep -q "action:'fichaje'" control-horario-personal/app-base.html
          grep -q "20260916-backend-central-root" control-horario-personal/index.html

      - name: Commit de validación
        run: |
          git config user.name "SINCRONIAIA automation"
          git config user.email "actions@users.noreply.github.com"
          git add control-horario-personal/app-base.html
          git commit -m "fix(control-horario): corregir sintaxis y validar backend central"
          git push
