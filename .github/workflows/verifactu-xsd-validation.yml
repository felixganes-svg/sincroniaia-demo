name: verifactu xsd validation

on:
  push:
    branches: [main]
    paths:
      - 'verifactu-lab-desarrollo/xsd-validation/**'
      - '.github/workflows/verifactu-xsd-validation.yml'
  workflow_dispatch:

jobs:
  validate-xsd:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validator
        run: python -m pip install --disable-pip-version-check lxml
      - name: Validate against official AEAT XSD
        run: python verifactu-lab-desarrollo/xsd-validation/validate_xsd.py
