name: Restore Control Horario vacations
on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/restore-control-vacations.yml'
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore vacation dates without replacing the master
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('control-horario-personal/index.html')
          s = p.read_text(encoding='utf-8')
          vacation = ','.join(f"'{d}':{{type:'vacation',label:'Vacaciones'}}" for d in [
            '2026-07-28','2026-07-29','2026-07-30','2026-07-31',
            '2026-08-01','2026-08-02','2026-08-03','2026-08-04','2026-08-05','2026-08-06','2026-08-07','2026-08-08','2026-08-09','2026-08-10','2026-08-11','2026-08-12','2026-08-13','2026-08-14','2026-08-15','2026-08-16','2026-08-17'
          ])
          replacement = "const SPECIAL_DAYS={'2026-07-27':{type:'holiday',label:'Festivo local'}," + vacation + "};"
          pattern = r"const SPECIAL_DAYS=\{[^\n]*\};"
          new, n = re.subn(pattern, replacement, s, count=1)
          if n != 1:
              raise SystemExit('SPECIAL_DAYS not found exactly once')
          if new == s:
              raise SystemExit('No change needed')
          p.write_text(new, encoding='utf-8')
          PY
      - name: Commit fix and remove one-shot workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/restore-control-vacations.yml
          git add control-horario-personal/index.html
          git commit -m 'Restore vacations in Control Horario MASTER calendar'
          git push
