<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>SINCRONIAIA TPV Local Red · PILOTO v0.1</title>
<style>
:root{--navy:#0f2238;--blue:#155eef;--teal:#0f766e;--purple:#7c3aed;--orange:#ea580c;--bg:#f4f7fb;--line:#d9e2ec;--ink:#102033;--red:#c62828}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial}header{position:sticky;top:0;z-index:5;background:var(--navy);color:#fff;padding:12px 14px}header b{display:block;font-size:18px}header small{color:#cfe5e2}main{max-width:1280px;margin:auto;padding:12px 12px 96px}.panel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;margin:10px 0;box-shadow:0 8px 25px #1020330d}.grid{display:grid;gap:10px}.two{grid-template-columns:1fr 1fr}.three{grid-template-columns:repeat(3,1fr)}.four{grid-template-columns:repeat(4,1fr)}button,input,select,textarea{font:inherit}button{border:0;border-radius:14px;padding:13px;font-weight:900;background:#e8eef5;color:var(--ink);cursor:pointer}button.primary{background:var(--blue);color:#fff}button.brand{background:var(--teal);color:#fff}button.purple{background:var(--purple);color:#fff}button.orange{background:var(--orange);color:#fff}button.danger{background:#fee4e2;color:var(--red)}button:disabled{opacity:.45}input,select,textarea{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;background:#fff}.home button{min-height:100px;font-size:20px}.menu{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.menu button{min-height:74px;font-size:17px}.products{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.prod{text-align:left;background:#fff;border:1px solid var(--line)}.prod b,.prod small{display:block}.prod small,.muted{color:#667085}.line{display:grid;grid-template-columns:1fr auto;gap:10px;border-bottom:1px solid var(--line);padding:9px 0}.notice{padding:10px;border-radius:12px;background:#ecfdf3;border:1px solid #b7ebc6;color:#14532d}.warn{padding:10px;border-radius:12px;background:#fff7ed;border:1px solid #fed7aa;color:#7c2d12}.status{display:inline-block;border-radius:999px;padding:5px 9px;background:#e8eef5;font-weight:800}.status.on{background:#dcfce7;color:#166534}.bar{position:fixed;left:0;right:0;bottom:0;background:var(--navy);padding:9px 12px calc(9px + env(safe-area-inset-bottom));z-index:10}.bar>div{max-width:1280px;margin:auto;display:grid;grid-template-columns:1fr 1fr;gap:8px}.modal{display:none;position:fixed;inset:0;background:#0008;z-index:20;align-items:flex-end}.modal.open{display:flex}.modalBox{width:100%;max-width:800px;max-height:90vh;overflow:auto;margin:auto;background:#fff;padding:16px;border-radius:20px 20px 0 0}table{width:100%;border-collapse:collapse}th,td{padding:8px;border-bottom:1px solid var(--line);text-align:left}.scroll{overflow:auto}.top{display:flex;justify-content:space-between;gap:10px;align-items:center}.total{font-size:25px;font-weight:1000}.device{background:#dff6ff;border:1px solid #8ed8f8;border-radius:10px;padding:7px 10px;color:#075985}
@media(max-width:800px){header{padding:9px 10px}main{padding:7px 8px 92px}.panel{padding:10px;margin:7px 0}.two,.three,.four{grid-template-columns:1fr}.home{grid-template-columns:1fr 1fr}.menu{grid-template-columns:1fr 1fr}.products{grid-template-columns:1fr 1fr}.products .prod{min-height:72px}.bar>div{grid-template-columns:1fr 1fr}h2{font-size:21px}.modalBox{padding-bottom:calc(16px + env(safe-area-inset-bottom))}}
@media print{body>*{display:none!important}.modal.open{display:block!important;position:static;background:#fff}.modalBox>*{display:none!important}#printTicket{display:block!important}}
</style></head><body><header><b>SINCRONIAIA TPV Alimentación</b><small>LOCAL RED · PILOTO v0.1 · Cable Ethernet y Wi-Fi</small></header><main id="app"></main><div class="bar" id="bar" style="display:none"><div><button onclick="home()">MENÚ PRINCIPAL</button><button class="primary" onclick="chooseSubtotal()">SUBTOTAL</button></div></div><div class="modal" id="modal"><div class="modalBox" id="modalBox"></div></div>
<script>
let data={company:'',products:[],sellers:[],carts:[],orders:[]},screen='home',area='',subcat='',adminCode='',pendingProduct=null,orderDraft=[],device=localStorage.getItem('tpv_red_device')||'';
const $=id=>document.getElementById(id),euro=n=>Number(n||0).toLocaleString('es-ES',{style:'currency',currency:'EUR'}),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
async function api(path,opt={}){let r=await fetch('/api'+path,{headers:{'Content-Type':'application/json','X-Admin-Code':adminCode,...opt.headers},...opt});let j=await r.json();if(!r.ok)throw new Error(j.error||'Error de comunicación');return j}
async function refresh(){data=await api('/bootstrap');render()}
function modal(html){$('modalBox').innerHTML=html;$('modal').classList.add('open')}function closeModal(){$('modal').classList.remove('open')}
function flash(msg){let n=document.createElement('div');n.textContent=msg;n.style='position:fixed;top:70px;left:50%;transform:translateX(-50%);z-index:50;background:#14532d;color:#fff;padding:12px 18px;border-radius:999px;font-weight:900';document.body.append(n);setTimeout(()=>n.remove(),1800)}
function home(){screen='home';area='';subcat='';render()}
function render(){let app=$('app');$('bar').style.display=screen==='sale'?'block':'none';if(screen==='home')return app.innerHTML=`<div class="panel"><h1>${esc(data.company||'SINCRONIAIA TPV')}</h1><p class="device">Puesto: <b>${esc(device||'Sin identificar')}</b> · Base compartida del servidor local</p><div class="grid home"><button class="primary" onclick="companyLogin()">EMPRESA</button><button class="brand" onclick="screen='sellers';render()">VENDEDORES</button></div></div>`;if(screen==='sellers')return renderSellers(app);if(screen==='sale')return renderSale(app);if(screen==='company')return renderCompany(app)}
function renderSellers(app){app.innerHTML=`<div class="panel top"><h2>Vendedores</h2><button onclick="home()">← Inicio</button></div><div class="panel"><div class="grid two"><button class="primary" onclick="loginSeller()">INICIAR VENDEDOR</button><button onclick="identifyDevice()">IDENTIFICAR PUESTO</button></div>${data.sellers.map(s=>`<div class="line"><div><b>${esc(s.name)}</b><br><small>Código ${esc(s.code)} · ${cartInfo(s.id)}</small></div><span class="status ${s.active?'on':''}">${s.active?'Activo':'No iniciado'}</span></div>`).join('')}<p><button class="brand" ${data.sellers.some(s=>s.active)?'':'disabled'} onclick="screen='sale';render()">ENTRAR EN VENTA</button></p></div>`}
function cartInfo(id){let c=data.carts.find(x=>x.seller_id===id);return c?`${c.lines} artículos pendientes`:'Sin venta'}
function identifyDevice(){modal(`<h2>Nombre del puesto</h2><input id="deviceName" value="${esc(device)}" placeholder="Ej: Carnicería 1"><p><button class="primary" onclick="device=ask('deviceName');localStorage.setItem('tpv_red_device',device);closeModal();render()">Guardar</button> <button onclick="closeModal()">Cancelar</button></p>`)}
function ask(id){return $(id)?.value?.trim()||''}
function loginSeller(){modal(`<h2>Iniciar vendedor</h2><label>Código</label><input id="sellerCode" inputmode="numeric"><label>PIN</label><input id="sellerPin" type="password" inputmode="numeric"><p><button class="primary" onclick="doSellerLogin()">Entrar</button> <button onclick="closeModal()">Cancelar</button></p>`)}
async function doSellerLogin(){try{await api('/sellers/login',{method:'POST',body:JSON.stringify({code:ask('sellerCode'),pin:ask('sellerPin')})});closeModal();await refresh();flash('Vendedor iniciado')}catch(e){alert(e.message)}}
function renderSale(app){let areas=['Carne','Charcutería','Elaborados','Código','A–Z','Encargos'];if(!area)return app.innerHTML=`<div class="panel top"><h2>Venta · ${esc(device||'Puesto')}</h2><button onclick="screen='sellers';render()">Vendedores</button></div><div class="panel"><div class="menu">${areas.map((a,i)=>`<button class="${['brand','purple','orange','','',''][i]}" onclick="openArea('${a}')">${a==='Carne'?'Carnicería':a}</button>`).join('')}</div></div><div class="panel"><h3>Ventas abiertas en la red</h3>${data.sellers.map(s=>`<div class="line"><b>${esc(s.name)}</b><span>${cartInfo(s.id)}</span></div>`).join('')}</div>`;
 if(area==='Encargos')return renderSaleOrders(app);if(area==='Código'){setTimeout(codeSearch,0);area='';return}let products=data.products.filter(p=>p.active&&(area==='A–Z'||p.area===area));if(!subcat&&area!=='A–Z'){let subs=[...new Set(products.map(p=>p.subcat))].sort();return app.innerHTML=`<div class="panel top"><h2>${area==='Carne'?'Carnicería':esc(area)}</h2><button onclick="area='';render()">← Accesos</button></div><div class="panel menu">${subs.map(s=>`<button onclick="subcat='${esc(s)}';render()">${esc(s)}</button>`).join('')}</div>`}if(subcat)products=products.filter(p=>p.subcat===subcat);app.innerHTML=`<div class="panel top"><h2>${esc(subcat||'Artículos A–Z')}</h2><button onclick="subcat?subcat='':area='';render()">← Volver</button></div><div class="panel"><input placeholder="Buscar por nombre o código" oninput="filterProducts(this.value)"><div class="products" id="productGrid">${productButtons(products)}</div></div>`}
function productButtons(ps){return ps.map(p=>`<button class="prod" data-search="${esc((p.code+' '+p.name).toLowerCase())}" onclick="productQty('${p.code}')"><b>${esc(p.name)}</b><small>${p.code} · ${euro(p.price)}/${p.unit}</small></button>`).join('')||'<p>No hay artículos.</p>'}
function filterProducts(q){q=q.toLowerCase();document.querySelectorAll('.prod').forEach(b=>b.style.display=b.dataset.search.includes(q)?'block':'none')}
function openArea(a){area=a;subcat='';render()}
function codeSearch(){modal(`<h2>Venta por código</h2><input id="codeInput" inputmode="numeric" placeholder="Ej: 78"><p><button class="primary" onclick="let p=data.products.find(x=>Number(x.code)===Number(ask('codeInput')));if(!p)return alert('Código no encontrado');closeModal();productQty(p.code)">Buscar</button> <button onclick="closeModal()">Cancelar</button></p>`)}
function productQty(code){pendingProduct=data.products.find(p=>p.code===code);modal(`<h2>${esc(pendingProduct.name)}</h2><p><b>${euro(pendingProduct.price)}/${pendingProduct.unit}</b></p><label>${pendingProduct.unit==='kg'?'Peso indicado (kg)':'Unidades'}</label><input id="qty" type="number" inputmode="decimal" step="${pendingProduct.unit==='kg'?'0.001':'1'}"><div id="tareBlock" ${pendingProduct.unit==='kg'?'':'style="display:none"'}><label>T · Tara opcional (kg)</label><input id="tare" type="number" inputmode="decimal" step="0.001" value="0"></div><p><button class="primary" onclick="chooseSellerForLine()">ENTRAR</button> <button onclick="closeModal()">Cancelar</button></p>`)}
function chooseSellerForLine(){let qty=Number($('qty').value),tare=Number($('tare')?.value||0);if(qty<=0||tare<0||tare>=qty)return alert('Revisa el peso, unidades o tara.');modal(`<h2>Elegir vendedor</h2><p>${esc(pendingProduct.name)} · ${qty} ${pendingProduct.unit}${tare?` · Tara ${tare} kg`:''}</p><div class="grid two">${data.sellers.map(s=>`<button ${s.active?'':'disabled'} onclick="addLine(${s.id},${qty},${tare})">${esc(s.name)}</button>`).join('')}</div><p><button onclick="productQty('${pendingProduct.code}')">Volver</button></p>`)}
async function addLine(seller,qty,tare){try{await api('/cart/items',{method:'POST',body:JSON.stringify({seller_id:seller,code:pendingProduct.code,qty,tare})});closeModal();area='';subcat='';await refresh();screen='sale';flash('Artículo guardado')}catch(e){alert(e.message)}}
function chooseSubtotal(){modal(`<h2>Subtotal por vendedor</h2>${data.sellers.map(s=>{let c=data.carts.find(x=>x.seller_id===s.id);return `<div class="line"><div><b>${esc(s.name)}</b><br><small>${c?c.lines+' artículos':'Sin venta'}</small></div><button ${c?'':'disabled'} onclick="showCart(${s.id})">Ver</button></div>`}).join('')}<p><button onclick="closeModal()">Cerrar</button></p>`)}
async function showCart(sid){try{let r=await api('/cart?seller='+sid),s=data.sellers.find(x=>x.id===sid),total=r.lines.reduce((a,x)=>a+x.total,0);modal(`<h2>Subtotal · ${esc(s.name)}</h2>${r.lines.map(x=>`<div class="line"><div><b>${esc(x.name)}</b><br><small>${x.net_qty} ${x.unit} × ${euro(x.price)}</small></div><div><b>${euro(x.total)}</b> <button class="danger" onclick="removeCartLine(${x.id},${sid})">Quitar</button></div></div>`).join('')}<p class="total">TOTAL ${euro(total)}</p><div class="grid two"><button onclick="closeModal()">SEGUIR VENDIENDO</button><button class="primary" onclick="payment(${sid},${total})">COBRAR</button></div>`)}catch(e){alert(e.message)}}
async function removeCartLine(id,sid){if(!confirm('¿Quitar este artículo de la venta abierta?'))return;try{await api('/cart/items/'+id,{method:'DELETE'});await refresh();screen='sale';showCart(sid)}catch(e){alert(e.message)}}
function payment(sid,total){modal(`<h2>Cobrar ${euro(total)}</h2><label>Forma de pago</label><select id="payMethod" onchange="$('cashBox').style.display=this.value==='Efectivo'?'block':'none'"><option>Efectivo</option><option>Tarjeta</option><option>Bizum</option><option>Mixto</option></select><div id="cashBox"><label>Entrega cliente</label><input id="cashGiven" type="number" inputmode="decimal" step="0.01"></div><p><button class="primary" onclick="closeTicket(${sid})">FINALIZAR TICKET</button> <button onclick="showCart(${sid})">Volver</button></p><p class="warn">Al finalizar, el ticket queda cerrado e inalterable.</p>`)}
async function closeTicket(sid){try{let r=await api('/tickets',{method:'POST',body:JSON.stringify({seller_id:sid,method:$('payMethod').value,cash_given:Number($('cashGiven')?.value||0),device:device||'Puesto sin identificar'})});modal(`<div id="printTicket"><h2>TICKET Nº ${r.number}</h2><p>${esc(data.company)}<br>${new Date().toLocaleString('es-ES')}</p><p class="total">TOTAL ${euro(r.total)}</p>${r.change!==null?`<p><b>DEVOLUCIÓN: ${euro(r.change)}</b></p>`:''}<p>Ticket cerrado e inalterable.</p></div><button class="primary" onclick="window.print()">Imprimir</button> <button onclick="closeModal();area='';refresh();screen='sale'">Cerrar</button>`)}catch(e){alert(e.message)}}
function companyLogin(){modal(`<h2>Acceso Empresa</h2><input id="adminInput" type="password" placeholder="Código Empresa"><p><button class="primary" onclick="doCompanyLogin()">Entrar</button> <button onclick="closeModal()">Cancelar</button></p><small>Prueba: 1234</small>`)}
async function doCompanyLogin(){adminCode=ask('adminInput');try{await api('/admin/login',{method:'POST',body:'{}'});closeModal();screen='company';renderCompany($('app'))}catch(e){adminCode='';alert(e.message)}}
function renderCompany(app,tab='menu'){if(tab==='menu')return app.innerHTML=`<div class="panel top"><h2>Empresa</h2><button onclick="home()">← Salir</button></div><div class="panel menu"><button onclick="renderCompany($('app'),'products')">ARTÍCULOS</button><button onclick="companyTickets()">TICKETS</button><button onclick="renderCompany($('app'),'orders')">ENCARGOS</button><button onclick="refresh()">ACTUALIZAR RED</button></div><div class="panel"><p class="notice">Los cambios de Empresa quedan en el servidor local y aparecen en todos los puestos.</p></div>`;if(tab==='products')return app.innerHTML=`<div class="panel top"><h2>Artículos</h2><button onclick="renderCompany($('app'))">← Empresa</button></div><div class="panel"><input placeholder="Buscar" oninput="filterProductTable(this.value)"><div class="scroll"><table><thead><tr><th>Código</th><th>Artículo</th><th>Precio</th><th>Acción</th></tr></thead><tbody id="productTable">${data.products.map(p=>`<tr data-search="${esc((p.code+' '+p.name).toLowerCase())}"><td>${p.code}</td><td>${esc(p.name)}</td><td>${euro(p.price)}</td><td><button onclick="editProduct('${p.code}')">Editar</button></td></tr>`).join('')}</tbody></table></div></div>`;if(tab==='orders')renderCompanyOrders(app)}
function filterProductTable(q){q=q.toLowerCase();document.querySelectorAll('#productTable tr').forEach(r=>r.style.display=r.dataset.search.includes(q)?'table-row':'none')}
function editProduct(code){let p=data.products.find(x=>x.code===code);modal(`<h2>Editar artículo ${p.code}</h2><label>Nombre</label><input id="epName" value="${esc(p.name)}"><label>Precio</label><input id="epPrice" type="number" step="0.01" value="${p.price}"><label>Familia</label><select id="epArea"><option ${p.area==='Carne'?'selected':''}>Carne</option><option ${p.area==='Charcutería'?'selected':''}>Charcutería</option><option ${p.area==='Elaborados'?'selected':''}>Elaborados</option></select><label>Subsección</label><input id="epSub" value="${esc(p.subcat)}"><p><button class="primary" onclick="saveProduct('${p.code}')">Guardar</button> <button onclick="closeModal()">Cancelar</button></p>`)}
async function saveProduct(code){try{await api('/products/'+code,{method:'PUT',body:JSON.stringify({name:ask('epName'),price:Number($('epPrice').value),area:$('epArea').value,subcat:ask('epSub'),active:true})});closeModal();await refresh();screen='company';renderCompany($('app'),'products');flash('Artículo actualizado en la red')}catch(e){alert(e.message)}}
async function companyTickets(){try{let r=await api('/tickets');$('app').innerHTML=`<div class="panel top"><h2>Tickets inalterables</h2><button onclick="renderCompany($('app'))">← Empresa</button></div><div class="panel"><p class="notice">Solo consulta y reimpresión. No existe editar ni eliminar.</p><div class="scroll"><table><thead><tr><th>Número</th><th>Fecha</th><th>Vendedor</th><th>Pago</th><th>Total</th><th></th></tr></thead><tbody>${r.tickets.map(t=>`<tr><td>${t.number}</td><td>${esc(t.created_at)}</td><td>${esc(t.seller_name)}</td><td>${esc(t.method)}</td><td>${euro(t.total)}</td><td><button onclick="viewTicket('${t.number}')">Ver</button></td></tr>`).join('')}</tbody></table></div></div>`}catch(e){alert(e.message)}}
async function viewTicket(n){let r=await api('/tickets/'+n),t=r.ticket;modal(`<div id="printTicket"><h2>TICKET Nº ${t.number}</h2><p>${esc(t.created_at)}<br>${esc(t.seller_name)} · ${esc(t.method)}</p>${r.lines.map(l=>`<div class="line"><div><b>${esc(l.name)}</b><br>${l.qty} ${l.unit} × ${euro(l.price)}</div><b>${euro(l.total)}</b></div>`).join('')}<p class="total">TOTAL ${euro(t.total)}</p></div><button class="primary" onclick="window.print()">Reimprimir</button> <button onclick="closeModal()">Cerrar</button>`)}
function renderCompanyOrders(app){let options=data.products.map(p=>`<option value="${p.code}">${p.code} · ${esc(p.name)}</option>`).join('');app.innerHTML=`<div class="panel top"><h2>Encargos de la red</h2><button onclick="renderCompany($('app'))">← Empresa</button></div><div class="panel"><h3>Crear encargo</h3><div class="grid two"><div><label>Cliente</label><input id="oCustomer"></div><div><label>Teléfono</label><input id="oPhone"></div><div><label>Fecha y hora recogida</label><input id="oDate" type="datetime-local"></div><div><label>Notas generales</label><input id="oGeneral" placeholder="Ej: llamar al preparar"></div></div><h3>Artículos del encargo</h3><div class="grid three"><div><label>Artículo</label><select id="oProduct">${options}</select></div><div><label>Peso estimado / unidades</label><input id="oQty" type="number" step="0.001"></div><div><label>Preparación</label><input id="oNotes" placeholder="Ej: alas cortadas"></div></div><p><button onclick="addOrderDraft()">AÑADIR ARTÍCULO</button></p><div id="orderDraft">${orderDraftHtml()}</div><p><button id="saveOrderBtn" class="primary" ${orderDraft.length?'':'disabled'} onclick="createOrder()">GUARDAR ENCARGO</button></p></div><div class="panel"><h3>Pendientes</h3>${data.orders.map(o=>`<div class="line"><div><b>${esc(o.number)} · ${esc(o.customer)}</b><br><small>${esc(o.collection_at)} · ${esc(o.status)}</small></div><span class="status">${esc(o.status)}</span></div>`).join('')||'<p>No hay encargos.</p>'}</div>`}
function orderDraftHtml(){return orderDraft.map((x,i)=>`<div class="line"><div><b>${esc(x.name)}</b><br><small>${x.qty} ${x.unit} · ${esc(x.notes||'Sin preparación especial')}</small></div><button class="danger" onclick="removeOrderDraft(${i})">Quitar</button></div>`).join('')||'<p class="muted">Todavía no se han añadido artículos.</p>'}
function refreshOrderDraft(){if($('orderDraft'))$('orderDraft').innerHTML=orderDraftHtml();if($('saveOrderBtn'))$('saveOrderBtn').disabled=!orderDraft.length}
function removeOrderDraft(i){orderDraft.splice(i,1);refreshOrderDraft()}
function addOrderDraft(){let p=data.products.find(x=>x.code===$('oProduct').value),qty=Number($('oQty').value);if(!p||qty<=0)return alert('Indica artículo y peso o unidades.');orderDraft.push({code:p.code,name:p.name,qty,unit:p.unit,notes:ask('oNotes')});$('oQty').value='';$('oNotes').value='';refreshOrderDraft()}
async function createOrder(){try{await api('/orders',{method:'POST',body:JSON.stringify({customer:ask('oCustomer'),phone:ask('oPhone'),collection_at:$('oDate').value,notes:ask('oGeneral'),items:orderDraft})});orderDraft=[];await refresh();screen='company';renderCompany($('app'),'orders');flash('Encargo guardado en el servidor')}catch(e){alert(e.message)}}
function renderSaleOrders(app){app.innerHTML=`<div class="panel top"><h2>Encargos</h2><button onclick="area='';render()">← Accesos</button></div><div class="panel">${data.orders.filter(o=>o.status==='Pendiente').map(o=>`<div class="line"><div><b>${esc(o.number)} · ${esc(o.customer)}</b><br><small>${esc(o.collection_at)} · ${esc(o.notes||'')}</small></div><button onclick="loadOrder(${o.id})">Cargar en venta</button></div>`).join('')||'<p>No hay encargos pendientes.</p>'}</div>`}
async function loadOrder(id){try{let r=await api('/orders/'+id);modal(`<h2>${esc(r.order.number)} · Peso definitivo</h2><p class="warn">Introduce el peso o las unidades realmente preparadas antes de cargar el encargo en venta.</p>${r.lines.map(l=>`<div class="line"><div><b>${esc(l.name)}</b><br><small>${esc(l.notes||'')}</small></div><input style="max-width:150px" data-order-line="${l.id}" type="number" step="0.001" value="${l.qty}"></div>`).join('')}<h3>Vendedor que cobrará</h3><div class="grid two">${data.sellers.map(s=>`<button ${s.active?'':'disabled'} onclick="doLoadOrder(${id},${s.id})">${esc(s.name)}</button>`).join('')}</div><p><button onclick="closeModal()">Cancelar</button></p>`)}catch(e){alert(e.message)}}
async function doLoadOrder(id,sid){let quantities=[...document.querySelectorAll('[data-order-line]')].map(x=>({line_id:Number(x.dataset.orderLine),qty:Number(x.value)}));try{await api('/orders/'+id+'/cart',{method:'POST',body:JSON.stringify({seller_id:sid,quantities})});closeModal();area='';await refresh();screen='sale';flash('Encargo cargado con el peso definitivo')}catch(e){alert(e.message)}}
refresh().catch(e=>$('app').innerHTML=`<div class="panel"><h2>No se encuentra el servidor local</h2><p class="warn">${esc(e.message)}</p><p>Comprueba que el ordenador principal tiene iniciado server.py y que este dispositivo está conectado a la misma red.</p></div>`);
</script></body></html>
